          {

            text: "Which word completes this tongue twister: 'The ___ ___ ran around the ___ area'?",
            options: ["sixth sick sheik's", "sixth sheep's sixth", "sick sixth sheik's", "sheep's sixth sick"],
            correct: 0
          }
        ]
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      initializeTest();
      setTimeout(initValidation, 100);
      initializeCountdown();
      initializeTabSwitchDetection();
      initializeProtection();
    });

    function initializeTest() {
      const storedPronunciation = localStorage.getItem('basic_english_pronoun_5_selected');
      
      let selectedPronunciation;
      if (storedPronunciation) {
        selectedPronunciation = pronunciationData.find(pronunciation => pronunciation.id === parseInt(storedPronunciation));
      } else {
        const randomPronunciationIndex = Math.floor(Math.random() * pronunciationData.length);
        selectedPronunciation = pronunciationData[randomPronunciationIndex];
        localStorage.setItem('basic_english_pronoun_5_selected', selectedPronunciation.id.toString());
      }
      
      displayPronunciation(selectedPronunciation);
      const selectedQuestions = selectRandomQuestions(selectedPronunciation.questions, 5);
      displayQuestions(selectedQuestions);
      localStorage.setItem('basic_english_pronoun_5_questions', JSON.stringify(selectedQuestions.map(q => q.id)));
    }

    function displayPronunciation(pronunciation) {
      const mainCard = document.getElementById('mainCard');
      mainCard.innerHTML = '';
      
      const pronunciationElement = document.createElement('div');
      pronunciationElement.className = 'pronunciation-selection';
      pronunciationElement.innerHTML = `
        <div class="inner-card">
          <p class="font-bold text-center mb-1">
            Basic English Pronunciation Test
          </p>
          <p class="text-center mb-3">
            Listen to the words and answer questions 1-5.
          </p>
          <p class="font-bold mb-2">${pronunciation.title}</p>
          
          <div class="pronunciation-words">
            ${pronunciation.words.map((wordObj, index) => `
              <div class="pronunciation-item mb-4">
                <div class="pronunciation-word">${wordObj.word}</div>
                <div class="pronunciation-audio">
                  <button class="audio-btn play-word-btn" data-word="${wordObj.word}">
                    <i class="fas fa-volume-up mr-2"></i>Listen to "${wordObj.word}"
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
          
          <div class="text-sm text-gray-600 text-center">
            <p><strong>Instructions:</strong> Click the buttons to hear each word pronounced. Pay attention to silent letters and stress patterns.</p>
          </div>
        </div>
      `;
      
      mainCard.appendChild(pronunciationElement);
      
      // Initialize audio functionality
      initializeWordAudio();
    }

    function initializeWordAudio() {
      const playButtons = document.querySelectorAll('.play-word-btn');
      
      playButtons.forEach(button => {
        button.addEventListener('click', function() {
          const word = this.getAttribute('data-word');
          speakWord(word);
        });
      });
    }

    function speakWord(word) {
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.rate = 0.8;
      utterance.pitch = 1;
      utterance.volume = 1;
      utterance.lang = 'en-US';
      
      window.speechSynthesis.speak(utterance);
    }

    function selectRandomQuestions(questions, count) {
      if (questions.length <= count) {
        return [...questions];
      }
      
      const shuffled = [...questions];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      return shuffled.slice(0, count);
    }

    function displayQuestions(questions) {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';
      
      questions.forEach((question, index) => {
        const questionElement = document.createElement('section');
        questionElement.className = 'card rounded-xl mt-6 question-card';
        questionElement.setAttribute('aria-label', `Question ${index + 1}`);
        
        let optionsHTML = '';
        question.options.forEach((option, optionIndex) => {
          optionsHTML += `
            <label>
              <input class="mr-1" name="q${question.id}" type="radio" value="${option}" ${optionIndex === question.correct ? 'data-correct="true"' : ''} />
              ${option}
            </label>
          `;
        });
        
        questionElement.innerHTML = `
          <p class="mb-2 text-[10px] font-semibold">
            ${index + 1}. ${question.text}
          </p>
          <form>
            ${optionsHTML}
          </form>
        `;
        
        container.appendChild(questionElement);
      });
    }

    let questionCount = 0;
    let answeredCount = 0;

    function initValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) names.add(radio.name);
        }
      });

      questionCount = names.size;
      if (questionCount === 0) return;

      radios.forEach(radio => {
        radio.addEventListener('change', updateValidation);
      });

      addProgressIndicator();
      updateValidation();
    }

    function updateValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();
      const answered = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) {
            names.add(radio.name);
            if (radio.checked) answered.add(radio.name);
          }
        }
      });

      answeredCount = answered.size;
      updateProgressIndicator();

      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) {
        if (answeredCount === questionCount) {
          nextBtn.style.opacity = '1';
          nextBtn.style.pointerEvents = 'auto';
          nextBtn.removeAttribute('data-disabled');
        } else {
          nextBtn.style.opacity = '0.6';
          nextBtn.style.pointerEvents = 'none';
          nextBtn.setAttribute('data-disabled', 'true');
        }
      }
    }

    function addProgressIndicator() {
      if (document.querySelector('.progress-indicator')) return;

      const progress = document.createElement('div');
      progress.className = 'progress-indicator';
      progress.innerHTML = `<span id="progress-text">Progress: 0/${questionCount}</span>`;
      document.body.appendChild(progress);
    }

    function updateProgressIndicator() {
      const text = document.getElementById('progress-text');
      if (text) {
        text.textContent = `Progress: ${answeredCount}/${questionCount}`;
        const indicator = document.querySelector('.progress-indicator');
        if (answeredCount === questionCount) {
          indicator.style.borderLeftColor = '#10b981';
          text.textContent += ' ✓';
        }
      }
    }

    document.addEventListener('click', (e) => {
      const target = e.target.closest('#nextBtn[data-disabled="true"]');
      if (target) {
        e.preventDefault();
        alert(`Please answer all questions before proceeding!\nRemaining: ${questionCount - answeredCount} questions.`);
      }
    });

    function initializeCountdown() {
      const totalSeconds = 30 * 60;
      const progressBar = document.getElementById("progressBar");
      const timeDisplay = document.getElementById("timeDisplay");

      let remainingSeconds = totalSeconds;

      function updateCountdown() {
        if (remainingSeconds < 0) {
          remainingSeconds = 0;
          alert('Time is up! Test will end.');
          return;
        }

        if (progressBar) {
          progressBar.value = remainingSeconds;
        }

        if (timeDisplay) {
          const hours = Math.floor(remainingSeconds / 3600);
          const minutes = Math.floor((remainingSeconds % 3600) / 60);
          const seconds = remainingSeconds % 60;
          timeDisplay.textContent = `${hours}Hours ${minutes}Minutes ${seconds}Seconds`;
        }

        remainingSeconds--;
      }

      if (progressBar && timeDisplay) {
        updateCountdown();
        setInterval(updateCountdown, 1000);
      }
    }

    function initializeTabSwitchDetection() {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          setTimeout(() => {
            if (document.hidden) {
              alert('Warning: Please focus on the test page.');
            }
          }, 1000);
        }
      });
    }

    function initializeProtection() {
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) {
          e.preventDefault();
        }
      });
    }
  
    document.getElementById('nextBtn').addEventListener('click', function(e) {
      if (answeredCount === questionCount) {
        const radios = document.querySelectorAll('input[type="radio"]:checked');
        let correct = 0;
        let total = 0;
        
        radios.forEach(radio => {
          total++;
          if (radio.hasAttribute('data-correct')) {
            correct++;
          }
        });
        
        localStorage.setItem('basic_english_pronoun_5_answers', JSON.stringify({ correct, total }));
        
        calculateTotalScore();
      }
    });

    function calculateTotalScore() {
      let totalCorrect = 0;
      let totalQuestions = 0;
      
      for (let i = 1; i <= 5; i++) {
        const stored = localStorage.getItem(`basic_english_pronoun_${i}_answers`);
        if (stored) {
          const result = JSON.parse(stored);
          totalCorrect += result.correct;
          totalQuestions += result.total;
        }
      }
      
      localStorage.setItem('basic_english_pronoun_final_score', JSON.stringify({
        correct: totalCorrect,
        total: totalQuestions,
        percentage: Math.round((totalCorrect / totalQuestions) * 100)
      }));
    }
  </script>
