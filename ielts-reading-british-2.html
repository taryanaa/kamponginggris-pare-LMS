  <style>

    @media (max-width: 768px) { body { padding-top: 100px !important; } header { height: 90px !important; padding: 0 1.5rem; } .font-golden { font-size: 0.9rem; } header img { width: 80px; height: 80px; } }
    @media (max-width: 480px) { body { padding-top: 90px !important; } header { height: 80px !important; padding: 0 1rem; } .font-golden { font-size: 0.8rem; } header img { width: 60px; height: 60px; } }

    * { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

<body>

  <main class="max-w-4xl mx-auto px-6 py-8 flex-grow">

      <progress id="progressBar" max="1800" value="1800" aria-label="IELTS test progress bar" role="progressbar" aria-valuemin="0" aria-valuemax="1800" aria-valuenow="1800"></progress>

  <div class="next-button-container">
    <a href="ielts-reading-british-3.html" id="nextBtn" class="btn-animate inline-block text-center" aria-label="Next question">
      Next
    </a>
  </div>

  <script>
    const readingData = [
      {
        id: 1,
        title: "British Weather and Climate",
        text: `British weather is famous for being changeable and often rainy. The climate in Britain is temperate maritime, which means it is generally mild with cool winters and warm summers. However, the weather can change quickly throughout the day.

Rain is common throughout the year, but especially in autumn and winter. The west of Britain tends to be wetter than the east. Snow is not very common in most parts of Britain, especially in southern areas. When it does snow, it often causes disruption to transport.

British people often talk about the weather because it changes so frequently. It's common to experience sunshine, rain, and clouds all in one day. This changeable weather has influenced British culture and habits. Many British people carry umbrellas with them, just in case it rains.

Despite the reputation for bad weather, Britain has beautiful sunny days too, especially in spring and summer. The summer months from June to August are generally the warmest and sunniest, with temperatures averaging around 20°C.`,
        questions: [
          {
            id: 1,

          {

            options: [
              "Only in summer",

              "Never in winter"
            ],
            correct: 1
          },
          {
            id: 3,
            text: "Which part of Britain is wetter?",
            options: [
              "The east",
              "The west",
              "The north",
              "The south"
            ],
            correct: 1
          },
          {
            id: 4,
            text: "What do many British people carry with them?",
            options: [
              "Sunglasses",
              "Umbrellas",
              "Winter coats",
              "Fans"
            ],
            correct: 1
          },
          {
            id: 5,
            text: "What are the warmest months in Britain?",
            options: [
              "December to February",
              "March to May",
              "June to August",
              "September to November"
            ],
            correct: 2
          }
        ]
      },
      {
        id: 2,
        title: "British Transport System",
        text: `Britain has an extensive transport system that includes trains, buses, and the London Underground. The railway network covers most of the country, connecting cities and towns. Train travel is popular for longer journeys, though it can be expensive.

The London Underground, also known as the Tube, is the world's oldest underground railway system. It opened in 1863 and now has 11 lines serving 272 stations. The Tube is an efficient way to travel around London, though it can be very crowded during rush hours.

Red double-decker buses are iconic symbols of London. They operate throughout the city and are a popular way for both tourists and locals to get around. Many other cities in Britain also have bus systems that serve local communities.

For longer distances, Britain has motorways and A-roads that connect different parts of the country. Driving is on the left-hand side of the road in Britain, which can be confusing for visitors from countries that drive on the right.`,
        questions: [
          {
            id: 6,
            text: "What is the London Underground also called?",
            options: [
              "The Metro",
              "The Subway",
              "The Tube",
              "The Underground Railway"
            ],
            correct: 2
          },
          {
            id: 7,
            text: "When did the London Underground open?",
            options: [
              "1900",
              "1863",
              "1920",
              "1950"
            ],
            correct: 1
          },
          {
            id: 8,
            text: "What are the iconic red buses in London called?",
            options: [
              "Single-decker buses",
              "Double-decker buses",
              "Tourist buses",
              "City buses"
            ],
            correct: 1
          },
          {
            id: 9,
            text: "Which side of the road do British people drive on?",
            options: [
              "The right side",
              "The left side",
              "The middle",
              "It depends on the city"
            ],
            correct: 1
          },
          {
            id: 10,
            text: "What is mentioned about train travel in Britain?",
            options: [
              "It is always cheap",
              "It can be expensive",
              "It is not available",
              "It is only for tourists"
            ],
            correct: 1
          }
        ]
      },
      {
        id: 3,
        title: "British Sports and Leisure",
        text: `Sports play an important role in British culture. Football (soccer) is the most popular sport in Britain. The English Premier League is one of the most famous football leagues in the world. Many British people support local football teams and watch matches on weekends.

Cricket is another traditional British sport, especially popular in summer. Matches can last for several days in the longer format of the game. Rugby is also popular, with two main forms: rugby union and rugby league.

Tennis is famous because of the Wimbledon Championships, which take place in London every summer. Wimbledon is the oldest tennis tournament in the world and is known for its traditions, such as players wearing white and eating strawberries and cream.

Besides watching sports, many British people enjoy participating in activities like walking, cycling, and going to the gym. Parks are popular places for relaxation and exercise, especially in cities where green spaces provide a break from urban life.`,
        questions: [
          {
            id: 11,
            text: "What is the most popular sport in Britain?",
            options: [
              "Cricket",
              "Football",
              "Tennis",
              "Rugby"
            ],
            correct: 1
          },
          {
            id: 12,
            text: "When is cricket especially popular?",
            options: [
              "In winter",
              "In summer",
              "In spring",
              "All year round"
            ],
            correct: 1
          },
          {
            id: 13,
            text: "What is Wimbledon?",
            options: [
              "A football stadium",
              "A tennis tournament",
              "A cricket ground",
              "A rugby field"
            ],
            correct: 1
          },
          {
            id: 14,
            text: "What color do players wear at Wimbledon?",
            options: [
              "Blue",
              "Red",
              "White",
              "Green"
            ],
            correct: 2
          },
          {
            id: 15,
            text: "What do people traditionally eat at Wimbledon?",
            options: [
              "Fish and chips",
              "Strawberries and cream",
              "Sandwiches",
              "Ice cream"
            ],
            correct: 1
          }
        ]
      },
      {
        id: 4,
        title: "British Politeness and Manners",
        text: `British people are known for their politeness and good manners. Saying "please", "thank you", and "sorry" is very common in everyday interactions. Even when bumping into someone accidentally, British people often say "sorry".

Queuing (standing in line) is taken very seriously in Britain. People wait patiently in queues for buses, in shops, and at other public places. Pushing ahead in a queue is considered very rude.

British people value privacy and personal space. They often avoid asking personal questions when they first meet someone. Small talk about the weather is common as it's considered a safe and neutral topic.

Punctuality is important in British culture. Being on time for appointments, meetings, and social gatherings shows respect for other people's time. However, for some informal social events like parties, arriving a few minutes late is sometimes acceptable.`,
        questions: [
          {
            id: 16,
            text: "What are British people known for?",
            options: [
              "Being loud",
              "Politeness and good manners",
              "Being always late",
              "Not saying thank you"
            ],
            correct: 1
          },
          {
            id: 17,
            text: "What do British people do when they accidentally bump into someone?",
            options: [
              "Laugh",
              "Say nothing",
              "Say 'sorry'",
              "Get angry"
            ],
            correct: 2
          },
          {
            id: 18,
            text: "How do British people feel about queuing?",
            options: [
              "They don't like it",
              "They take it seriously",
              "They ignore queues",
              "They think it's unnecessary"
            ],
            correct: 1
          },
          {
            id: 19,
            text: "What is a common small talk topic in Britain?",
            options: [
              "Politics",
              "Religion",
              "The weather",
              "Personal income"
            ],
            correct: 2
          },
          {
            id: 20,
            text: "What is important in British culture regarding time?",
            options: [
              "Being fashionably late",
              "Punctuality",
              "Arriving very early",
              "Not watching the clock"
            ],
            correct: 1
          }
        ]
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      initializeTest();
      setTimeout(initValidation, 100);
      initializeCountdown();
      initializeTabSwitchDetection();
      initializeProtection();
    });

    function initializeTest() {
      const storedReading = localStorage.getItem('ielts_british_reading_2_selected');
      
      let selectedReading;
      if (storedReading) {
        selectedReading = readingData.find(reading => reading.id === parseInt(storedReading));
      } else {
        const randomReadingIndex = Math.floor(Math.random() * readingData.length);
        selectedReading = readingData[randomReadingIndex];
        localStorage.setItem('ielts_british_reading_2_selected', selectedReading.id.toString());
      }
      
      displayReading(selectedReading);
      const selectedQuestions = selectRandomQuestions(selectedReading.questions, 5);
      displayQuestions(selectedQuestions);
      localStorage.setItem('ielts_british_reading_2_questions', JSON.stringify(selectedQuestions.map(q => q.id)));
    }

    function displayReading(reading) {
      const mainCard = document.getElementById('mainCard');
      mainCard.innerHTML = '';
      
      const readingElement = document.createElement('div');
      readingElement.className = 'reading-selection';
      readingElement.innerHTML = `
        <div class="inner-card">
          <p class="font-bold text-center mb-1">
            IELTS A2 Reading - British Culture
          </p>
          <p class="text-center mb-3">
            Read the text and answer questions 6-10.
          </p>
          <p class="reading-title">${reading.title}</p>
          
          <div class="reading-text">
            ${reading.text}
          </div>
        </div>
      `;
      
      mainCard.appendChild(readingElement);
    }

    function selectRandomQuestions(questions, count) {
      if (questions.length <= count) {
        return [...questions];
      }
      
      const shuffled = [...questions];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      return shuffled.slice(0, count);
    }

    function displayQuestions(questions) {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';
      
      questions.forEach((question, index) => {
        const questionElement = document.createElement('section');
        questionElement.className = 'card rounded-xl mt-6 question-card';
        questionElement.setAttribute('aria-label', `Question ${index + 6}`);
        
        let optionsHTML = '';
        question.options.forEach((option, optionIndex) => {
          optionsHTML += `
            <label>
              <input class="mr-1" name="q${question.id}" type="radio" value="${option}" ${optionIndex === question.correct ? 'data-correct="true"' : ''} />
              ${option}
            </label>
          `;
        });
        
        questionElement.innerHTML = `
          <p class="mb-2 text-[10px] font-semibold">
            ${index + 6}. ${question.text}
          </p>
          <form>
            ${optionsHTML}
          </form>
        `;
        
        container.appendChild(questionElement);
      });
    }

    let questionCount = 0;
    let answeredCount = 0;

    function initValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) names.add(radio.name);
        }
      });

      questionCount = names.size;
      if (questionCount === 0) return;

      radios.forEach(radio => {
        radio.addEventListener('change', updateValidation);
      });

      addProgressIndicator();
      updateValidation();
    }

    function updateValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();
      const answered = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) {
            names.add(radio.name);
            if (radio.checked) answered.add(radio.name);
          }
        }
      });

      answeredCount = answered.size;
      updateProgressIndicator();

      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) {
        if (answeredCount === questionCount) {
          nextBtn.style.opacity = '1';
          nextBtn.style.pointerEvents = 'auto';
          nextBtn.removeAttribute('data-disabled');
        } else {
          nextBtn.style.opacity = '0.6';
          nextBtn.style.pointerEvents = 'none';
          nextBtn.setAttribute('data-disabled', 'true');
        }
      }
    }

    function addProgressIndicator() {
      if (document.querySelector('.progress-indicator')) return;

      const progress = document.createElement('div');
      progress.className = 'progress-indicator';
      progress.innerHTML = `<span id="progress-text">Progress: 0/${questionCount}</span>`;
      document.body.appendChild(progress);
    }

    function updateProgressIndicator() {
      const text = document.getElementById('progress-text');
      if (text) {
        text.textContent = `Progress: ${answeredCount}/${questionCount}`;
        const indicator = document.querySelector('.progress-indicator');
        if (answeredCount === questionCount) {
          indicator.style.borderLeftColor = '#10b981';
          text.textContent += ' ✓';
        }
      }
    }

    document.addEventListener('click', (e) => {
      const target = e.target.closest('#nextBtn[data-disabled="true"]');
      if (target) {
        e.preventDefault();
        alert(`Please answer all questions before proceeding!\nRemaining: ${questionCount - answeredCount} questions.`);
      }
    });

    function initializeCountdown() {
      const totalSeconds = 30 * 60;
      const progressBar = document.getElementById("progressBar");
      const timeDisplay = document.getElementById("timeDisplay");

      let remainingSeconds = totalSeconds;

      function updateCountdown() {
        if (remainingSeconds < 0) {
          remainingSeconds = 0;
          alert('Time is up! Test will end.');
          return;
        }

        if (progressBar) {
          progressBar.value = remainingSeconds;
        }

        if (timeDisplay) {
          const hours = Math.floor(remainingSeconds / 3600);
          const minutes = Math.floor((remainingSeconds % 3600) / 60);
          const seconds = remainingSeconds % 60;
          timeDisplay.textContent = `${hours}Jam ${minutes}Menit ${seconds}Detik`;
        }

        remainingSeconds--;
      }

      if (progressBar && timeDisplay) {
        updateCountdown();
        setInterval(updateCountdown, 1000);
      }
    }

    function initializeTabSwitchDetection() {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          setTimeout(() => {
            if (document.hidden) {
              alert('Warning: Please focus on the test page.');
            }
          }, 1000);
        }
      });
    }

    function initializeProtection() {
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) {
          e.preventDefault();
        }
      });
    }
  
    document.getElementById('nextBtn').addEventListener('click', function(e) {
      if (answeredCount === questionCount) {
        const radios = document.querySelectorAll('input[type="radio"]:checked');
        let correct = 0;
        let total = 0;
        
        radios.forEach(radio => {
          total++;
          if (radio.hasAttribute('data-correct')) {
            correct++;
          }
        });
        
        // Save score with standardized key
        const storageKey = 'ielts_a2_reading_2_score';
        localStorage.setItem(storageKey, JSON.stringify({ correct, total }));
        
        console.log(`Saved ${storageKey}:`, { correct, total });
      }
    });
  </script>
</body>
</html>
