  <div class="next-button-container">

  <script>
    const readingData = [
      {
        id: 1,
        title: "The Changing Definition of Adulthood",
        content: `
          <p>Contemporary sociological research indicates that the traditional markers of adulthood—completing education, leaving home, financial independence, marriage, and parenthood—are undergoing significant redefinition. Where these transitions once typically occurred by one's mid-20s, they now often extend into the late 20s and early 30s across developed economies.</p>
          
          <p>Several factors contribute to this prolonged transition period. Extended educational requirements for professional careers, economic instability, rising housing costs, and changing social norms have collectively delayed these traditional milestones. The 2008 global financial crisis and subsequent economic challenges further accelerated these trends, creating what some researchers term "emerging adulthood"—a distinct life stage between adolescence and full adulthood.</p>
          
          <p>This extended transition period has both positive and negative implications. On one hand, it allows for greater identity exploration and career development before making lifelong commitments. On the other hand, it can create financial dependency and psychological stress for both young adults and their families. The delay in household formation also has broader economic consequences, affecting housing markets and consumer spending patterns.</p>
          
          <p>Cultural variations in this transition remain significant. In Southern European and East Asian countries, multigenerational households remain common well into young adults' late 20s, while in Nordic countries, earlier independence is facilitated by comprehensive social welfare systems.</p>
        `,
        questions: [
          {
            id: 1,
            text: "What is the main topic of this passage?",
            options: [
              "Economic impacts of delayed adulthood",
              "Changing definitions of adulthood milestones",
              "Cultural differences in family structures",
              "Psychological effects of extended education"
            ],
            correct: 1
          },
          {

            ],
            correct: 1
          },
          {
            id: 3,
            text: "Which factor is NOT mentioned as contributing to delayed adulthood?",
            options: [
              "Extended educational requirements",

            ],
            correct: 3
          },
          {
            id: 4,

            options: [
              "Greater identity exploration",

              "Earlier career establishment",
              "Stronger family bonds"
            ],
            correct: 0
          },
          {
            id: 5,

            options: [
              "Nordic countries",
              "Southern European countries",
              "North American countries",
              "Middle Eastern countries"

          }
        ]
      },
      {
        id: 2,
        title: "Economic Challenges Facing Young Adults",
        content: `
          <p>The economic landscape for young adults entering the workforce has transformed dramatically over the past two decades. Stagnant wages coupled with rising costs of living have created significant financial barriers to achieving traditional adulthood milestones. Average student loan debt has increased by over 150% since 2000, while real wages for entry-level positions have remained largely unchanged.</p>
          
          <p>Housing affordability represents a particular challenge. In major metropolitan areas, the ratio of median home prices to median young adult incomes has reached historically high levels. This has led to increased rental durations and delayed homeownership, with the average age of first-time home buyers rising from 29 in 1980 to 34 in recent years.</p>
          
          <p>The gig economy and precarious work arrangements further complicate financial stability. Nearly 40% of workers aged 18-34 report engaging in freelance or contract work, often without benefits or job security. This economic precarity affects long-term planning, including retirement savings and family formation decisions.</p>
          
          <p>Policy responses have included student loan forgiveness programs, first-time home buyer incentives, and minimum wage increases. However, the effectiveness of these measures remains debated, with critics arguing they address symptoms rather than underlying structural issues in the economy.</p>
        `,
        questions: [
          {
            id: 6,
            text: "By what percentage has student loan debt increased since 2000?",
            options: [
              "Over 100%",
              "Over 125%",
              "Over 150%",
              "Over 175%"
            ],
            correct: 2
          },
          {
            id: 7,
            text: "What is the current average age of first-time home buyers?",
            options: [
              "31 years",
              "32 years",
              "33 years",
              "34 years"
            ],
            correct: 3
          },
          {
            id: 8,
            text: "What percentage of young workers engage in gig economy work?",
            options: [
              "Nearly 30%",
              "Nearly 35%",
              "Nearly 40%",
              "Nearly 45%"
            ],
            correct: 2
          },
          {
            id: 9,
            text: "What policy response is NOT mentioned?",
            options: [
              "Student loan forgiveness",
              "Universal basic income",
              "First-time home buyer incentives",
              "Minimum wage increases"
            ],
            correct: 1
          },
          {
            id: 10,
            text: "What has happened to real wages for entry-level positions?",
            options: [
              "Increased significantly",
              "Remained largely unchanged",
              "Decreased slightly",
              "Fluctuated dramatically"
            ],
            correct: 1
          }
        ]
      },
      {
        id: 3,
        title: "Psychological Dimensions of Adult Transitions",
        content: `
          <p>Psychological research on adulthood transitions reveals complex relationships between milestone achievement and well-being. While traditional markers like career establishment and independent living generally correlate with life satisfaction, the timing and sequence of these transitions significantly impact mental health outcomes.</p>
          
          <p>Studies indicate that subjective feelings of "being an adult" often lag behind objective milestone achievement. Many individuals who have achieved financial independence and career establishment still report not feeling like "real adults," a phenomenon psychologists attribute to internalized social expectations and comparison with previous generations.</p>
          
          <p>The concept of "quarter-life crisis" has gained empirical support, with research showing increased anxiety and depression among 25-35 year olds navigating multiple simultaneous transitions. Social media exacerbates these challenges through constant comparison with peers' curated achievements.</p>
          
          <p>Resilience factors include strong social support networks, realistic expectation management, and flexible coping strategies. Cognitive behavioral approaches emphasizing controllable factors rather than fixed timelines have shown effectiveness in reducing transition-related stress.</p>
        `,
        questions: [
          {
            id: 11,
            text: "What is the main focus of this passage?",
            options: [
              "Economic aspects of adulthood",
              "Psychological aspects of adult transitions",
              "Social media's impact on youth",
              "Generational differences in maturity"
            ],
            correct: 1
          },
          {
            id: 12,
            text: "What phenomenon describes not feeling like an adult despite milestone achievement?",
            options: [
              "Imposter syndrome",
              "Delayed identity formation",
              "Subjective adulthood lag",
              "Psychological immaturity"
            ],
            correct: 2
          },
          {
            id: 13,
            text: "What age range is associated with 'quarter-life crisis'?",
            options: [
              "20-30 years",
              "25-35 years",
              "30-40 years",
              "18-28 years"
            ],
            correct: 1
          },
          {
            id: 14,
            text: "What resilience factor is NOT mentioned?",
            options: [
              "Strong social networks",
              "Realistic expectation management",
              "Financial security",
              "Flexible coping strategies"
            ],
            correct: 2
          },
          {
            id: 15,
            text: "What approach helps reduce transition-related stress?",
            options: [
              "Focusing on controllable factors",
              "Comparing with previous generations",
              "Setting rigid timelines",
              "Avoiding social media completely"
            ],
            correct: 0
          }
        ]
      },
      {
        id: 4,
        title: "Cultural Variations in Adulthood Definitions",
        content: `
          <p>Cross-cultural research reveals substantial variation in how different societies define and mark the transition to adulthood. While Western individualistic cultures emphasize psychological attributes and personal achievement, collectivist cultures often prioritize social roles and family responsibilities.</p>
          
          <p>In many East Asian societies, adulthood is closely tied to filial piety and contributing to family welfare rather than independent living. Marriage and parenthood carry greater significance as adulthood markers than in Western contexts. Similarly, in Latin American cultures, adulthood is often associated with fulfilling family obligations and community participation.</p>
          
          <p>Religious and traditional ceremonies continue to play important roles in marking adulthood transitions across cultures. Bar and Bat Mitzvahs in Jewish tradition, Quinceañeras in Latin American cultures, and Seijin shiki in Japan represent formal recognition of new social responsibilities.</p>
          
          <p>Globalization and urbanization are creating hybrid definitions of adulthood, particularly among educated urban populations in developing countries. These individuals often navigate between traditional expectations and modern economic realities, creating new patterns of transition that combine elements from multiple cultural frameworks.</p>
        `,
        questions: [
          {
            id: 16,
            text: "What is the main topic of this passage?",
            options: [
              "Globalization's impact on youth",
              "Cultural variations in adulthood definitions",
              "Religious ceremonies worldwide",
              "Urbanization trends in developing countries"
            ],
            correct: 1
          },
          {
            id: 17,
            text: "What do collectivist cultures prioritize in adulthood definitions?",
            options: [
              "Personal achievement",
              "Psychological attributes",
              "Social roles and family responsibilities",
              "Financial independence"
            ],
            correct: 2
          },
          {
            id: 18,
            text: "Which ceremony is associated with Japanese culture?",
            options: [
              "Bar Mitzvah",
              "Quinceañera",
              "Seijin shiki",
              "Confirmation"
            ],
            correct: 2
          },
          {
            id: 19,
            text: "What is creating hybrid definitions of adulthood?",
            options: [
              "Government policies",
              "Educational reforms",
              "Globalization and urbanization",
              "Technological advancements"
            ],
            correct: 2
          },
          {
            id: 20,
            text: "In East Asian societies, what is adulthood closely tied to?",
            options: [
              "Career achievement",
              "Filial piety and family welfare",
              "Political participation",
              "Educational attainment"
            ],
            correct: 1
          }
        ]
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      initializeTest();
      setTimeout(initValidation, 100);
      initializeCountdown();
      initializeTabSwitchDetection();
      initializeProtection();
    });

    function initializeTest() {
      const storedReading = localStorage.getItem('toeic_academic_reading_2_selected');
      
      let selectedReading;
      if (storedReading) {
        selectedReading = readingData.find(reading => reading.id === parseInt(storedReading));
      } else {
        const randomReadingIndex = Math.floor(Math.random() * readingData.length);
        selectedReading = readingData[randomReadingIndex];
        localStorage.setItem('toeic_academic_reading_2_selected', selectedReading.id.toString());
      }
      
      displayReading(selectedReading);
      const selectedQuestions = selectRandomQuestions(selectedReading.questions, 5);
      displayQuestions(selectedQuestions);
      localStorage.setItem('toeic_academic_reading_2_questions', JSON.stringify(selectedQuestions.map(q => q.id)));
    }

    function displayReading(reading) {
      const mainCard = document.getElementById('mainCard');
      mainCard.innerHTML = '';
      
      const readingElement = document.createElement('div');
      readingElement.className = 'reading-selection';
      readingElement.innerHTML = `
        <div class="inner-card">
          <p class="font-bold text-center mb-1">
            TOEIC Reading Comprehension - Adulthood Transitions (B2)
          </p>
          <p class="text-center mb-3">
            Read the following academic passage and answer questions 1-5.
          </p>
          <p class="reading-title">${reading.title}</p>
          
          <div class="reading-content">
            ${reading.content}
          </div>
        </div>
      `;
      
      mainCard.appendChild(readingElement);
    }

    function selectRandomQuestions(questions, count) {
      if (questions.length <= count) {
        return [...questions];
      }
      
      const shuffled = [...questions];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      return shuffled.slice(0, count);
    }

    function displayQuestions(questions) {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';
      
      questions.forEach((question, index) => {
        const questionElement = document.createElement('section');
        questionElement.className = 'card rounded-xl mt-6 question-card';
        questionElement.setAttribute('aria-label', `Question ${index + 1}`);
        
        let optionsHTML = '';
        question.options.forEach((option, optionIndex) => {
          optionsHTML += `
            <label>
              <input class="mr-1" name="q${question.id}" type="radio" value="${option}" ${optionIndex === question.correct ? 'data-correct="true"' : ''} />
              ${option}
            </label>
          `;
        });
        
        questionElement.innerHTML = `
          <p class="mb-2 text-sm font-semibold">
            ${index + 1}. ${question.text}
          </p>
          <form>
            ${optionsHTML}
          </form>
        `;
        
        container.appendChild(questionElement);
      });
    }

    // Validation functions
    let questionCount = 0;
    let answeredCount = 0;

    function initValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) names.add(radio.name);
        }
      });

      questionCount = names.size;
      if (questionCount === 0) return;

      radios.forEach(radio => {
        radio.addEventListener('change', updateValidation);
      });

      addProgressIndicator();
      updateValidation();
    }

    function updateValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();
      const answered = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) {
            names.add(radio.name);
            if (radio.checked) answered.add(radio.name);
          }
        }
      });

      answeredCount = answered.size;
      updateProgressIndicator();

      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) {
        if (answeredCount === questionCount) {
          nextBtn.style.opacity = '1';
          nextBtn.style.pointerEvents = 'auto';
          nextBtn.removeAttribute('data-disabled');
        } else {
          nextBtn.style.opacity = '0.6';
          nextBtn.style.pointerEvents = 'none';
          nextBtn.setAttribute('data-disabled', 'true');
        }
      }
    }

    function addProgressIndicator() {
      if (document.querySelector('.progress-indicator')) return;

      const progress = document.createElement('div');
      progress.className = 'progress-indicator';
      progress.innerHTML = `<span id="progress-text">Progress: 0/${questionCount}</span>`;
      document.body.appendChild(progress);
    }

    function updateProgressIndicator() {
      const text = document.getElementById('progress-text');
      if (text) {
        text.textContent = `Progress: ${answeredCount}/${questionCount}`;
        const indicator = document.querySelector('.progress-indicator');
        if (answeredCount === questionCount) {
          indicator.style.borderLeftColor = '#10b981';
          text.textContent += ' ✓';
        }
      }
    }

    document.addEventListener('click', (e) => {
      const target = e.target.closest('#nextBtn[data-disabled="true"]');
      if (target) {
        e.preventDefault();
        alert(`Please answer all questions before proceeding!\nRemaining: ${questionCount - answeredCount} questions.`);
      }
    });

    function initializeCountdown() {
      const totalSeconds = 75 * 60;
      const progressBar = document.getElementById("progressBar");
      const timeDisplay = document.getElementById("timeDisplay");

      let remainingSeconds = totalSeconds;

      function updateCountdown() {
        if (remainingSeconds < 0) {
          remainingSeconds = 0;
          alert('Time is up! Test will end.');
          return;
        }

        if (progressBar) {
          progressBar.value = remainingSeconds;
        }

        if (timeDisplay) {
          const hours = Math.floor(remainingSeconds / 3600);
          const minutes = Math.floor((remainingSeconds % 3600) / 60);
          const seconds = remainingSeconds % 60;
          timeDisplay.textContent = `${hours}Jam ${minutes}Menit ${seconds}Detik`;
        }

        remainingSeconds--;
      }

      if (progressBar && timeDisplay) {
        updateCountdown();
        setInterval(updateCountdown, 1000);
      }
    }

    function initializeTabSwitchDetection() {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          setTimeout(() => {
            if (document.hidden) {
              alert('Warning: Please focus on the test page.');
            }
          }, 1000);
        }
      });
    }

    function initializeProtection() {
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) {
          e.preventDefault();
        }
      });
    }
  
    // Save answers to localStorage when Next button is clicked
    document.getElementById('nextBtn').addEventListener('click', function(e) {
      // Only save if all questions are answered
      if (answeredCount === questionCount) {
        const radios = document.querySelectorAll('input[type="radio"]:checked');
        let correct = 0;
        let total = 0;
        
        radios.forEach(radio => {
          total++;
          if (radio.hasAttribute('data-correct')) {
            correct++;
          }
        });
        
        // Save to localStorage with page-specific key
        const pageNum = window.location.pathname.match(/reading_academic_(\d+)\.html/)[1];
        const storageKey = pageNum === '1' ? 'academic_reading_1-1_answers' : `academic_reading_1-${pageNum}_answers`;
        localStorage.setItem(storageKey, JSON.stringify({ correct, total }));
        
        console.log(`Saved ${storageKey}:`, { correct, total });
      }
    });
</script>
</body>
</html>
