  <style>
    /* Same CSS as page 1 */

    .question-card form label:has(input[type="radio"]) { padding: 0.5rem !important; margin: 0.25rem 0 !important; display: block !important; cursor: pointer !important; border-radius: 0.25rem !important; font-size: 0.875rem !important; transition: background-color 0.2s ease !important; min-height: 44px; display: flex; align-items: center; }
    .question-card form label:has(input[type="radio"]):hover { background-color: #f0f7ff !important; }
    .question-card form input[type="radio"] { margin-right: 0.5rem !important; transform: scale(1.2) !important; }

    @media (max-width: 768px) { body { padding-top: 100px !important; } header { height: 90px !important; padding: 0 1.5rem; } .font-golden { font-size: 0.9rem; } header img { width: 80px; height: 80px; } }
    @media (max-width: 480px) { body { padding-top: 90px !important; } header { height: 80px !important; padding: 0 1rem; } .font-golden { font-size: 0.8rem; } header img { width: 60px; height: 60px; } }
    .progress-indicator { position: fixed; bottom: 80px; left: 20px; background: white; padding: 8px 12px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); font-size: 12px; z-index: 1000; border-left: 3px solid #f59e0b; user-select: none; }
    .progress-indicator.complete { border-left-color: #10b981; }
    .reading-selection { margin-bottom: 1.5rem; }
    .reading-title { font-weight: bold; margin-bottom: 0.5rem; color: #1e293b; font-size: 1.125rem; }
    .reading-text { font-size: 0.875rem; line-height: 1.6; color: #334155; }
    * { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    input, textarea { -webkit-user-select: auto; -moz-user-select: auto; -ms-user-select: auto; user-select: auto; }

</head>
<body>
  <header>
    <div class="logo-container">

  <main class="max-w-4xl mx-auto px-6 py-8 flex-grow">
    <section class="mb-6">

      </div>
      <progress id="progressBar" max="3600" value="3600" aria-label="TOEFL test progress bar" role="progressbar" aria-valuemin="0" aria-valuemax="3600" aria-valuenow="3600"></progress>
      <p class="text-[10px] text-center text-black/80 select-none leading-tight" aria-live="polite" aria-atomic="true" id="countdownText">
        Durasi 60 menit<br />
        <span id="timeDisplay" style="">1Jam 0Menit 0Detik</span>

    <section class="card rounded-xl" aria-label="Reading Comprehension section" id="mainCard">

    <div id="questions-container"></div>
  </main>
  
  <div class="next-button-container">
    <a href="toefl-reading-3.html" id="nextBtn" class="btn-animate inline-block text-center" aria-label="Next question">
      Next
    </a>
  </div>

  <script>
    const readingData = [
      {
        id: 1,
        title: "The Digital Revolution and Information Age",
        text: `The Digital Revolution, beginning in the latter half of the 20th century, has transformed society through the adoption and proliferation of digital computers and digital record-keeping. This era marks the third major technological revolution following the Agricultural and Industrial Revolutions, fundamentally altering how information is created, processed, and shared.

Key developments include the invention of the microprocessor, the creation of the Internet, and the emergence of personal computing. These technologies have enabled unprecedented access to information, revolutionized communication through email and social media, and created new economic sectors such as e-commerce and digital marketing.

The Digital Revolution has also raised important social questions regarding privacy, data security, and the digital divide—the gap between those with access to digital technologies and those without. Issues such as cybercrime, misinformation, and the impact of social media on mental health have become significant concerns in contemporary society.

As artificial intelligence, machine learning, and the Internet of Things continue to evolve, the Digital Revolution shows no signs of slowing. Understanding its historical context and societal implications is crucial for navigating the challenges and opportunities of the information age.`,
        questions: [
          {
            id: 1,
            text: "What does the Digital Revolution fundamentally alter?",
            options: [
              "Agricultural production methods",
              "Industrial manufacturing processes",
              "How information is created and shared",
              "Basic human biological functions"
            ],
            correct: 2
          },
          {
            id: 2,
            text: "Which of the following is NOT mentioned as a key development of the Digital Revolution?",
            options: [
              "Invention of the microprocessor",
              "Creation of the Internet",
              "Discovery of electricity",
              "Emergence of personal computing"
            ],
            correct: 2
          },
          {
            id: 3,
            text: "What is the 'digital divide'?",
            options: [
              "The gap in digital skills between generations",
              "The difference between analog and digital technology",
              "The gap between those with and without digital access",
              "The separation between hardware and software"
            ],
            correct: 2
          },
          {
            id: 4,
            text: "What societal concern is mentioned regarding social media?",
            options: [
              "Impact on mental health",
              "Decreased productivity",
              "Reduced social interaction",
              "Increased transportation costs"
            ],
            correct: 0
          },
          {
            id: 5,
            text: "Which emerging technologies continue to evolve the Digital Revolution?",
            options: [
              "Artificial intelligence and machine learning",
              "Steam engines and mechanical looms",
              "Printing press and paper manufacturing",
              "Radio and television broadcasting"
            ],
            correct: 0
          }
        ]
      },
      {
        id: 2,
        title: "Marine Ecosystems and Coral Reefs",
        text: `Coral reefs are among the most diverse and valuable ecosystems on Earth, often called the "rainforests of the sea" due to their incredible biodiversity. These complex structures are built by coral polyps—tiny marine invertebrates that secrete calcium carbonate to form hard skeletons. Reefs provide habitat for approximately 25% of all marine species despite covering less than 1% of the ocean floor.

Coral reefs offer numerous ecosystem services, including coastal protection from storms and erosion, support for fisheries that feed millions of people, and sources of new medicines. Tourism related to coral reefs generates significant economic benefits for many coastal communities, particularly in tropical regions.

However, coral reefs face severe threats from climate change, including ocean warming that causes coral bleaching—when corals expel their symbiotic algae and turn white. Ocean acidification, resulting from increased carbon dioxide absorption, impedes coral growth by reducing available carbonate ions. Local threats include overfishing, destructive fishing practices, pollution, and coastal development.

Conservation efforts focus on establishing marine protected areas, reducing land-based pollution, promoting sustainable fishing practices, and developing coral restoration techniques. Research into heat-resistant corals and assisted evolution offers hope for reef resilience in a warming climate.`,
        questions: [
          {
            id: 6,
            text: "Why are coral reefs called 'rainforests of the sea'?",
            options: [
              "Because they are located in tropical areas",
              "Due to their incredible biodiversity",
              "Because they produce oxygen",
              "Due to their dense vegetation"
            ],
            correct: 1
          },
          {
            id: 7,
            text: "What percentage of marine species do coral reefs support?",
            options: [
              "Approximately 10%",
              "Approximately 25%",
              "Approximately 50%",
              "Approximately 75%"
            ],
            correct: 1
          },
          {
            id: 8,
            text: "What is coral bleaching?",
            options: [
              "When corals die and turn white",
              "When corals expel algae and turn white",
              "When corals grow too quickly",
              "When corals change color due to pollution"
            ],
            correct: 1
          },
          {
            id: 9,
            text: "How does ocean acidification affect coral growth?",
            options: [
              "By increasing water temperature",
              "By reducing available carbonate ions",
              "By introducing toxic substances",
              "By blocking sunlight"
            ],
            correct: 1
          },
          {
            id: 10,
            text: "What conservation approach involves developing heat-resistant corals?",
            options: [
              "Marine protected areas",
              "Assisted evolution research",
              "Pollution reduction",
              "Sustainable fishing practices"
            ],
            correct: 1
          }
        ]
      },
      {
        id: 3,
        title: "Economic Globalization and Trade",
        text: `Economic globalization refers to the increasing interdependence of world economies through cross-border trade, capital flows, and rapid technology spread. This process has accelerated since the late 20th century, driven by trade liberalization, technological advances in transportation and communication, and multinational corporations' expansion.

International trade agreements such as the World Trade Organization (WTO) framework and regional agreements like NAFTA (now USMCA) have reduced tariffs and trade barriers, facilitating global commerce. Supply chains have become increasingly complex, with components sourced from multiple countries before final assembly, maximizing efficiency but creating vulnerability to disruptions.

Globalization has generated significant economic benefits, including reduced poverty in many developing countries, lower consumer prices, and increased access to goods and services. However, it has also contributed to job displacement in certain sectors, income inequality within and between countries, and environmental concerns related to increased transportation and production.

The 2008 global financial crisis highlighted the risks of interconnected financial systems, while recent supply chain disruptions during the COVID-19 pandemic revealed vulnerabilities in global production networks. These challenges have prompted discussions about reshoring, supply chain resilience, and more inclusive forms of globalization.`,
        questions: [
          {
            id: 11,
            text: "What has driven the acceleration of economic globalization?",
            options: [
              "Trade liberalization and technological advances",
              "Increased agricultural production",
              "Declining population growth",
              "Reduced energy consumption"
            ],
            correct: 0
          },
          {
            id: 12,
            text: "What is a characteristic of modern supply chains?",
            options: [
              "Components sourced from single countries",
              "Simple, localized production",
              "Components sourced from multiple countries",
              "Limited international cooperation"
            ],
            correct: 2
          },
          {
            id: 13,
            text: "Which benefit of globalization is mentioned?",
            options: [
              "Increased job security in all sectors",
              "Reduced poverty in developing countries",
              "Complete elimination of income inequality",
              "Solution to all environmental problems"
            ],
            correct: 1
          },
          {
            id: 14,
            text: "What risk was highlighted by the 2008 financial crisis?",
            options: [
              "Risks of interconnected financial systems",
              "Dangers of local economic systems",
              "Benefits of trade protectionism",
              "Advantages of economic isolation"
            ],
            correct: 0
          },
          {
            id: 15,
            text: "What concept involves bringing production back to home countries?",
            options: [
              "Offshoring",
              "Reshoring",
              "Outsourcing",
              "Globalization"
            ],
            correct: 1
          }
        ]
      },
      {
        id: 4,
        title: "Human Memory and Learning Processes",
        text: `Human memory is a complex cognitive system that involves encoding, storing, and retrieving information. The multi-store model proposes three main memory stores: sensory memory (briefly holding sensory information), short-term memory (limited capacity, temporary storage), and long-term memory (essentially unlimited, durable storage).

Memory consolidation—the process of stabilizing memory traces after initial acquisition—is crucial for transferring information from short-term to long-term storage. Sleep plays a vital role in this process, with research showing that memory consolidation is enhanced during certain sleep stages. Emotional arousal also strengthens memory formation, explaining why emotionally significant events are often remembered more vividly.

Forgetting can occur through various mechanisms, including decay (fading over time), interference (other memories disrupting retrieval), and retrieval failure (inability to access stored information). Memory is reconstructive rather than purely reproductive, meaning that recall involves reconstructing information rather than playing back exact recordings.

Effective learning strategies that enhance memory include spaced repetition (reviewing material at increasing intervals), elaborative rehearsal (connecting new information to existing knowledge), and retrieval practice (actively recalling information). Understanding these processes can help optimize educational approaches and memory enhancement techniques.`,
        questions: [
          {
            id: 16,
            text: "What is the function of sensory memory?",
            options: [
              "Long-term storage of important information",
              "Briefly holding sensory information",
              "Solving complex problems",
              "Permanent storage of emotional memories"
            ],
            correct: 1
          },
          {
            id: 17,
            text: "What enhances memory consolidation according to the passage?",
            options: [
              "Continuous wakefulness",
              "Certain sleep stages",
              "High caffeine consumption",
              "Multitasking"
            ],
            correct: 1
          },
          {
            id: 18,
            text: "Why are emotionally significant events remembered more vividly?",
            options: [
              "Emotional arousal strengthens memory formation",
              "They are rehearsed more frequently",
              "They are stored in different brain areas",
              "They are less affected by interference"
            ],
            correct: 0
          },
          {
            id: 19,
            text: "What is memory described as, rather than reproductive?",
            options: [
              "Reconstructive",
              "Photographic",
              "Automatic",
              "Permanent"
            ],
            correct: 0
          },
          {
            id: 20,
            text: "Which learning strategy involves reviewing at increasing intervals?",
            options: [
              "Spaced repetition",
              "Massed practice",
              "Elaborative rehearsal",
              "Retrieval practice"
            ],
            correct: 0
          }
        ]
      }
    ];

    // Same JavaScript functions as page 1
    document.addEventListener('DOMContentLoaded', () => {
      initializeTest();
      setTimeout(initValidation, 100);
      initializeCountdown();
      initializeTabSwitchDetection();
      initializeProtection();
    });

    function initializeTest() {
      const storedReading = localStorage.getItem('toefl_reading_2_selected');
      
      let selectedReading;
      if (storedReading) {
        selectedReading = readingData.find(reading => reading.id === parseInt(storedReading));
      } else {
        const randomReadingIndex = Math.floor(Math.random() * readingData.length);
        selectedReading = readingData[randomReadingIndex];
        localStorage.setItem('toefl_reading_2_selected', selectedReading.id.toString());
      }
      
      displayReading(selectedReading);
      const selectedQuestions = selectRandomQuestions(selectedReading.questions, 5);
      displayQuestions(selectedQuestions);
      localStorage.setItem('toefl_reading_2_questions', JSON.stringify(selectedQuestions.map(q => q.id)));
    }

    function displayReading(reading) {
      const mainCard = document.getElementById('mainCard');
      mainCard.innerHTML = '';
      
      const readingElement = document.createElement('div');
      readingElement.className = 'reading-selection';
      readingElement.innerHTML = `
        <div class="inner-card">
          <p class="font-bold text-center mb-1">
            TOEFL Reading - Academic Topics
          </p>
          <p class="text-center mb-3">
            Read the text and answer questions 1-5.
          </p>
          <p class="reading-title">${reading.title}</p>
          
          <div class="reading-text">
            ${reading.text}
          </div>
        </div>
      `;
      
      mainCard.appendChild(readingElement);
    }

    function selectRandomQuestions(questions, count) {
      if (questions.length <= count) {
        return [...questions];
      }
      
      const shuffled = [...questions];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      return shuffled.slice(0, count);
    }

    function displayQuestions(questions) {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';
      
      questions.forEach((question, index) => {
        const questionElement = document.createElement('section');
        questionElement.className = 'card rounded-xl mt-6 question-card';
        questionElement.setAttribute('aria-label', `Question ${index + 1}`);
        
        let optionsHTML = '';
        question.options.forEach((option, optionIndex) => {
          optionsHTML += `
            <label>
              <input class="mr-1" name="q${question.id}" type="radio" value="${option}" ${optionIndex === question.correct ? 'data-correct="true"' : ''} />
              ${option}
            </label>
          `;
        });
        
        questionElement.innerHTML = `
          <p class="mb-2 text-[10px] font-semibold">
            ${index + 1}. ${question.text}
          </p>
          <form>
            ${optionsHTML}
          </form>
        `;
        
        container.appendChild(questionElement);
      });
    }

    let questionCount = 0;
    let answeredCount = 0;

    function initValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) names.add(radio.name);
        }
      });

      questionCount = names.size;
      if (questionCount === 0) return;

      radios.forEach(radio => {
        radio.addEventListener('change', updateValidation);
      });

      addProgressIndicator();
      updateValidation();
    }

    function updateValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();
      const answered = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) {
            names.add(radio.name);
            if (radio.checked) answered.add(radio.name);
          }
        }
      });

      answeredCount = answered.size;
      updateProgressIndicator();

      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) {
        if (answeredCount === questionCount) {
          nextBtn.style.opacity = '1';
          nextBtn.style.pointerEvents = 'auto';
          nextBtn.removeAttribute('data-disabled');
        } else {
          nextBtn.style.opacity = '0.6';
          nextBtn.style.pointerEvents = 'none';
          nextBtn.setAttribute('data-disabled', 'true');
        }
      }
    }

    function addProgressIndicator() {
      if (document.querySelector('.progress-indicator')) return;

      const progress = document.createElement('div');
      progress.className = 'progress-indicator';
      progress.innerHTML = `<span id="progress-text">Progress: 0/${questionCount}</span>`;
      document.body.appendChild(progress);
    }

    function updateProgressIndicator() {
      const text = document.getElementById('progress-text');
      if (text) {
        text.textContent = `Progress: ${answeredCount}/${questionCount}`;
        const indicator = document.querySelector('.progress-indicator');
        if (answeredCount === questionCount) {
          indicator.style.borderLeftColor = '#10b981';
          text.textContent += ' ✓';
        }
      }
    }

    document.addEventListener('click', (e) => {
      const target = e.target.closest('#nextBtn[data-disabled="true"]');
      if (target) {
        e.preventDefault();
        alert(`Please answer all questions before proceeding!\nRemaining: ${questionCount - answeredCount} questions.`);
      }
    });

    function initializeCountdown() {
      const totalSeconds = 60 * 60;
      const progressBar = document.getElementById("progressBar");
      const timeDisplay = document.getElementById("timeDisplay");

      let remainingSeconds = totalSeconds;

      function updateCountdown() {
        if (remainingSeconds < 0) {
          remainingSeconds = 0;
          alert('Time is up! Test will end.');
          return;
        }

        if (progressBar) {
          progressBar.value = remainingSeconds;
        }

        if (timeDisplay) {
          const hours = Math.floor(remainingSeconds / 3600);
          const minutes = Math.floor((remainingSeconds % 3600) / 60);
          const seconds = remainingSeconds % 60;
          timeDisplay.textContent = `${hours}Jam ${minutes}Menit ${seconds}Detik`;
        }

        remainingSeconds--;
      }

      if (progressBar && timeDisplay) {
        updateCountdown();
        setInterval(updateCountdown, 1000);
      }
    }

    function initializeTabSwitchDetection() {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          setTimeout(() => {
            if (document.hidden) {
              alert('Warning: Please focus on the test page.');
            }
          }, 1000);
        }
      });
    }

    function initializeProtection() {
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) {
          e.preventDefault();
        }
      });
    }
  
    document.getElementById('nextBtn').addEventListener('click', function(e) {
      if (answeredCount === questionCount) {
        const radios = document.querySelectorAll('input[type="radio"]:checked');
        let correct = 0;
        let total = 0;
        
        radios.forEach(radio => {
          total++;
          if (radio.hasAttribute('data-correct')) {
            correct++;
          }
        });
        
        const storageKey = 'toefl_reading_2_score';
        localStorage.setItem(storageKey, JSON.stringify({ correct, total }));
        
        console.log(`Saved ${storageKey}:`, { correct, total });
      }
    });
  </script>
</body>
</html>
