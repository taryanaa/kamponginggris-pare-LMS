<html lang="en">
<head>

  <style>
    body { font-family: "Roboto", sans-serif; background-color: #f0f7ff; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
    .card { transition: transform 0.2s ease, box-shadow 0.3s ease; border-radius: 1rem; background: white; box-shadow: 0 8px 15px rgba(59, 130, 246, 0.1); padding: 1.5rem; }

    progress { -webkit-appearance: none; width: 100%; height: 0.25rem; border-radius: 9999px; margin-top: 0.25rem; margin-bottom: 0.5rem; }

    .next-button-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 20; }
    @media (max-width: 640px) { .next-button-container { position: static; margin-top: 1rem; display: flex; justify-content: flex-end; padding-right: 1.5rem; } }
    .question-card { transition: none !important; cursor: default !important; user-select: text !important; transform: none !important; }
    .question-card:hover { box-shadow: 0 8px 15px rgba(59, 130, 246, 0.1) !important; transform: none !important; }
    .question-card form label:has(input[type="radio"]) { padding: 0.5rem !important; margin: 0.25rem 0 !important; display: block !important; cursor: pointer !important; border-radius: 0.25rem !important; font-size: 0.875rem !important; transition: background-color 0.2s ease !important; min-height: 44px; display: flex; align-items: center; }
    .question-card form label:has(input[type="radio"]):hover { background-color: #f0f7ff !important; }

    body { padding-top: 110px !important; margin: 0 !important; }

    header .logo-container { display: flex; align-items: center; gap: 1rem; }
    header img { width: 140px; height: 140px; flex-shrink: 0; object-fit: contain; border-radius: 8px; }
    @media (max-width: 768px) { body { padding-top: 100px !important; } header { height: 90px !important; padding: 0 1.5rem; } .font-golden { font-size: 0.9rem; } header img { width: 80px; height: 80px; } }
    @media (max-width: 480px) { body { padding-top: 90px !important; } header { height: 80px !important; padding: 0 1rem; } .font-golden { font-size: 0.8rem; } header img { width: 60px; height: 60px; } }
    .progress-indicator { position: fixed; bottom: 80px; left: 20px; background: white; padding: 8px 12px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); font-size: 12px; z-index: 1000; border-left: 3px solid #f59e0b; user-select: none; }
    .progress-indicator.complete { border-left-color: #10b981; }
    .reading-selection { margin-bottom: 1.5rem; }
    .reading-title { font-weight: bold; margin-bottom: 0.5rem; color: #1e293b; font-size: 1.125rem; }
    .reading-text { font-size: 0.875rem; line-height: 1.6; color: #334155; }
    * { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    input, textarea { -webkit-user-select: auto; -moz-user-select: auto; -ms-user-select: auto; user-select: auto; }

</head>
<body>
  <header>
    <div class="logo-container">
      <img alt="kamponginggrispare.com logo" src="./img1.png" decoding="async" loading="lazy" />
      <h1 class="font-golden">kamponginggrispare.com</h1>
    </div>
  </header>
  
  <main class="max-w-4xl mx-auto px-6 py-8 flex-grow">
    <section class="mb-6">
      <div class="bg-[#2563eb] text-white text-[10px] text-center py-1 rounded-md select-none font-semibold" aria-label="IELTS test title">
        IELTS A2 Reading Test - British Culture (5/5)
      </div>
      <progress id="progressBar" max="1800" value="1800" aria-label="IELTS test progress bar" role="progressbar" aria-valuemin="0" aria-valuemax="1800" aria-valuenow="1800"></progress>
      <p class="text-[10px] text-center text-black/80 select-none leading-tight" aria-live="polite" aria-atomic="true" id="countdownText">
        Durasi 30 menit<br />
        <span id="timeDisplay" style="">0Jam 30Menit 0Detik</span>
      </p>
    </section>
    
    <section class="card rounded-xl" aria-label="Reading Comprehension section" id="mainCard">
      <!-- Reading content will be dynamically inserted here -->

    <!-- Questions will be dynamically inserted here -->
    <div id="questions-container"></div>
  </main>
  
  <div class="next-button-container">
    <a href="ielts-writing-1.html" id="nextBtn" class="btn-animate inline-block text-center" aria-label="Finish test">
      Finish
    </a>
  </div>

  <script>
    const readingData = [
      {
        id: 1,
        title: "British Inventions and Discoveries",
        text: `Britain has been responsible for many important inventions and discoveries that have changed the world. The Industrial Revolution began in Britain in the 18th century, leading to innovations like the steam engine, which was perfected by James Watt. This revolutionized transportation and manufacturing.

In science, Isaac Newton developed the laws of motion and gravity in the 17th century. Charles Darwin proposed the theory of evolution through natural selection in the 19th century. More recently, British scientists played key roles in discovering the structure of DNA and developing the World Wide Web.

Everyday items invented in Britain include the telephone (Alexander Graham Bell), television (John Logie Baird), and the World Wide Web (Tim Berners-Lee). The first programmable computer was also developed by British mathematician Alan Turing during World War II.

Medical advances from Britain include penicillin, discovered by Alexander Fleming, which revolutionized the treatment of bacterial infections. The first successful vaccination was developed by Edward Jenner to prevent smallpox. These inventions and discoveries have had lasting impacts on global society.`,

            id: 1,

          {

            text: "Who developed the laws of motion and gravity?",
            options: [
              "Charles Darwin",
              "Isaac Newton",
              "Albert Einstein",
              "Galileo Galilei"
            ],
            correct: 1
          },
          {
            id: 3,
            text: "What did Alexander Graham Bell invent?",
            options: [
              "Television",
              "Telephone",
              "Computer",
              "Steam engine"
            ],
            correct: 1
          },
          {
            id: 4,
            text: "Who discovered penicillin?",
            options: [
              "Edward Jenner",
              "Alexander Fleming",
              "Louis Pasteur",
              "Marie Curie"
            ],
            correct: 1
          },
          {
            id: 5,
            text: "What did Tim Berners-Lee develop?",
            options: [
              "First computer",
              "World Wide Web",
              "Telephone",
              "Television"
            ],
            correct: 1
          }
        ]
      },
      {
        id: 2,
        title: "Modern British Society",
        text: `Modern British society is multicultural and diverse, with people from many different backgrounds and cultures living together. Since the 1950s, immigration from Commonwealth countries and elsewhere has enriched British culture, food, and traditions.

Britain today faces both challenges and opportunities. Issues like housing affordability, healthcare funding, and environmental concerns are important topics of discussion. At the same time, British cities like London, Manchester, and Edinburgh are vibrant centers of innovation, culture, and business.

British values include democracy, the rule of law, individual liberty, and mutual respect and tolerance of different faiths and beliefs. These values are promoted in schools and society. Britain continues to be an active member of the international community, participating in global organizations and addressing worldwide issues.

Family life in Britain has changed significantly, with many different family structures now common. The traditional nuclear family has been joined by single-parent families, same-sex parent families, and blended families. Most British people now marry later in life, and many choose to cohabit before or instead of marriage.`,
        questions: [
          {
            id: 6,
            text: "What is modern British society like?",
            options: [
              "Homogeneous",
              "Multicultural and diverse",
              "Isolated",
              "Traditional only"
            ],
            correct: 1
          },
          {
            id: 7,
            text: "When did significant immigration to Britain begin?",
            options: [
              "1920s",
              "1950s",
              "1980s",
              "2000s"
            ],
            correct: 1
          },
          {
            id: 8,
            text: "What are British values?",
            options: [
              "Democracy and rule of law",
              "Only traditional customs",
              "Isolation from others",
              "Rejection of diversity"
            ],
            correct: 0
          },
          {
            id: 9,
            text: "How has family life changed in Britain?",
            options: [
              "More diverse family structures",
              "Only nuclear families now",
              "No changes",
              "Fewer families"
            ],
            correct: 0
          },
          {
            id: 10,
            text: "What is a common trend in marriage in Britain?",
            options: [
              "Marrying younger",
              "Marrying later in life",
              "Not marrying at all",
              "Only arranged marriages"
            ],
            correct: 1
          }
        ]
      },
      {
        id: 3,
        title: "British Festivals and Events",
        text: `Britain hosts numerous festivals and events throughout the year that celebrate its culture, arts, and diversity. The Edinburgh Festival Fringe is the world's largest arts festival, taking place every August in Scotland's capital. It features thousands of performances across hundreds of venues.

Glastonbury Festival is one of the world's most famous music festivals, attracting major international artists and thousands of attendees. It takes place in Somerset and is known for its diverse music lineup and unique atmosphere.

Cultural celebrations include Notting Hill Carnival in London, which is Europe's biggest street festival celebrating Caribbean culture with music, dance, and colorful costumes. Chinese New Year is also widely celebrated in cities with significant Chinese communities.

Seasonal events include Bonfire Night on November 5th, celebrating the failure of the Gunpowder Plot with fireworks and bonfires. Christmas markets appear in towns and cities during December, offering crafts, food, and festive entertainment. These events bring communities together and attract visitors from around the world.`,
        questions: [
          {
            id: 11,
            text: "What is the Edinburgh Festival Fringe?",
            options: [
              "A music competition",
              "The world's largest arts festival",
              "A sports event",
              "A food festival"
            ],
            correct: 1
          },
          {
            id: 12,
            text: "Where does Glastonbury Festival take place?",
            options: [
              "London",
              "Somerset",
              "Edinburgh",
              "Manchester"
            ],
            correct: 1
          },
          {
            id: 13,
            text: "What culture does Notting Hill Carnival celebrate?",
            options: [
              "Chinese culture",
              "Caribbean culture",
              "Indian culture",
              "African culture"
            ],
            correct: 1
          },
          {
            id: 14,
            text: "When is Bonfire Night celebrated?",
            options: [
              "December 25th",
              "November 5th",
              "January 1st",
              "October 31st"
            ],
            correct: 1
          },
          {
            id: 15,
            text: "What appears in towns during December?",
            options: [
              "Beach parties",
              "Christmas markets",
              "Music festivals",
              "Sports competitions"
            ],
            correct: 1
          }
        ]
      },
      {
        id: 4,
        title: "British Environmental Awareness",
        text: `Environmental awareness has grown significantly in Britain in recent decades. Recycling is now common practice, with most households having separate bins for different types of waste. The government has set targets to reduce carbon emissions and increase renewable energy use.

Many British people are concerned about climate change and take individual actions to reduce their environmental impact. This includes using public transportation, cycling, or walking instead of driving; reducing energy consumption at home; and choosing products with less packaging.

National parks and protected areas cover significant portions of Britain, preserving natural landscapes and wildlife. Organizations like the National Trust work to protect historic buildings and natural spaces for future generations. Coastal paths and countryside walking routes are popular for recreation and appreciating nature.

Environmental education is part of the school curriculum, teaching children about sustainability and conservation. Community initiatives like tree planting, beach cleaning, and wildlife monitoring involve volunteers in environmental protection efforts across the country.`,
        questions: [
          {
            id: 16,
            text: "What is common practice in British households?",
            options: [
              "Burning all waste",
              "Recycling",
              "Throwing everything away",
              "No waste management"
            ],
            correct: 1
          },
          {
            id: 17,
            text: "What do many British people do to reduce environmental impact?",
            options: [
              "Use more cars",
              "Use public transportation",
              "Use more energy",
              "Buy more packaged products"
            ],
            correct: 1
          },
          {
            id: 18,
            text: "What does the National Trust protect?",
            options: [
              "Only buildings",
              "Only natural spaces",
              "Historic buildings and natural spaces",
              "Only museums"
            ],
            correct: 2
          },
          {
            id: 19,
            text: "What is part of the school curriculum?",
            options: [
              "Environmental education",
              "Only traditional subjects",
              "No science education",
              "Only sports"
            ],
            correct: 0
          },
          {
            id: 20,
            text: "What community initiatives are mentioned?",
            options: [
              "Tree planting and beach cleaning",
              "Only protests",
              "Only government actions",
              "No community actions"
            ],
            correct: 0
          }
        ]
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      initializeTest();
      setTimeout(initValidation, 100);
      initializeCountdown();
      initializeTabSwitchDetection();
      initializeProtection();
    });

    function initializeTest() {
      const storedReading = localStorage.getItem('ielts_british_reading_5_selected');
      
      let selectedReading;
      if (storedReading) {
        selectedReading = readingData.find(reading => reading.id === parseInt(storedReading));
      } else {
        const randomReadingIndex = Math.floor(Math.random() * readingData.length);
        selectedReading = readingData[randomReadingIndex];
        localStorage.setItem('ielts_british_reading_5_selected', selectedReading.id.toString());
      }
      
      displayReading(selectedReading);
      const selectedQuestions = selectRandomQuestions(selectedReading.questions, 5);
      displayQuestions(selectedQuestions);
      localStorage.setItem('ielts_british_reading_5_questions', JSON.stringify(selectedQuestions.map(q => q.id)));
    }

    function displayReading(reading) {
      const mainCard = document.getElementById('mainCard');
      mainCard.innerHTML = '';
      
      const readingElement = document.createElement('div');
      readingElement.className = 'reading-selection';
      readingElement.innerHTML = `
        <div class="inner-card">
          <p class="font-bold text-center mb-1">
            IELTS A2 Reading - British Culture
          </p>
          <p class="text-center mb-3">
            Read the text and answer questions 21-25.
          </p>
          <p class="reading-title">${reading.title}</p>
          
          <div class="reading-text">
            ${reading.text}
          </div>
        </div>
      `;
      
      mainCard.appendChild(readingElement);
    }

    function selectRandomQuestions(questions, count) {
      if (questions.length <= count) {
        return [...questions];
      }
      
      const shuffled = [...questions];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      return shuffled.slice(0, count);
    }

    function displayQuestions(questions) {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';
      
      questions.forEach((question, index) => {
        const questionElement = document.createElement('section');
        questionElement.className = 'card rounded-xl mt-6 question-card';
        questionElement.setAttribute('aria-label', `Question ${index + 21}`);
        
        let optionsHTML = '';
        question.options.forEach((option, optionIndex) => {
          optionsHTML += `
            <label>
              <input class="mr-1" name="q${question.id}" type="radio" value="${option}" ${optionIndex === question.correct ? 'data-correct="true"' : ''} />
              ${option}
            </label>
          `;
        });
        
        questionElement.innerHTML = `
          <p class="mb-2 text-[10px] font-semibold">
            ${index + 21}. ${question.text}
          </p>
          <form>
            ${optionsHTML}
          </form>
        `;
        
        container.appendChild(questionElement);
      });
    }

    let questionCount = 0;
    let answeredCount = 0;

    function initValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) names.add(radio.name);
        }
      });

      questionCount = names.size;
      if (questionCount === 0) return;

      radios.forEach(radio => {
        radio.addEventListener('change', updateValidation);
      });

      addProgressIndicator();
      updateValidation();
    }

    function updateValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();
      const answered = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) {
            names.add(radio.name);
            if (radio.checked) answered.add(radio.name);
          }
        }
      });

      answeredCount = answered.size;
      updateProgressIndicator();

      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) {
        if (answeredCount === questionCount) {
          nextBtn.style.opacity = '1';
          nextBtn.style.pointerEvents = 'auto';
          nextBtn.removeAttribute('data-disabled');
        } else {
          nextBtn.style.opacity = '0.6';
          nextBtn.style.pointerEvents = 'none';
          nextBtn.setAttribute('data-disabled', 'true');
        }
      }
    }

    function addProgressIndicator() {
      if (document.querySelector('.progress-indicator')) return;

      const progress = document.createElement('div');
      progress.className = 'progress-indicator';
      progress.innerHTML = `<span id="progress-text">Progress: 0/${questionCount}</span>`;
      document.body.appendChild(progress);
    }

    function updateProgressIndicator() {
      const text = document.getElementById('progress-text');
      if (text) {
        text.textContent = `Progress: ${answeredCount}/${questionCount}`;
        const indicator = document.querySelector('.progress-indicator');
        if (answeredCount === questionCount) {
          indicator.style.borderLeftColor = '#10b981';
          text.textContent += ' ✓';
        }
      }
    }

    document.addEventListener('click', (e) => {
      const target = e.target.closest('#nextBtn[data-disabled="true"]');
      if (target) {
        e.preventDefault();
        alert(`Please answer all questions before proceeding!\nRemaining: ${questionCount - answeredCount} questions.`);
      }
    });

    function initializeCountdown() {
      const totalSeconds = 30 * 60;
      const progressBar = document.getElementById("progressBar");
      const timeDisplay = document.getElementById("timeDisplay");

      let remainingSeconds = totalSeconds;

      function updateCountdown() {
        if (remainingSeconds < 0) {
          remainingSeconds = 0;
          alert('Time is up! Test will end.');
          return;
        }

        if (progressBar) {
          progressBar.value = remainingSeconds;
        }

        if (timeDisplay) {
          const hours = Math.floor(remainingSeconds / 3600);
          const minutes = Math.floor((remainingSeconds % 3600) / 60);
          const seconds = remainingSeconds % 60;
          timeDisplay.textContent = `${hours}Jam ${minutes}Menit ${seconds}Detik`;
        }

        remainingSeconds--;
      }

      if (progressBar && timeDisplay) {
        updateCountdown();
        setInterval(updateCountdown, 1000);
      }
    }

    function initializeTabSwitchDetection() {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          setTimeout(() => {
            if (document.hidden) {
              alert('Warning: Please focus on the test page.');
            }
          }, 1000);
        }
      });
    }

    function initializeProtection() {
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) {
          e.preventDefault();
        }
      });
    }
  
    document.getElementById('nextBtn').addEventListener('click', function(e) {
      if (answeredCount === questionCount) {
        const radios = document.querySelectorAll('input[type="radio"]:checked');
        let correct = 0;
        let total = 0;
        
        radios.forEach(radio => {
          total++;
          if (radio.hasAttribute('data-correct')) {
            correct++;
          }
        });
        
        // Save score with standardized key
        const storageKey = 'ielts_a2_reading_5_score';
        localStorage.setItem(storageKey, JSON.stringify({ correct, total }));
        
        console.log(`Saved ${storageKey}:`, { correct, total });
        
        // Calculate total score for all reading pages
        calculateTotalScore();
      }
    });

    function calculateTotalScore() {
      let totalCorrect = 0;
      let totalQuestions = 0;
      
      for (let i = 1; i <= 5; i++) {
        const stored = localStorage.getItem(`ielts_reading_british_${i}_answers`);
        if (stored) {
          const result = JSON.parse(stored);
          totalCorrect += result.correct;
          totalQuestions += result.total;
        }
      }
      
      localStorage.setItem('ielts_reading_british_final_score', JSON.stringify({
        correct: totalCorrect,
        total: totalQuestions,
        percentage: Math.round((totalCorrect / totalQuestions) * 100)
      }));
    }
  </script>
</body>
</html>
