  <script>
    // Data for all listening exercises and questions
    const listeningData = [
  {
    id: 1,
    title: "Conversation: International Conference",
    audioFile: "audio/page8-listening-conference.wav",
    description: "Participants discuss agenda, speakers, and logistics for an international conference.",
    questions: [
      { id: 1, text: "What is the main topic of the conference?", options: ["Technology", "Environment", "Healthcare", "Education"], correct: 1 },
      { id: 2, text: "Who is the keynote speaker?", options: ["Dr. Smith", "Dr. Johnson", "Dr. Lee", "Dr. Martinez"], correct: 3 },
      { id: 3, text: "Where will the conference be held?", options: ["New York", "London", "Paris", "Tokyo"], correct: 2 },
      { id: 4, text: "What is the registration deadline?", options: ["June 1", "June 15", "July 1", "July 15"], correct: 1 },
      { id: 5, text: "What is included in the registration fee?", options: ["Meals", "Materials", "Access to sessions", "All of the above"], correct: 3 }
    ]
  },
  {
    id: 2,
    title: "Conversation: Investment Meeting",
    audioFile: "audio/page8-listening-investment.wav",
    description: "Investors discuss portfolio performance, risks, and future opportunities.",
    questions: [
      { id: 6, text: "What is the current portfolio value?", options: ["$1M", "$1.5M", "$2M", "$2.5M"], correct: 2 },
      { id: 7, text: "What risk is highlighted?", options: ["Market volatility", "Interest rates", "Inflation", "Currency exchange"], correct: 0 },
      { id: 8, text: "What sector is recommended for growth?", options: ["Technology", "Healthcare", "Energy", "Real estate"], correct: 1 },
      { id: 9, text: "What is the investment horizon?", options: ["1 year", "3 years", "5 years", "10 years"], correct: 2 },
      { id: 10, text: "What is the suggested action?", options: ["Buy more", "Sell some", "Hold", "Diversify"], correct: 3 }
    ]
  },
  {
    id: 3,
    title: "Conversation: Legal Consultation",
    audioFile: "audio/page8-listening-legal.wav",
    description: "A client discusses contract terms, liabilities, and compliance with a lawyer.",
    questions: [
      { id: 11, text: "What type of contract is discussed?", options: ["Employment", "Sales", "Lease", "Partnership"], correct: 3 },
      { id: 12, text: "What liability is a concern?", options: ["Financial", "Legal", "Operational", "Environmental"], correct: 1 },
      { id: 13, text: "What compliance issue is mentioned?", options: ["Data protection", "Tax", "Safety", "Labor"], correct: 0 },
      { id: 14, text: "What is the lawyer's advice?", options: ["Negotiate terms", "Terminate contract", "Seek arbitration", "Ignore issues"], correct: 0 },
      { id: 15, text: "What is the next step?", options: ["Draft amendment", "File lawsuit", "Hold meeting", "Consult regulator"], correct: 0 }
    ]
  },
  {
    id: 4,
    title: "Conversation: Medical Consultation",
    audioFile: "audio/page8-listening-medical.wav",
    description: "A patient discusses symptoms, diagnosis, and treatment options with a doctor.",
    questions: [
      { id: 16, text: "What symptom does the patient report?", options: ["Headache", "Fever", "Cough", "Fatigue"], correct: 2 },
      { id: 17, text: "What diagnosis is given?", options: ["Flu", "Cold", "Bronchitis", "Pneumonia"], correct: 2 },
      { id: 18, text: "What treatment is recommended?", options: ["Rest", "Medication", "Surgery", "Therapy"], correct: 1 },
      { id: 19, text: "How long is the recovery period?", options: ["1 week", "2 weeks", "3 weeks", "4 weeks"], correct: 1 },
      { id: 20, text: "What follow-up is suggested?", options: ["Phone call", "Clinic visit", "No follow-up", "Referral"], correct: 1 }
    ]
  }
];

    // Audio player state
    let currentAudio = null;
    let playCount = 0;
    const maxPlays = 3;

    document.addEventListener('DOMContentLoaded', () => {
      // Initialize the test
      initializeTest();
      
      // Initialize validation
      setTimeout(initValidation, 100);
      
      // Initialize countdown timer
      initializeCountdown();
      
      // Initialize tab switch detection
      initializeTabSwitchDetection();
    });

    function initializeTest() {
      // Check if we already have a selected listening in localStorage
      const storedListening = localStorage.getItem('practical_listening_page8_selected');
      
      let selectedListening;
      if (storedListening) {
        // Use the stored listening
        selectedListening = listeningData.find(listening => listening.id === parseInt(storedListening));
      } else {
        // Select a random listening and store it
        const randomListeningIndex = Math.floor(Math.random() * listeningData.length);
        selectedListening = listeningData[randomListeningIndex];
        localStorage.setItem('practical_listening_page8_selected', selectedListening.id.toString());
      }
      
      // Display the selected listening
      displayListening(selectedListening);
      
      // Select 5 random questions FROM THE SELECTED LISTENING ONLY
      const selectedQuestions = selectRandomQuestions(selectedListening.questions, 5);
      
      // Display the selected questions
      displayQuestions(selectedQuestions);
      
      // Store selected questions in localStorage for consistency
      localStorage.setItem('practical_listening_page8_questions', JSON.stringify(selectedQuestions.map(q => q.id)));
    }

    function displayListening(listening) {
      const mainCard = document.getElementById('mainCard');
      
      // Clear existing content
      mainCard.innerHTML = '';
      
      // Create and append the selected listening
      const listeningElement = document.createElement('div');
      listeningElement.className = 'listening-selection';
      listeningElement.innerHTML = `
        <div class="inner-card">
          <p class="font-bold text-center mb-1">
            Listening Comprehension - Advanced Professional (C1)
          </p>
          <p class="text-center mb-3">
            Listen to the conversation and answer questions 1-5. You can play the audio up to 3 times.
          </p>
          <p class="listening-title">${listening.title}</p>
          
          <div class="audio-player">
            <p class="text-sm font-semibold mb-2">🎧 Audio: ${listening.title}</p>
            <div class="audio-controls">
              <button id="playButton" class="play-button" onclick="playAudio()">
                <i class="fas fa-play"></i>
              </button>
              <div class="text-sm mt-2">
                <div id="audioDuration">Duration: Loading...</div>
                <div id="playCount" class="play-count">Plays remaining: 3/3</div>
              </div>
            </div>

            <!-- Audio Progress Bar -->
            <div class="audio-progress-container" style="width: 100%; margin: 1rem 0;">
              <div class="audio-progress-bar" style="width: 100%; height: 6px; background-color: #e2e8f0; border-radius: 3px; overflow: hidden;">
                <div id="audioProgress" style="width: 0%; height: 100%; background-color: #3b82f6; transition: width 0.1s ease;"></div>
              </div>
              <div class="audio-time-display" style="display: flex; justify-content: space-between; margin-top: 0.5rem; font-size: 0.75rem; color: #64748b;">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
              </div>
            </div>

            <audio id="audioPlayer" preload="metadata">
              <source src="${listening.audioFile}" type="audio/wav">
              Your browser does not support the audio element.
            </audio>
          </div>

          <p class="text-xs text-gray-600 mt-2">
            <strong>Transcript Preview:</strong> ${listening.description}
          </p>
        </div>
      `;
      
      mainCard.appendChild(listeningElement);
      
      // Initialize audio player
      initializeAudioPlayer();
    }

    function initializeAudioPlayer() {
      const audio = document.getElementById('audioPlayer');
      const playButton = document.getElementById('playButton');
      const playCountDisplay = document.getElementById('playCount');
      const audioDuration = document.getElementById('audioDuration');
      const audioProgress = document.getElementById('audioProgress');
      const currentTimeDisplay = document.getElementById('currentTime');
      const totalTimeDisplay = document.getElementById('totalTime');
      
      // Reset play count from localStorage or start fresh
      const storedPlayCount = localStorage.getItem('practical_listening_page8_playcount');
      playCount = storedPlayCount ? parseInt(storedPlayCount) : 0;
      updatePlayCount();
      
      // Load audio metadata
      audio.addEventListener('loadedmetadata', () => {
        const duration = Math.floor(audio.duration);
        const minutes = Math.floor(duration / 60);
        const seconds = duration % 60;
        audioDuration.textContent = `Duration: ${minutes}:${seconds.toString().padStart(2, '0')}`;
        totalTimeDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
      });
      
      // Update progress bar
      audio.addEventListener('timeupdate', () => {
        const progress = (audio.currentTime / audio.duration) * 100;
        audioProgress.style.width = progress + '%';
        
        const currentMinutes = Math.floor(audio.currentTime / 60);
        const currentSeconds = Math.floor(audio.currentTime % 60);
        currentTimeDisplay.textContent = `${currentMinutes}:${currentSeconds.toString().padStart(2, '0')}`;
      });
      
      // Handle audio end
      audio.addEventListener('ended', () => {
        playButton.innerHTML = '<i class="fas fa-play"></i>';
        audioProgress.style.width = '0%';
        currentTimeDisplay.textContent = '0:00';
      });
    }

    function playAudio() {
      const audio = document.getElementById('audioPlayer');
      const playButton = document.getElementById('playButton');
      
      if (audio.paused) {
        if (playCount >= maxPlays) {
          alert('You have reached the maximum number of plays (3 times).');
          return;
        }
        
        audio.play();
        playButton.innerHTML = '<i class="fas fa-pause"></i>';
        
        // Increment play count only when starting from beginning
        if (audio.currentTime === 0) {
          playCount++;
          localStorage.setItem('practical_listening_page8_playcount', playCount.toString());
          updatePlayCount();
        }
      } else {
        audio.pause();
        playButton.innerHTML = '<i class="fas fa-play"></i>';
      }
    }

    function updatePlayCount() {
      const playCountDisplay = document.getElementById('playCount');
      if (playCountDisplay) {
        const remaining = maxPlays - playCount;
        playCountDisplay.textContent = `Plays remaining: ${remaining}/${maxPlays}`;
        if (remaining === 0) {
          playCountDisplay.style.color = '#dc2626';
        }
      }
    }

    function selectRandomQuestions(questions, count) {
      // If we have fewer questions than requested, return all
      if (questions.length <= count) {
        return [...questions];
      }
      
      // Shuffle array using Fisher-Yates algorithm
      const shuffled = [...questions];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      // Return the first 'count' questions
      return shuffled.slice(0, count);
    }

    function displayQuestions(questions) {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';
      
      questions.forEach((question, index) => {
        const questionElement = document.createElement('section');
        questionElement.className = 'card rounded-xl mt-6 question-card';
        questionElement.setAttribute('aria-label', `Question ${index + 1}`);
        questionElement.setAttribute('role', 'region');
        questionElement.setAttribute('aria-labelledby', `q${index + 1}-label`);
        
        let optionsHTML = '';
        question.options.forEach((option, optionIndex) => {
          optionsHTML += `
            <label>
              <input class="mr-1" name="q${question.id}" type="radio" value="${option}" ${optionIndex === question.correct ? 'data-correct="true"' : ''} />
              ${option}
            </label>
          `;
        });
        
        questionElement.innerHTML = `
          <p id="q${index + 1}-label" class="mb-2 text-[10px] font-semibold">
            ${index + 1}. ${question.text}
          </p>
          <form>
            ${optionsHTML}
          </form>
        `;
        
        container.appendChild(questionElement);
      });
    }

    // Validation functions
    function initValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) names.add(radio.name);
        }
      });

      questionCount = names.size;

      if (questionCount === 0) return;

      radios.forEach(radio => {
        radio.addEventListener('change', updateValidation);
      });

      addProgressIndicator();
      updateValidation();
    }

    function updateValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();
      const answered = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) {
            names.add(radio.name);
            if (radio.checked) answered.add(radio.name);
          }
        }
      });

      answeredCount = answered.size;
      updateProgressIndicator();

      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) {
        if (answeredCount === questionCount) {
          nextBtn.style.opacity = '1';
          nextBtn.style.pointerEvents = 'auto';
          nextBtn.removeAttribute('data-disabled');
        } else {
          nextBtn.style.opacity = '0.6';
          nextBtn.style.pointerEvents = 'none';
          nextBtn.setAttribute('data-disabled', 'true');
        }
      }
    }

    function addProgressIndicator() {
      if (document.querySelector('.progress-indicator')) return;

      const progress = document.createElement('div');
      progress.className = 'progress-indicator';
      progress.style.cssText = `
        position: fixed; bottom: 80px; left: 20px; background: white; padding: 8px 12px;
        border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); font-size: 12px; z-index: 1000;
        border-left: 3px solid #f59e0b;
      `;
      progress.innerHTML = `<span id="progress-text">Progress: 0/${questionCount}</span>`;
      document.body.appendChild(progress);
    }

    function updateProgressIndicator() {
      const text = document.getElementById('progress-text');
      if (text) {
        text.textContent = `Progress: ${answeredCount}/${questionCount}`;
        const indicator = document.querySelector('.progress-indicator');
        if (answeredCount === questionCount) {
          indicator.style.borderLeftColor = '#10b981';
          text.textContent += ' ✓';
        } else {
          indicator.style.borderLeftColor = '#f59e0b';
        }
      }
    }

    // Prevent navigation if incomplete
    document.addEventListener('click', (e) => {
      const target = e.target.closest('#nextBtn[data-disabled="true"]');
      if (target) {
        e.preventDefault();
        alert(`Mohon jawab semua soal terlebih dahulu!
Sisa ${questionCount - answeredCount} soal.`);
      }
    });

    function initializeCountdown() {
      const totalSeconds = 90 * 60;
      const progressBar = document.getElementById("progressBar");
      const timeDisplay = document.getElementById("timeDisplay");

      let remainingSeconds;
      const savedTime = localStorage.getItem('testRemainingTime');
      const savedTimestamp = localStorage.getItem('testTimestamp');

      if (savedTime && savedTimestamp) {
        const currentTime = Date.now();
        const elapsedSeconds = Math.floor((currentTime - parseInt(savedTimestamp)) / 1000);
        remainingSeconds = Math.max(0, parseInt(savedTime) - elapsedSeconds);
      } else {
        remainingSeconds = totalSeconds;
        localStorage.setItem('testRemainingTime', remainingSeconds.toString());
        localStorage.setItem('testTimestamp', Date.now().toString());
      }

      function updateCountdown() {
        if (remainingSeconds < 0) {
          remainingSeconds = 0;
          clearInterval(timerInterval);
          localStorage.removeItem('testRemainingTime');
          localStorage.removeItem('testTimestamp');
        }

        if (progressBar) {
          progressBar.value = remainingSeconds;
          progressBar.setAttribute("aria-valuenow", remainingSeconds);
        }

        if (timeDisplay) {
          const hours = Math.floor(remainingSeconds / 3600);
          const minutes = Math.floor((remainingSeconds % 3600) / 60);
          const seconds = remainingSeconds % 60;
          const displayText = `${hours}Jam ${minutes}Menit ${seconds}Detik`;
          timeDisplay.textContent = displayText;
        }

        localStorage.setItem('testRemainingTime', remainingSeconds.toString());
        localStorage.setItem('testTimestamp', Date.now().toString());

        remainingSeconds--;
      }

      if (progressBar && timeDisplay) {
        updateCountdown();
        const timerInterval = setInterval(updateCountdown, 1000);
      }
    }

    function initializeTabSwitchDetection() {
      let isTabSwitchModalShown = false;

      const modalHTML = `
        <div id="tabSwitchModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); z-index: 9999; justify-content: center; align-items: center;">
          <div style="background: white; padding: 2rem; border-radius: 1rem; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);">
            <div style="color: #dc2626; font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
            <h2 style="color: #1e293b; margin-bottom: 1rem; font-size: 1.25rem; font-weight: 700;">Peringatan!</h2>
            <p style="color: #64748b; margin-bottom: 1.5rem; line-height: 1.5;">Anda terdeteksi membuka tab lain. Harap fokus pada halaman tes untuk melanjutkan.</p>
            <button id="closeTabModal" style="background-color: #3b82f6; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer;">
              Kembali ke Tes
            </button>
          </div>
        </div>
      `;

      document.body.insertAdjacentHTML('beforeend', modalHTML);

      const modal = document.getElementById('tabSwitchModal');
      const closeBtn = document.getElementById('closeTabModal');

      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          modal.style.display = 'none';
          isTabSwitchModalShown = false;
        });
      }

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && !isTabSwitchModalShown) {
          setTimeout(() => {
            if (document.hidden && !isTabSwitchModalShown) {
              modal.style.display = 'flex';
              isTabSwitchModalShown = true;
            }
          }, 1000);
        }
      });
    }

    // Global variables for validation
    let questionCount = 0;
    let answeredCount = 0;
  </script>

  <script>
    // Page Protection Script for Practical English Test
    (function() {
      // Check if this is a Practical English test page
      const currentPage = window.location.pathname.split('/').pop();
      
      // Define the correct test sequence for Practical English
      const testSequence = [
        'page3.html',
        'page4-reading.html',
        'page5-reading.html',
        'page6-reading.html',
        'page7-reading.html',
        'page8-reading.html',
        'page4-listening.html',
        'page5-listening.html',
        'page6-listening.html',
        'page7-listening.html',
        'page8-listening.html',
        'office-grammar-2.html',
        'office-grammar-3.html',
        'office-grammar-4.html',
        'office-grammar-5.html',
        'office-grammar-6.html',
        'station-speaking-reading-1.html',
        'station-speaking-reading-2.html',
        'station-speaking-reading-3.html',
        'station-speaking-reading-4.html',
        'station-speaking-reading-5.html',
        'practical-english-results.html'
      ];
      
      // Check if user has started the test
      const testStarted = localStorage.getItem('practical_test_started');
      const selectedProgram = localStorage.getItem('selectedProgram');
      
      // Only apply protection if this is a Practical English test page
      if (testSequence.includes(currentPage)) {
        // Check if user came from page2 with Practical English selected
        if (!testStarted || selectedProgram !== 'practical-english') {
          alert('Anda harus memulai tes dari halaman pendaftaran!');
          window.location.href = 'page2.html';
          return;
        }
        
        // Check if user is accessing pages in correct sequence
        const currentPageIndex = testSequence.indexOf(currentPage);
        const allowedPage = localStorage.getItem('practical_current_page');
        const allowedPageIndex = testSequence.indexOf(allowedPage);
        
        // Allow access only to current page or previous pages
        if (currentPageIndex > allowedPageIndex) {
          alert('Anda harus mengerjakan soal secara berurutan!');
          window.location.href = allowedPage;
          return;
        }
      }
      
      // Update current page when navigating forward
      window.addEventListener('beforeunload', function() {
        const nextPageIndex = testSequence.indexOf(currentPage) + 1;
        if (nextPageIndex < testSequence.length) {
          localStorage.setItem('practical_current_page', testSequence[nextPageIndex]);
        }
      });
    })();
  </script>

  <script>
    // Answer Tracking for page8-listening.html
    (function() {
      // Initialize answer tracking
      let answers = {};
      let correctAnswers = 0;
      let totalQuestions = 0;
      
      // Function to save answers to localStorage
      function saveAnswers() {
        const answerData = {
          answers: answers,
          correct: correctAnswers,
          total: totalQuestions,
          timestamp: new Date().toISOString()
        };
        localStorage.setItem('practical_listening_page8_answers', JSON.stringify(answerData));
        console.log('Saved answers for page8-listening.html:', answerData);
      }
      
      // Track all radio button changes
      document.addEventListener('DOMContentLoaded', function() {
        const radioButtons = document.querySelectorAll('input[type="radio"]');
        totalQuestions = new Set(Array.from(radioButtons).map(r => r.name)).size;
        
        radioButtons.forEach(radio => {
          radio.addEventListener('change', function() {
            const questionName = this.name;
            const selectedValue = this.value;
            const correctValue = this.getAttribute('data-correct') || this.closest('label').getAttribute('data-correct');
            
            // Check if answer is correct
            const isCorrect = (selectedValue === correctValue) || 
                            (this.hasAttribute('data-correct') && this.getAttribute('data-correct') === 'true') ||
                            (this.closest('label').hasAttribute('data-correct') && this.closest('label').getAttribute('data-correct') === selectedValue);
            
            // Update answers object
            if (answers[questionName]) {
              // Remove previous answer from correct count
              if (answers[questionName].correct) {
                correctAnswers--;
              }
            }
            
            answers[questionName] = {
              selected: selectedValue,
              correct: isCorrect,
              timestamp: new Date().toISOString()
            };
            
            if (isCorrect) {
              correctAnswers++;
            }
            
            // Save to localStorage
            saveAnswers();
          });
        });
        
        // Load previous answers if any
        const savedData = localStorage.getItem('practical_listening_page8_answers');
        if (savedData) {
          try {
            const data = JSON.parse(savedData);
            answers = data.answers || {};
            correctAnswers = data.correct || 0;
            totalQuestions = data.total || totalQuestions;
            
            // Restore radio button selections
            Object.keys(answers).forEach(questionName => {
              const radio = document.querySelector(`input[name="${questionName}"][value="${answers[questionName].selected}"]`);
              if (radio) {
                radio.checked = true;
              }
            });
          } catch (e) {
            console.error('Error loading saved answers:', e);
          }
        }
      });
    })();
  </script>
