  <script>
   // Use pointerup event for better responsiveness on all devices
    const openModalBtn = document.getElementById("openModalBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const modal = document.getElementById("modal");

openModalBtn.addEventListener("pointerup", (e) => {
      e.preventDefault();
      modal.classList.remove("hidden");
      modal.setAttribute("aria-hidden", "false");
      closeModalBtn.focus();
      // Prevent body scroll when modal open
      document.body.style.overflow = "hidden";
    });

closeModalBtn.addEventListener("pointerup", (e) => {
      e.preventDefault();
      modal.classList.add("hidden");
      modal.setAttribute("aria-hidden", "true");
      openModalBtn.focus();
      // Restore body scroll
      document.body.style.overflow = "";
    });

modal.addEventListener("pointerup", (e) => {
      if (e.target === modal) {
        modal.classList.add("hidden");
        modal.setAttribute("aria-hidden", "true");
        openModalBtn.focus();
        document.body.style.overflow = "";
      }
    });

document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !modal.classList.contains("hidden")) {
        modal.classList.add("hidden");
        modal.setAttribute("aria-hidden", "true");
        openModalBtn.focus();
        document.body.style.overflow = "";
      }
    });

// Navigation based on program selection
    document.getElementById('programForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const selectedProgram = document.querySelector('input[name="program"]:checked');

      if (!selectedProgram) {
        alert('Silakan pilih program kursus terlebih dahulu!');
        return false;
      }

      // Get form data - FIX: use correct field names from HTML
      const formData = new FormData(e.target);
      const userName = formData.get('nama') || ''; // Changed from 'name' to 'nama'
      const userEmail = formData.get('email') || '';
      const userWhatsApp = formData.get('whatsapp') || '';

      // Store selection in localStorage for page3 to use
      localStorage.setItem('selectedProgram', selectedProgram.value);
      
      // Store user data in multiple keys for compatibility
      localStorage.setItem('userName', userName);
      localStorage.setItem('userEmail', userEmail);
      localStorage.setItem('userWhatsApp', userWhatsApp);

      // Store user data based on program
