  <div class="next-button-container">
    <a href="toefl_listening_5.html" id="nextBtn" class="btn-animate inline-block text-center" aria-label="Next question">

  <script>
    const listeningData = [
      {

      },
      {
        id: 3,
        title: "Lecture on Genetic Engineering",

        questions: [

          {

      },
      {
        id: 4,
        title: "Conversation about Career Planning",
        audioFile: "audio/career-planning.wav",
        description: "A student discusses career options and skill development with a career counselor.",
        questions: [
          {
            id: 16,
            text: "What is the student's main concern?",
            options: [
              "Choosing between multiple interests",
              "Lacking specific skills",
              "Uncertain job market",
              "All of the above"
            ],
            correct: 3
          },
          {
            id: 17,
            text: "What advice does the counselor give?",
            options: [
              "Identify transferable skills",
              "Gain practical experience",
              "Network with professionals",

            ],
            correct: 3
          },
          {
            id: 18,
            text: "What resource is recommended?",
            options: [
              "Internship programs",
              "Career assessments",
              "Alumni network",
              "All of the above"
            ],
            correct: 3
          },
          {
            id: 19,
            text: "What timeline is suggested for planning?",
            options: [
              "Start early and be flexible",
              "Wait until graduation",
              "Focus only on current semester",
              "Plan everything in detail"
            ],
            correct: 0
          },
          {
            id: 20,
            text: "What does the student decide to do first?",
            options: [
              "Take a career assessment",
              "Apply for internships",
              "Contact alumni",
              "Research companies"
            ],
            correct: 0
          }
        ]
      }
    ];

    let currentAudio = null;
    let playCount = 0;
    const maxPlays = 3;

    document.addEventListener('DOMContentLoaded', () => {
      initializeTest();
      setTimeout(initValidation, 100);
      initializeCountdown();
      initializeTabSwitchDetection();
      initializeProtection();
    });

    function initializeTest() {
      const storedListening = localStorage.getItem('toefl_listening_4_selected');
      
      let selectedListening;
      if (storedListening) {
        selectedListening = listeningData.find(listening => listening.id === parseInt(storedListening));
      } else {
        const randomListeningIndex = Math.floor(Math.random() * listeningData.length);
        selectedListening = listeningData[randomListeningIndex];
        localStorage.setItem('toefl_listening_4_selected', selectedListening.id.toString());
      }
      
      displayListening(selectedListening);
      const selectedQuestions = selectRandomQuestions(selectedListening.questions, 5);
      displayQuestions(selectedQuestions);
      localStorage.setItem('toefl_listening_4_questions', JSON.stringify(selectedQuestions.map(q => q.id)));
    }

    function displayListening(listening) {
      const mainCard = document.getElementById('mainCard');
      mainCard.innerHTML = '';
      
      const listeningElement = document.createElement('div');
      listeningElement.className = 'listening-selection';
      listeningElement.innerHTML = `
        <div class="inner-card">
          <p class="font-bold text-center mb-1">
            TOEFL Listening - Academic Lectures
          </p>
          <p class="text-center mb-3">
            Listen to the audio and answer questions 1-5. You can play the audio up to 3 times.
          </p>
          <p class="listening-title">${listening.title}</p>
          
          <div class="audio-player">
            <p class="text-sm font-semibold mb-2">🎧 Audio: ${listening.title}</p>
            <div class="audio-controls">
              <button id="playButton" class="play-button" onclick="playAudio()">
                <i class="fas fa-play"></i>
              </button>
              <div class="text-sm mt-2">
                <div id="audioDuration">Duration: 2:00-3:00</div>
                <div id="playCount" class="play-count">Plays remaining: 3/3</div>
              </div>
            </div>

            <div class="audio-progress-container" style="width: 100%; margin: 1rem 0;">
              <div class="audio-progress-bar" style="width: 100%; height: 6px; background-color: #e2e8f0; border-radius: 3px; overflow: hidden;">
                <div id="audioProgress" style="width: 0%; height: 100%; background-color: #dc2626; transition: width 0.1s ease;"></div>
              </div>
              <div class="audio-time-display" style="display: flex; justify-content: space-between; margin-top: 0.5rem; font-size: 0.75rem; color: #64748b;">
                <span id="currentTime">0:00</span>
                <span id="totalTime">2:30</span>
              </div>
            </div>

            <audio id="audioPlayer" preload="metadata">
              <source src="${listening.audioFile}" type="audio/wav">
              Your browser does not support the audio element.
            </audio>
          </div>

          <p class="text-xs text-gray-600 mt-2">
            <strong>Context:</strong> ${listening.description}
          </p>
        </div>
      `;
      
      mainCard.appendChild(listeningElement);
      initializeAudioPlayer();
    }

    function initializeAudioPlayer() {
      const playCountDisplay = document.getElementById('playCount');
      const storedPlayCount = localStorage.getItem('toefl_listening_4_playcount');
      playCount = storedPlayCount ? parseInt(storedPlayCount) : 0;
      updatePlayCount();
    }

    function playAudio() {
      if (playCount >= maxPlays) {
        alert('You have reached the maximum number of plays (3 times).');
        return;
      }
      
      const audioPlayer = document.getElementById('audioPlayer');
      const playButton = document.getElementById('playButton');
      const audioProgress = document.getElementById('audioProgress');
      const currentTimeDisplay = document.getElementById('currentTime');
      const totalTimeDisplay = document.getElementById('totalTime');
      
      if (!audioPlayer) {
        alert('Audio player not found. Please refresh the page.');
        return;
      }
      
      if (!audioPlayer.paused) {
        audioPlayer.pause();
        playButton.innerHTML = '<i class="fas fa-play"></i>';
        return;
      }
      
      playCount++;
      localStorage.setItem('toefl_listening_4_playcount', playCount.toString());
      updatePlayCount();
      
      playButton.innerHTML = '<i class="fas fa-pause"></i>';
      
      audioPlayer.play().catch(error => {
        console.error('Error playing audio:', error);
        alert('Error playing audio. Please check if the audio file exists.');
        playButton.innerHTML = '<i class="fas fa-play"></i>';
        playCount--;
        localStorage.setItem('toefl_listening_4_playcount', playCount.toString());
        updatePlayCount();
      });
      
      audioPlayer.ontimeupdate = function() {
        const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        audioProgress.style.width = progress + '%';
        
        const minutes = Math.floor(audioPlayer.currentTime / 60);
        const seconds = Math.floor(audioPlayer.currentTime % 60);
        currentTimeDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
      };
      
      audioPlayer.onloadedmetadata = function() {
        const totalMinutes = Math.floor(audioPlayer.duration / 60);
        const totalSeconds = Math.floor(audioPlayer.duration % 60);
        totalTimeDisplay.textContent = `${totalMinutes}:${totalSeconds.toString().padStart(2, '0')}`;
      };
      
      audioPlayer.onended = function() {
        playButton.innerHTML = '<i class="fas fa-play"></i>';
        audioProgress.style.width = '0%';
        currentTimeDisplay.textContent = '0:00';
      };
      
      audioPlayer.onpause = function() {
        if (audioPlayer.currentTime < audioPlayer.duration) {
          playButton.innerHTML = '<i class="fas fa-play"></i>';
        }
      };
    }

    function updatePlayCount() {
      const playCountDisplay = document.getElementById('playCount');
      if (playCountDisplay) {
        const remaining = maxPlays - playCount;
        playCountDisplay.textContent = `Plays remaining: ${remaining}/${maxPlays}`;
        if (remaining === 0) {
          playCountDisplay.style.color = '#dc2626';
        }
      }
    }

    function selectRandomQuestions(questions, count) {
      if (questions.length <= count) {
        return [...questions];
      }
      
      const shuffled = [...questions];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      return shuffled.slice(0, count);
    }

    function displayQuestions(questions) {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';
      
      questions.forEach((question, index) => {
        const questionElement = document.createElement('section');
        questionElement.className = 'card rounded-xl mt-6 question-card';
        questionElement.setAttribute('aria-label', `Question ${index + 1}`);
        
        let optionsHTML = '';
        question.options.forEach((option, optionIndex) => {
          optionsHTML += `
            <label>
              <input class="mr-1" name="q${question.id}" type="radio" value="${option}" ${optionIndex === question.correct ? 'data-correct="true"' : ''} />
              ${option}
            </label>
          `;
        });
        
        questionElement.innerHTML = `
          <p class="mb-2 text-[10px] font-semibold">
            ${index + 1}. ${question.text}
          </p>
          <form>
            ${optionsHTML}
          </form>
        `;
        
        container.appendChild(questionElement);
      });
    }

    let questionCount = 0;
    let answeredCount = 0;

    function initValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) names.add(radio.name);
        }
      });

      questionCount = names.size;
      if (questionCount === 0) return;

      radios.forEach(radio => {
        radio.addEventListener('change', updateValidation);
      });

      addProgressIndicator();
      updateValidation();
    }

    function updateValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();
      const answered = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) {
            names.add(radio.name);
            if (radio.checked) answered.add(radio.name);
          }
        }
      });

      answeredCount = answered.size;
      updateProgressIndicator();

      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) {
        if (answeredCount === questionCount) {
          nextBtn.style.opacity = '1';
          nextBtn.style.pointerEvents = 'auto';
          nextBtn.removeAttribute('data-disabled');
        } else {
          nextBtn.style.opacity = '0.6';
          nextBtn.style.pointerEvents = 'none';
          nextBtn.setAttribute('data-disabled', 'true');
        }
      }
    }

    function addProgressIndicator() {
      if (document.querySelector('.progress-indicator')) return;

      const progress = document.createElement('div');
      progress.className = 'progress-indicator';
      progress.innerHTML = `<span id="progress-text">Progress: 0/${questionCount}</span>`;
      document.body.appendChild(progress);
    }

    function updateProgressIndicator() {
      const text = document.getElementById('progress-text');
      if (text) {
        text.textContent = `Progress: ${answeredCount}/${questionCount}`;
        const indicator = document.querySelector('.progress-indicator');
        if (answeredCount === questionCount) {
          indicator.style.borderLeftColor = '#10b981';
          text.textContent += ' ✓';
        }
      }
    }

    document.addEventListener('click', (e) => {
      const target = e.target.closest('#nextBtn[data-disabled="true"]');
      if (target) {
        e.preventDefault();
        alert(`Please answer all questions before proceeding!\nRemaining: ${questionCount - answeredCount} questions.`);
      }
    });

    function initializeCountdown() {
      const totalSeconds = 60 * 60;
      const progressBar = document.getElementById("progressBar");
      const timeDisplay = document.getElementById("timeDisplay");

      let remainingSeconds = totalSeconds;

      function updateCountdown() {
        if (remainingSeconds < 0) {
          remainingSeconds = 0;
          alert('Time is up! Test will end.');
          return;
        }

        if (progressBar) {
          progressBar.value = remainingSeconds;
        }

        if (timeDisplay) {
          const hours = Math.floor(remainingSeconds / 3600);
          const minutes = Math.floor((remainingSeconds % 3600) / 60);
          const seconds = remainingSeconds % 60;
          timeDisplay.textContent = `${hours}Jam ${minutes}Menit ${seconds}Detik`;
        }

        remainingSeconds--;
      }

      if (progressBar && timeDisplay) {
        updateCountdown();
        setInterval(updateCountdown, 1000);
      }
    }

    function initializeTabSwitchDetection() {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          setTimeout(() => {
            if (document.hidden) {
              alert('Warning: Please focus on the test page.');
            }
          }, 1000);
        }
      });
    }

    function initializeProtection() {
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) {
          e.preventDefault();
        }
      });
    }
  
    document.getElementById('nextBtn').addEventListener('click', function(e) {
      if (answeredCount === questionCount) {
        const radios = document.querySelectorAll('input[type="radio"]:checked');
        let correct = 0;
        let total = 0;
        
        radios.forEach(radio => {
          total++;
          if (radio.hasAttribute('data-correct')) {
            correct++;
          }
        });
        
        const storageKey = 'toefl_listening_4_score';
        localStorage.setItem(storageKey, JSON.stringify({ correct, total }));
