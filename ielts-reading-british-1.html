  <script>

        text: `British cuisine has a rich history and includes many traditional dishes. One of the most famous British meals is the full English breakfast, which typically includes eggs, bacon, sausages, baked beans, toast, mushrooms, and tomatoes. Fish and chips is another classic British dish, consisting of fried fish served with thick-cut potatoes. Sunday roast is a traditional meal eaten on Sundays, featuring roasted meat, potatoes, vegetables, and Yorkshire pudding.

Tea is the most popular drink in Britain. British people often drink tea with milk and sometimes sugar. The tradition of afternoon tea started in the 1840s when the Duchess of Bedford began having tea and snacks in the afternoon. Today, many British people enjoy a cup of tea several times a day.

Other popular British foods include shepherd's pie (made with minced meat and mashed potatoes), Cornish pasties (savory pastries filled with meat and vegetables), and scones (often eaten with jam and cream during afternoon tea). British cuisine has become more diverse in recent years, with influences from around the world.`,

              "With honey",
              "Without anything"
            ],
            correct: 1
          },
          {
            id: 5,

            options: [
              "Fish and potatoes",

        ]
      },
      {
        id: 2,
        title: "British Holidays and Celebrations",
        text: `Britain has many traditional holidays and celebrations throughout the year. Christmas is one of the most important holidays, celebrated on December 25th. British families often decorate Christmas trees, exchange gifts, and have a special Christmas dinner featuring turkey, roast potatoes, and Christmas pudding.

Bonfire Night, also known as Guy Fawkes Night, is celebrated on November 5th. This tradition remembers the failed Gunpowder Plot of 1605. People light bonfires and watch fireworks displays. Traditionally, effigies of Guy Fawkes are burned on the bonfires.

Easter is another significant holiday in Britain. It celebrates the resurrection of Jesus Christ. British traditions include Easter egg hunts, where children search for chocolate eggs hidden in gardens or parks. Hot cross buns, spiced sweet buns with a cross on top, are traditionally eaten on Good Friday.

Other British celebrations include New Year's Eve, when people gather to count down to midnight, and Bank Holidays, which are public holidays when most people have a day off work. Summer bank holidays often involve outdoor activities and trips to the seaside.`,
        questions: [
          {
            id: 6,
            text: "When is Christmas celebrated in Britain?",
            options: [
              "December 24th",
              "December 25th",
              "January 1st",

          {

            options: [

              "Plot Night"
            ],
            correct: 1
          },
          {
            id: 8,
            text: "What do children search for during Easter?",
            options: [
              "Christmas presents",
              "Chocolate eggs",
              "Money",
              "Hot cross buns"
            ],
            correct: 1
          },
          {
            id: 9,
            text: "What are Bank Holidays?",
            options: [
              "Days when banks are open late",
              "Public holidays with day off work",
              "Days for banking activities",
              "Holidays only for bank workers"
            ],
            correct: 1
          },
          {
            id: 10,

            options: [

              "Fish and chips"
            ],
            correct: 2
          }
        ]
      },
      {
        id: 3,
        title: "British Royal Family",
        text: `The British Royal Family plays an important role in the country's culture and traditions. The monarch is the head of state, and currently, that is King Charles III. The royal family lives in several palaces, including Buckingham Palace in London, which is the monarch's official residence.

One of the most famous royal events is the Changing of the Guard ceremony at Buckingham Palace. This ceremony involves soldiers from the Queen's Guard exchanging duties with the new guard. Tourists often gather to watch this colorful ceremony.

The royal family also participates in the State Opening of Parliament, where the monarch delivers the Queen's Speech outlining the government's plans for the coming year. Another important event is Trooping the Colour, which celebrates the monarch's official birthday with a military parade.

The royal weddings and births are celebrated across the country. When a royal baby is born, an announcement is placed on an easel outside Buckingham Palace. The royal family represents Britain at home and abroad and supports many charitable organizations.`,
        questions: [
          {

            text: "Who is the current British monarch?",
            options: [
              "Queen Elizabeth II",
              "King Charles III",
              "Prince William",

            correct: 1
          },
          {

            options: [

            ],
            correct: 1
          },
          {

            text: "What happens during Trooping the Colour?",
            options: [
              "Royal wedding ceremony",
              "Military parade for monarch's birthday",

              "Parliament opening"
            ],
            correct: 1
          },
          {
            id: 14,
            text: "Where is royal baby announcements displayed?",
            options: [
              "On television only",

            ],

          },
          {
            id: 15,
            text: "What is the monarch's official residence?",
            options: [
              "Windsor Castle",

              "Buckingham Palace",
              "Tower of London"
            ],
            correct: 2
          }
        ]
      },
      {
        id: 4,
        title: "British Education System",
        text: `The British education system is divided into several stages. Children typically start primary school at age 5 and continue until age 11. Then they move to secondary school, which lasts until age 16. At age 16, students take important exams called GCSEs (General Certificate of Secondary Education).

After GCSEs, students can choose to continue their education. They may study for A-levels (Advanced Level qualifications) at a sixth form college or stay at their secondary school for two more years. A-levels are important for university entrance.

University education in Britain typically takes three years for a bachelor's degree. The most famous universities are Oxford and Cambridge, often called Oxbridge. There are also many other excellent universities across the country.

The school year in Britain is divided into three terms: autumn term (September to December), spring term (January to Easter), and summer term (Easter to July). Students have holidays at Christmas, Easter, and during the summer. There are also half-term breaks during each term.`,
        questions: [
          {
            id: 16,
            text: "At what age do children start primary school in Britain?",
            options: [
              "Age 3",
              "Age 5",

          },
          {

          },
          {

            options: [
              "Two years",

              "Five years"
            ],
            correct: 1
          },
          {
            id: 19,
            text: "What are Oxford and Cambridge universities often called?",
            options: [
              "The Big Two",
              "Oxbridge",
              "The Ancient Universities",
              "The Royal Universities"
            ],
            correct: 1
          },
          {
            id: 20,
            text: "How many terms are in the British school year?",
            options: [
              "Two terms",
              "Three terms",
              "Four terms",
              "Five terms"
            ],
            correct: 1
          }
        ]
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      initializeTest();
      setTimeout(initValidation, 100);
      initializeCountdown();
      initializeTabSwitchDetection();
      initializeProtection();
    });

    function initializeTest() {
      const storedReading = localStorage.getItem('ielts_british_reading_1_selected');
      
      let selectedReading;
      if (storedReading) {
        selectedReading = readingData.find(reading => reading.id === parseInt(storedReading));
      } else {
        const randomReadingIndex = Math.floor(Math.random() * readingData.length);
        selectedReading = readingData[randomReadingIndex];
        localStorage.setItem('ielts_british_reading_1_selected', selectedReading.id.toString());
      }
      
      displayReading(selectedReading);
      const selectedQuestions = selectRandomQuestions(selectedReading.questions, 5);
      displayQuestions(selectedQuestions);
      localStorage.setItem('ielts_british_reading_1_questions', JSON.stringify(selectedQuestions.map(q => q.id)));
    }

    function displayReading(reading) {
      const mainCard = document.getElementById('mainCard');
      mainCard.innerHTML = '';
      
      const readingElement = document.createElement('div');
      readingElement.className = 'reading-selection';
      readingElement.innerHTML = `
        <div class="inner-card">
          <p class="font-bold text-center mb-1">
            IELTS A2 Reading - British Culture
          </p>
          <p class="text-center mb-3">
            Read the text and answer questions 1-5.
          </p>
          <p class="reading-title">${reading.title}</p>
          
          <div class="reading-text">
            ${reading.text}
          </div>
        </div>
      `;
      
      mainCard.appendChild(readingElement);
    }

    function selectRandomQuestions(questions, count) {
      if (questions.length <= count) {
        return [...questions];
      }
      
      const shuffled = [...questions];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      return shuffled.slice(0, count);
    }

    function displayQuestions(questions) {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';
      
      questions.forEach((question, index) => {
        const questionElement = document.createElement('section');
        questionElement.className = 'card rounded-xl mt-6 question-card';
        questionElement.setAttribute('aria-label', `Question ${index + 1}`);
        
        let optionsHTML = '';
        question.options.forEach((option, optionIndex) => {
          optionsHTML += `
            <label>
              <input class="mr-1" name="q${question.id}" type="radio" value="${option}" ${optionIndex === question.correct ? 'data-correct="true"' : ''} />
              ${option}
            </label>
          `;
        });
        
        questionElement.innerHTML = `
          <p class="mb-2 text-[10px] font-semibold">
            ${index + 1}. ${question.text}
          </p>
          <form>
            ${optionsHTML}
          </form>
        `;
        
        container.appendChild(questionElement);
      });
    }

    let questionCount = 0;
    let answeredCount = 0;

    function initValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) names.add(radio.name);
        }
      });

      questionCount = names.size;
      if (questionCount === 0) return;

      radios.forEach(radio => {
        radio.addEventListener('change', updateValidation);
      });

      addProgressIndicator();
      updateValidation();
    }

    function updateValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();
      const answered = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) {
            names.add(radio.name);
            if (radio.checked) answered.add(radio.name);
          }
        }
      });

      answeredCount = answered.size;
      updateProgressIndicator();

      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) {
        if (answeredCount === questionCount) {
          nextBtn.style.opacity = '1';
          nextBtn.style.pointerEvents = 'auto';
          nextBtn.removeAttribute('data-disabled');
        } else {
          nextBtn.style.opacity = '0.6';
          nextBtn.style.pointerEvents = 'none';
          nextBtn.setAttribute('data-disabled', 'true');
        }
      }
    }

    function addProgressIndicator() {
      if (document.querySelector('.progress-indicator')) return;

      const progress = document.createElement('div');
      progress.className = 'progress-indicator';
      progress.innerHTML = `<span id="progress-text">Progress: 0/${questionCount}</span>`;
      document.body.appendChild(progress);
    }

    function updateProgressIndicator() {
      const text = document.getElementById('progress-text');
      if (text) {
        text.textContent = `Progress: ${answeredCount}/${questionCount}`;
        const indicator = document.querySelector('.progress-indicator');
        if (answeredCount === questionCount) {
          indicator.style.borderLeftColor = '#10b981';
          text.textContent += ' ✓';
        }
      }
    }

    document.addEventListener('click', (e) => {
      const target = e.target.closest('#nextBtn[data-disabled="true"]');
      if (target) {
        e.preventDefault();
        alert(`Please answer all questions before proceeding!\nRemaining: ${questionCount - answeredCount} questions.`);
      }
    });

    function initializeCountdown() {
      const totalSeconds = 30 * 60;
      const progressBar = document.getElementById("progressBar");
      const timeDisplay = document.getElementById("timeDisplay");

      let remainingSeconds = totalSeconds;

      function updateCountdown() {
        if (remainingSeconds < 0) {
          remainingSeconds = 0;
          alert('Time is up! Test will end.');
          return;
        }

        if (progressBar) {
          progressBar.value = remainingSeconds;
        }

        if (timeDisplay) {
          const hours = Math.floor(remainingSeconds / 3600);
          const minutes = Math.floor((remainingSeconds % 3600) / 60);
          const seconds = remainingSeconds % 60;
          timeDisplay.textContent = `${hours}Jam ${minutes}Menit ${seconds}Detik`;
        }

        remainingSeconds--;
      }

      if (progressBar && timeDisplay) {
        updateCountdown();
        setInterval(updateCountdown, 1000);
      }
    }

    function initializeTabSwitchDetection() {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          setTimeout(() => {
            if (document.hidden) {
              alert('Warning: Please focus on the test page.');
            }
          }, 1000);
        }
      });
    }

    function initializeProtection() {
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) {
          e.preventDefault();
        }
      });
    }
  
    document.getElementById('nextBtn').addEventListener('click', function(e) {
      if (answeredCount === questionCount) {
        const radios = document.querySelectorAll('input[type="radio"]:checked');
        let correct = 0;
        let total = 0;
        
        radios.forEach(radio => {
          total++;
          if (radio.hasAttribute('data-correct')) {
            correct++;
          }
        });
        
        // Save score with standardized key
        const storageKey = 'ielts_a2_reading_1_score';
        localStorage.setItem(storageKey, JSON.stringify({ correct, total }));
        
        console.log(`Saved ${storageKey}:`, { correct, total });
      }
    });
  </script>
</body>
</html>
