    function initializeTest() {
      const pageNumber = getPageNumber();
      const storedListening = localStorage.getItem(`ielts_b1_listening_${pageNumber}_selected`);

      if (storedListening) {
        selectedListening = listeningData.find(listening => listening.id === parseInt(storedListening));
      } else {
        // Pilih audio yang berbeda untuk setiap halaman
        const availableListenings = listeningData.filter(listening => {
          for (let i = 1; i < pageNumber; i++) {
            const prevSelected = localStorage.getItem(`ielts_b1_listening_${i}_selected`);
            if (prevSelected && parseInt(prevSelected) === listening.id) {
              return false;
            }
          }
          return true;
        });
        
        const randomIndex = Math.floor(Math.random() * availableListenings.length);
        selectedListening = availableListenings[randomIndex];
        localStorage.setItem(`ielts_b1_listening_${pageNumber}_selected`, selectedListening.id.toString());

      displayQuestions(selectedQuestions, pageNumber);
      localStorage.setItem(`ielts_b1_listening_${pageNumber}_questions`, JSON.stringify(selectedQuestions.map(q => q.id)));
    }

    function getPageNumber() {
      const url = window.location.href;
      if (url.includes('ielts-b1-listening-1')) return 1;
      if (url.includes('ielts-b1-listening-2')) return 2;
      if (url.includes('ielts-b1-listening-3')) return 3;
      if (url.includes('ielts-b1-listening-4')) return 4;
      if (url.includes('ielts-b1-listening-5')) return 5;
      return 1;
    }

    function displayListening(listening, pageNumber) {
      const mainCard = document.getElementById('mainCard');
      mainCard.innerHTML = '';
      
      const listeningElement = document.createElement('div');
      listeningElement.className = 'listening-selection';
      listeningElement.innerHTML = `
        <div class="inner-card">
          <h3>🏝️ IELTS B1 Listening - ${listening.title}</h3>
          
          <p class="text-center mb-4">
            ${listening.description} Complete the questions below based on what you hear.
          </p>
          
          <div class="audio-player">
            <p class="text-sm font-semibold mb-2">🎧 Audio: ${listening.title}</p>
            <div class="audio-controls">
              <button id="playButton" class="play-button" onclick="playAudio()">
                <i class="fas fa-play"></i>
              </button>
              <div class="text-sm mt-2">
                <div id="audioDuration">Duration: Loading...</div>
                <div id="playCount" class="play-count">Plays remaining: 3/3</div>
              </div>
            </div>

            <div class="audio-progress-container" style="width: 100%; margin: 1rem 0;">
              <div class="audio-progress-bar" style="width: 100%; height: 6px; background-color: #e2e8f0; border-radius: 3px; overflow: hidden;">
                <div id="audioProgress" style="width: 0%; height: 100%; background-color: #3b82f6; transition: width 0.1s ease;"></div>
              </div>
              <div class="audio-time-display" style="display: flex; justify-content: space-between; margin-top: 0.5rem; font-size: 0.75rem; color: #64748b;">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
              </div>
            </div>

            <audio id="audioPlayer" preload="metadata">
              <source src="${listening.audioFile}" type="audio/wav">
              Your browser does not support the audio element.
            </audio>
          </div>

          <p class="text-xs text-gray-600 mt-2">
            <strong>Instructions:</strong> Listen carefully and answer the questions. You can play the audio up to 3 times.
          </p>
        </div>
      `;
      
      mainCard.appendChild(listeningElement);
      initializeAudioPlayer(pageNumber);
    }

    function initializeAudioPlayer(pageNumber) {
      const playCountDisplay = document.getElementById('playCount');
      const storedPlayCount = localStorage.getItem(`ielts_b1_listening_${pageNumber}_playcount`);
      playCount = storedPlayCount ? parseInt(storedPlayCount) : 0;
      updatePlayCount();
    }

    function playAudio() {
      if (playCount >= maxPlays) {
        alert('You have reached the maximum number of plays (3 times).');
        return;
      }
      
      const audioPlayer = document.getElementById('audioPlayer');
      const playButton = document.getElementById('playButton');
      const audioProgress = document.getElementById('audioProgress');
      const currentTimeDisplay = document.getElementById('currentTime');
      const totalTimeDisplay = document.getElementById('totalTime');
      
      if (!audioPlayer) {
        alert('Audio player not found. Please refresh the page.');
        return;
      }
      
      if (!audioPlayer.paused) {
        audioPlayer.pause();
        playButton.innerHTML = '<i class="fas fa-play"></i>';
        return;
      }
      
      const pageNumber = getPageNumber();
      playCount++;
      localStorage.setItem(`ielts_b1_listening_${pageNumber}_playcount`, playCount.toString());
      updatePlayCount();
      
      playButton.innerHTML = '<i class="fas fa-pause"></i>';
      
      audioPlayer.play().catch(error => {
        console.error('Error playing audio:', error);
        alert('Error playing audio. Please check if the audio file exists.');
        playButton.innerHTML = '<i class="fas fa-play"></i>';
        playCount--;
        localStorage.setItem(`ielts_b1_listening_${pageNumber}_playcount`, playCount.toString());
        updatePlayCount();
      });
      
      audioPlayer.ontimeupdate = function() {
        const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        audioProgress.style.width = progress + '%';
        
        const minutes = Math.floor(audioPlayer.currentTime / 60);
        const seconds = Math.floor(audioPlayer.currentTime % 60);
        currentTimeDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
      };
      
      audioPlayer.onloadedmetadata = function() {
        const totalMinutes = Math.floor(audioPlayer.duration / 60);
        const totalSeconds = Math.floor(audioPlayer.duration % 60);
        totalTimeDisplay.textContent = `${totalMinutes}:${totalSeconds.toString().padStart(2, '0')}`;
      };
      
      audioPlayer.onended = function() {
        playButton.innerHTML = '<i class="fas fa-play"></i>';
        audioProgress.style.width = '0%';
        currentTimeDisplay.textContent = '0:00';
      };
      
      audioPlayer.onpause = function() {
        if (audioPlayer.currentTime < audioPlayer.duration) {
          playButton.innerHTML = '<i class="fas fa-play"></i>';
        }
      };
    }

    function updatePlayCount() {
      const playCountDisplay = document.getElementById('playCount');
      if (playCountDisplay) {
        playCountDisplay.textContent = `Plays remaining: ${maxPlays - playCount}/${maxPlays}`;
      }
    }

    function selectRandomQuestions(questions, count) {
      const shuffled = [...questions].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, count);
    }

    function displayQuestions(questions, pageNumber) {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';
      
      questions.forEach((question, index) => {
        const questionElement = document.createElement('div');
        questionElement.className = 'card question-card rounded-xl mb-4';
        questionElement.innerHTML = `
          <div class="inner-card">
            <p class="font-semibold mb-3">Question ${index + 1}</p>
            <p class="mb-4">${question.text}</p>
            <form id="question-${question.id}">
              ${question.options.map((option, i) => `
                <label class="block mb-2 cursor-pointer">
                  <input type="radio" name="question-${question.id}" value="${i}" class="mr-2">
                  ${option}
                </label>
              `).join('')}
            </form>
          </div>
        `;
        container.appendChild(questionElement);
      });
      
      const progressIndicator = document.createElement('div');
      progressIndicator.className = 'progress-indicator';
      progressIndicator.id = 'progressIndicator';
      progressIndicator.textContent = `Page ${pageNumber}/5 - ${questions.length} questions`;
      document.body.appendChild(progressIndicator);
    }

    function initValidation() {
      const forms = document.querySelectorAll('form');
      forms.forEach(form => {
        const inputs = form.querySelectorAll('input[type="radio"]');
        inputs.forEach(input => {
          input.addEventListener('change', () => {
            const pageNumber = getPageNumber();
            const selectedQuestions = JSON.parse(localStorage.getItem(`ielts_b1_listening_${pageNumber}_questions`) || '[]');
            const questionId = form.id.replace('question-', '');
            
            if (selectedQuestions.includes(parseInt(questionId))) {
              const selectedOption = form.querySelector('input[type="radio"]:checked');
              if (selectedOption) {
                localStorage.setItem(`ielts_b1_listening_${pageNumber}_answer_${questionId}`, selectedOption.value);
                updateProgressIndicator();
              }
            }
          });
        });
      });
      updateProgressIndicator();
    }

    function updateProgressIndicator() {
      const pageNumber = getPageNumber();
      const selectedQuestions = JSON.parse(localStorage.getItem(`ielts_b1_listening_${pageNumber}_questions`) || '[]');
      let answeredCount = 0;
      
      selectedQuestions.forEach(questionId => {
        if (localStorage.getItem(`ielts_b1_listening_${pageNumber}_answer_${questionId}`) !== null) {
          answeredCount++;
        }
      });
      
      const progressIndicator = document.getElementById('progressIndicator');
      if (progressIndicator) {
        progressIndicator.textContent = `Page ${pageNumber}/5 - ${answeredCount}/${selectedQuestions.length} answered`;
        if (answeredCount === selectedQuestions.length) {
          progressIndicator.classList.add('complete');
        } else {
          progressIndicator.classList.remove('complete');
        }
      }
    }

    function initializeCountdown() {
      const progressBar = document.getElementById('progressBar');
      const timeDisplay = document.getElementById('timeDisplay');
      let totalSeconds = 40 * 60; // 40 minutes
      
      const interval = setInterval(() => {
        totalSeconds--;
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        
        progressBar.value = totalSeconds;
        timeDisplay.textContent = `${minutes}Menit ${seconds}Detik`;
        
        if (totalSeconds <= 0) {
          clearInterval(interval);
          alert('Waktu habis! Test akan dikirim otomatis.');
          submitTest();
        }
      }, 1000);
    }

    function initializeTabSwitchDetection() {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          alert('Warning: Switching tabs during the test is not allowed!');
        }
      });
    }

    function initializeProtection() {
      // Prevent right-click
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      
      // Prevent keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
        }
        
        // Prevent F12, Ctrl+Shift+I, etc.
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
          e.preventDefault();
        }
      });
    }

    function submitTest() {
      alert('Test submitted!');
      // Logic to submit test results
    }
    // Add score calculation before navigation
    document.getElementById('nextBtn').addEventListener('click', function(e) {
      const pageNumber = getPageNumber();
      const selectedQuestions = JSON.parse(localStorage.getItem(`ielts_b1_listening_${pageNumber}_questions`) || '[]');
      
      let correct = 0;
      let total = selectedQuestions.length;
      
      selectedQuestions.forEach(questionId => {
        const answer = localStorage.getItem(`ielts_b1_listening_${pageNumber}_answer_${questionId}`);
        
        // Find the question in listeningData
        let question = null;
        for (const listening of listeningData) {
          question = listening.questions.find(q => q.id === questionId);
          if (question) break;
        }
        
        if (answer !== null && question && parseInt(answer) === question.correct) {
          correct++;
        }
      });
      
      // Save score with standardized key
      const storageKey = `ielts_b1_listening_${pageNumber}_score`;
      localStorage.setItem(storageKey, JSON.stringify({ correct, total }));
      
      console.log(`Saved ${storageKey}:`, { correct, total });
    });
  </script>
</body>
