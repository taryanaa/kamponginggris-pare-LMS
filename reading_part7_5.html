     // Global variables for validation
    let questionCount = 0;
    let answeredCount = 0;

    // Initialize the test when page loads
    document.addEventListener('DOMContentLoaded', function() {
      initializeTest();
      initValidation();
      
      // Initialize countdown timer
      startCountdown(75 * 60); // 75 minutes in seconds
      
      // Initialize anti-cheat protection
      initializeAntiCheat();
    });

    function initializeTest() {
      // Check if we already have a selected reading in localStorage
      const storageKey = 'toeic_reading_part7_4_selected';
      const storedReading = localStorage.getItem(storageKey);
      
      let selectedReading;
      if (storedReading) {
        // Use the stored reading
        selectedReading = readingData.find(reading => reading.id === parseInt(storedReading));
        // If stored reading not found, select random
        if (!selectedReading) {
          const randomIndex = Math.floor(Math.random() * readingData.length);
          selectedReading = readingData[randomIndex];
          localStorage.setItem(storageKey, selectedReading.id.toString());
        }
      } else {
        // Select a random reading and store it
        const randomIndex = Math.floor(Math.random() * readingData.length);
        selectedReading = readingData[randomIndex];
        localStorage.setItem(storageKey, selectedReading.id.toString());
      }
      
      // Display the selected reading
      displayReading(selectedReading);
      
      // Display all questions from the selected reading
      displayQuestions(selectedReading.questions);
      
      // Store the selected reading for scoring
      window.currentReading = selectedReading;
    }

    function displayReading(reading) {
      const mainCard = document.getElementById('mainCard');
      
      // Clear existing content
      mainCard.innerHTML = '';
      
      // Create and append the selected reading
      const readingElement = document.createElement('div');
      readingElement.className = 'reading-selection';
      readingElement.innerHTML = `
        <p class="font-bold text-center mb-1">
          TOEIC Reading Comprehension - Part 7 (4/5)
        </p>
        <p class="text-center mb-3">
          Read the passage below and answer questions.
        </p>
        <p class="reading-title">${reading.title}</p>
        <div class="reading-content inner-card">
          ${reading.content}
        </div>
      `;
      
      mainCard.appendChild(readingElement);
    }

    function displayQuestions(questions) {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';
      
      questions.forEach((question, index) => {
        const questionElement = document.createElement('section');
        questionElement.className = 'card rounded-xl mt-6 question-card';
        questionElement.setAttribute('aria-label', `Question ${index + 1}`);
        questionElement.setAttribute('role', 'region');
        questionElement.setAttribute('aria-labelledby', `q${index + 1}-label`);
        
        let optionsHTML = '';
        question.options.forEach((option, optionIndex) => {
          optionsHTML += `
            <label>
              <input class="mr-1" name="q${question.id}" type="radio" value="${option}" ${optionIndex === question.correct ? 'data-correct="true"' : ''} />
              ${option}
            </label>
          `;
        });
        
        questionElement.innerHTML = `
          <p id="q${index + 1}-label" class="mb-2 text-sm font-semibold">
            ${index + 1}. ${question.text}
          </p>
          <form>
            ${optionsHTML}
          </form>
        `;
        
        container.appendChild(questionElement);
      });
    }

    // Validation functions
    function initValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) names.add(radio.name);
        }
      });

      questionCount = names.size;

      if (questionCount === 0) return;

      radios.forEach(radio => {
        radio.addEventListener('change', updateValidation);
      });

      addProgressIndicator();
      updateValidation();
    }

    function updateValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();
      const answered = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) {
            names.add(radio.name);
            if (radio.checked) answered.add(radio.name);
          }
        }
      });

      answeredCount = answered.size;
      updateProgressIndicator();
      
      // Save answers to localStorage for results page
      saveAnswersToLocalStorage();

      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) {
        if (answeredCount === questionCount) {
          nextBtn.style.opacity = '1';
          nextBtn.style.pointerEvents = 'auto';
          nextBtn.removeAttribute('data-disabled');
        } else {
          nextBtn.style.opacity = '0.6';
          nextBtn.style.pointerEvents = 'none';
          nextBtn.setAttribute('data-disabled', 'true');
        }
      }
    }
    
    // Save answers to localStorage for results calculation
    function saveAnswersToLocalStorage() {
      if (!window.currentReading) return;
      
      const radios = document.querySelectorAll('input[type="radio"]:checked');
      let correctCount = 0;
      
      radios.forEach(radio => {
        if (radio.getAttribute('data-correct') === 'true') {
          correctCount++;
        }
      });
      
      const resultData = {
        correct: correctCount,
        total: questionCount,
        timestamp: new Date().toISOString()
      };
      
      // Save with the key format expected by results page
      localStorage.setItem('reading_part7_5_answers', JSON.stringify(resultData));
      console.log('Saved reading_part7_5 answers:', resultData);
    }


    function addProgressIndicator() {
      if (document.querySelector('.progress-indicator')) return;

      const progress = document.createElement('div');
      progress.className = 'progress-indicator';
      progress.style.cssText = `
        position: fixed; bottom: 80px; left: 20px; background: white; padding: 8px 12px;
        border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); font-size: 12px; z-index: 1000;
        border-left: 3px solid #f59e0b;
      `;
      progress.innerHTML = `<span id="progress-text">Progress: 0/${questionCount}</span>`;
      document.body.appendChild(progress);
    }

    function updateProgressIndicator() {
      const text = document.getElementById('progress-text');
      if (text) {
        text.textContent = `Progress: ${answeredCount}/${questionCount}`;
        const indicator = document.querySelector('.progress-indicator');
        if (answeredCount === questionCount) {
          indicator.style.borderLeftColor = '#10b981';
          text.textContent += ' ✓';
        } else {
          indicator.style.borderLeftColor = '#f59e0b';
        }
      }
    }

    // Countdown timer function
    function startCountdown(seconds) {
      const progressBar = document.getElementById('progressBar');
      const timeDisplay = document.getElementById('timeDisplay');
      const totalSeconds = seconds;
      
      const timer = setInterval(() => {
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const remainingSeconds = seconds % 60;
        
        timeDisplay.textContent = `${hours}Jam ${minutes}Menit ${remainingSeconds}Detik`;
        
        // Update progress bar
        const progress = ((totalSeconds - seconds) / totalSeconds) * 5400;
        progressBar.value = progress;
        
        if (seconds <= 0) {
          clearInterval(timer);
          alert('Waktu habis! Test akan otomatis submit.');
          // Auto-submit or redirect to next page
        }
        
        seconds--;
      }, 1000);
    }

    // Anti-cheat functions
    function initializeAntiCheat() {
      // Disable right-click context menu
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });

      // Disable common keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        // Disable F12, Ctrl+Shift+I, Ctrl+U, etc.
        if (e.key === 'F12' || 
            (e.ctrlKey && e.shiftKey && e.key === 'I') ||
            (e.ctrlKey && e.key === 'u') ||
            (e.ctrlKey && e.key === 's') ||
            (e.ctrlKey && e.key === 'p') ||
            e.key === 'PrintScreen') {
          e.preventDefault();
        }
      });
    }

    // Prevent navigation if incomplete
    document.addEventListener('click', (e) => {
      const target = e.target.closest('#nextBtn[data-disabled="true"]');
      if (target) {
        e.preventDefault();
        alert(`Please answer all questions before proceeding!
Remaining: ${questionCount - answeredCount} questions.`);
      }
    });
  </script>
