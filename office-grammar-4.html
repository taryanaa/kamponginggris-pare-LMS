    document.addEventListener('DOMContentLoaded', () => {
      // Initialize the test
      initializeTest();
      
      // Initialize validation
      setTimeout(initValidation, 100);
      
      // Initialize countdown timer
      initializeCountdown();
      
      // Initialize tab switch detection
      initializeTabSwitchDetection();
    });

    function initializeTest() {
      // Check if we already have a selected grammar in localStorage
      const storedGrammar = localStorage.getItem('office_grammar_page4_selected');
      
      let selectedGrammar;
      if (storedGrammar) {
        // Use the stored grammar
        selectedGrammar = grammarData.find(grammar => grammar.id === parseInt(storedGrammar));
      } else {
        // Select a random grammar and store it
        const randomGrammarIndex = Math.floor(Math.random() * grammarData.length);
        selectedGrammar = grammarData[randomGrammarIndex];
        localStorage.setItem('office_grammar_page4_selected', selectedGrammar.id.toString());
      }
      
      // Display the selected grammar
      displayGrammar(selectedGrammar);
      
      // Select 5 random questions FROM THE SELECTED GRAMMAR ONLY
      const selectedQuestions = selectRandomQuestions(selectedGrammar.questions, 5);
      
      // Display the selected questions
      displayQuestions(selectedQuestions);
      
      // Store selected questions in localStorage for consistency
      localStorage.setItem('office_grammar_page4_questions', JSON.stringify(selectedQuestions.map(q => q.id)));
    }

    function displayGrammar(grammar) {
      const mainCard = document.getElementById('mainCard');
      
      // Clear existing content
      mainCard.innerHTML = '';
      
      // Create and append the selected grammar
      const grammarElement = document.createElement('div');
      grammarElement.className = 'grammar-selection';
      grammarElement.innerHTML = `
        <p class="font-bold text-center mb-1">
          Grammar Exercise - Layout of an Office (B1)
        </p>
        <p class="text-center mb-3">
          Read the description below and answer questions 1-5.
        </p>
        <p class="grammar-title">${grammar.title}</p>
        <div class="grammar-content inner-card">
          ${grammar.content}
        </div>
      `;
      
      mainCard.appendChild(grammarElement);
    }

    function selectRandomQuestions(questions, count) {
      // If we have fewer questions than requested, return all
      if (questions.length <= count) {
        return [...questions];
      }
      
      // Shuffle array using Fisher-Yates algorithm
      const shuffled = [...questions];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      // Return the first 'count' questions
      return shuffled.slice(0, count);
    }

    function displayQuestions(questions) {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';
      
      questions.forEach((question, index) => {
        const questionElement = document.createElement('section');
        questionElement.className = 'card rounded-xl mt-6 question-card';
        questionElement.setAttribute('aria-label', `Question ${index + 1}`);
        questionElement.setAttribute('role', 'region');
        questionElement.setAttribute('aria-labelledby', `q${index + 1}-label`);
        
        let optionsHTML = '';
        question.options.forEach((option, optionIndex) => {
          optionsHTML += `
            <label>
              <input class="mr-1" name="q${question.id}" type="radio" value="${option}" ${optionIndex === question.correct ? 'data-correct="true"' : ''} />
              ${option}
            </label>
          `;
        });
        
        questionElement.innerHTML = `
          <p id="q${index + 1}-label" class="mb-2 text-[10px] font-semibold">
            ${index + 1}. ${question.text}
          </p>
          <form>
            ${optionsHTML}
          </form>
        `;
        
        container.appendChild(questionElement);
      });
    }

    // Rest of the JavaScript functions (validation, countdown, etc.)
    function initValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) names.add(radio.name);
        }
      });

      questionCount = names.size;

      if (questionCount === 0) return;

      radios.forEach(radio => {
        radio.addEventListener('change', updateValidation);
      });

      addProgressIndicator();
      updateValidation();
    }

    function updateValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();
      const answered = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) {
            names.add(radio.name);
            if (radio.checked) answered.add(radio.name);
          }
        }
      });

      answeredCount = answered.size;
      updateProgressIndicator();

      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) {
        if (answeredCount === questionCount) {
          nextBtn.style.opacity = '1';
          nextBtn.style.pointerEvents = 'auto';
          nextBtn.removeAttribute('data-disabled');
        } else {
          nextBtn.style.opacity = '0.6';
          nextBtn.style.pointerEvents = 'none';
          nextBtn.setAttribute('data-disabled', 'true');
        }
      }
    }

    function addProgressIndicator() {
      if (document.querySelector('.progress-indicator')) return;

      const progress = document.createElement('div');
      progress.className = 'progress-indicator';
      progress.style.cssText = `
        position: fixed; bottom: 80px; left: 20px; background: white; padding: 8px 12px;
        border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); font-size: 12px; z-index: 1000;
        border-left: 3px solid #f59e0b;
      `;
      progress.innerHTML = `<span id="progress-text">Progress: 0/${questionCount}</span>`;
      document.body.appendChild(progress);
    }

    function updateProgressIndicator() {
      const text = document.getElementById('progress-text');
      if (text) {
        text.textContent = `Progress: ${answeredCount}/${questionCount}`;
        const indicator = document.querySelector('.progress-indicator');
        if (answeredCount === questionCount) {
          indicator.style.borderLeftColor = '#10b981';
          text.textContent += ' ✓';
        } else {
          indicator.style.borderLeftColor = '#f59e0b';
        }
      }
    }

    // Prevent navigation if incomplete
    document.addEventListener('click', (e) => {
      const target = e.target.closest('#nextBtn[data-disabled="true"]');
      if (target) {
        e.preventDefault();
        alert(`Mohon jawab semua soal terlebih dahulu!
Sisa ${questionCount - answeredCount} soal.`);
      }
    });

    function initializeCountdown() {
      const totalSeconds = 90 * 60;
      const progressBar = document.getElementById("progressBar");
      const timeDisplay = document.getElementById("timeDisplay");

      let remainingSeconds;
      const savedTime = localStorage.getItem('testRemainingTime');
      const savedTimestamp = localStorage.getItem('testTimestamp');

      if (savedTime && savedTimestamp) {
        const currentTime = Date.now();
        const elapsedSeconds = Math.floor((currentTime - parseInt(savedTimestamp)) / 1000);
        remainingSeconds = Math.max(0, parseInt(savedTime) - elapsedSeconds);
      } else {
        remainingSeconds = totalSeconds;
        localStorage.setItem('testRemainingTime', remainingSeconds.toString());
        localStorage.setItem('testTimestamp', Date.now().toString());
      }

      function updateCountdown() {
        if (remainingSeconds < 0) {
          remainingSeconds = 0;
          clearInterval(timerInterval);
          localStorage.removeItem('testRemainingTime');
          localStorage.removeItem('testTimestamp');
        }

        if (progressBar) {
          progressBar.value = remainingSeconds;
          progressBar.setAttribute("aria-valuenow", remainingSeconds);
        }

        if (timeDisplay) {
          const hours = Math.floor(remainingSeconds / 3600);
          const minutes = Math.floor((remainingSeconds % 3600) / 60);
          const seconds = remainingSeconds % 60;
          const displayText = `${hours}Jam ${minutes}Menit ${seconds}Detik`;
          timeDisplay.textContent = displayText;
        }

        localStorage.setItem('testRemainingTime', remainingSeconds.toString());
        localStorage.setItem('testTimestamp', Date.now().toString());

        remainingSeconds--;
      }

      if (progressBar && timeDisplay) {
        updateCountdown();
        const timerInterval = setInterval(updateCountdown, 1000);
      }
    }

    function initializeTabSwitchDetection() {
      let isTabSwitchModalShown = false;

      const modalHTML = `
        <div id="tabSwitchModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); z-index: 9999; justify-content: center; align-items: center;">
          <div style="background: white; padding: 2rem; border-radius: 1rem; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);">
            <div style="color: #dc2626; font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
            <h2 style="color: #1e293b; margin-bottom: 1rem; font-size: 1.25rem; font-weight: 700;">Peringatan!</h2>
            <p style="color: #64748b; margin-bottom: 1.5rem; line-height: 1.5;">Anda terdeteksi membuka tab lain. Harap fokus pada halaman tes untuk melanjutkan.</p>
            <button id="closeTabModal" style="background-color: #3b82f6; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer;">
              Kembali ke Tes
            </button>
          </div>
        </div>
      `;

      document.body.insertAdjacentHTML('beforeend', modalHTML);

      const modal = document.getElementById('tabSwitchModal');
      const closeBtn = document.getElementById('closeTabModal');

      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          modal.style.display = 'none';
          isTabSwitchModalShown = false;
        });
      }

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && !isTabSwitchModalShown) {
          setTimeout(() => {
            if (document.hidden && !isTabSwitchModalShown) {
              modal.style.display = 'flex';
              isTabSwitchModalShown = true;
            }
          }, 1000);
        }
      });
    }

    // Global variables for validation
    let questionCount = 0;
    let answeredCount = 0;
  </script>

  <script>
    // Page Protection Script for Practical English Test
    (function() {
      // Check if this is a Practical English test page
      const currentPage = window.location.pathname.split('/').pop();
      
      // Define the correct test sequence for Practical English
      const testSequence = [
        'page3.html',
        'page4-reading.html',
        'page5-reading.html',
        'page6-reading.html',
        'page7-reading.html',
        'page8-reading.html',
        'page4-listening.html',
        'page5-listening.html',
        'page6-listening.html',
        'page7-listening.html',
        'page8-listening.html',
        'office-grammar-2.html',
        'office-grammar-3.html',
        'office-grammar-4.html',
        'office-grammar-5.html',
        'office-grammar-6.html',
        'station-speaking-reading-1.html',
        'station-speaking-reading-2.html',
        'station-speaking-reading-3.html',
        'station-speaking-reading-4.html',
        'station-speaking-reading-5.html',
        'practical-english-results.html'
      ];
      
      // Check if user has started the test
      const testStarted = localStorage.getItem('practical_test_started');
      const selectedProgram = localStorage.getItem('selectedProgram');
      
      // Only apply protection if this is a Practical English test page
      if (testSequence.includes(currentPage)) {
        // Check if user came from page2 with Practical English selected
        if (!testStarted || selectedProgram !== 'practical-english') {
          alert('Anda harus memulai tes dari halaman pendaftaran!');
          window.location.href = 'page2.html';
          return;
        }
        
        // Check if user is accessing pages in correct sequence
        const currentPageIndex = testSequence.indexOf(currentPage);
        const allowedPage = localStorage.getItem('practical_current_page');
        const allowedPageIndex = testSequence.indexOf(allowedPage);
        
        // Allow access only to current page or previous pages
        if (currentPageIndex > allowedPageIndex) {
          alert('Anda harus mengerjakan soal secara berurutan!');
          window.location.href = allowedPage;
          return;
        }
      }
      
      // Update current page when navigating forward
      window.addEventListener('beforeunload', function() {
        const nextPageIndex = testSequence.indexOf(currentPage) + 1;
        if (nextPageIndex < testSequence.length) {
          localStorage.setItem('practical_current_page', testSequence[nextPageIndex]);
        }
      });
    })();
  </script>

  <script>
    // Answer Tracking for office-grammar-4.html
    (function() {
      // Initialize answer tracking
      let answers = {};
      let correctAnswers = 0;
      let totalQuestions = 0;
      
      // Function to save answers to localStorage
      function saveAnswers() {
        const answerData = {
          answers: answers,
          correct: correctAnswers,
          total: totalQuestions,
          timestamp: new Date().toISOString()
        };
        localStorage.setItem('practical_grammar_page4_answers', JSON.stringify(answerData));
        console.log('Saved answers for office-grammar-4.html:', answerData);
      }
      
      // Track all radio button changes
      document.addEventListener('DOMContentLoaded', function() {
        const radioButtons = document.querySelectorAll('input[type="radio"]');
        totalQuestions = new Set(Array.from(radioButtons).map(r => r.name)).size;
        
        radioButtons.forEach(radio => {
          radio.addEventListener('change', function() {
            const questionName = this.name;
            const selectedValue = this.value;
            const correctValue = this.getAttribute('data-correct') || this.closest('label').getAttribute('data-correct');
            
            // Check if answer is correct
            const isCorrect = (selectedValue === correctValue) || 
                            (this.hasAttribute('data-correct') && this.getAttribute('data-correct') === 'true') ||
                            (this.closest('label').hasAttribute('data-correct') && this.closest('label').getAttribute('data-correct') === selectedValue);
            
            // Update answers object
            if (answers[questionName]) {
              // Remove previous answer from correct count
              if (answers[questionName].correct) {
                correctAnswers--;
              }
            }
            
            answers[questionName] = {
              selected: selectedValue,
              correct: isCorrect,
              timestamp: new Date().toISOString()
            };
            
            if (isCorrect) {
              correctAnswers++;
            }
            
            // Save to localStorage
            saveAnswers();
          });
        });
        
        // Load previous answers if any
        const savedData = localStorage.getItem('practical_grammar_page4_answers');
        if (savedData) {
          try {
            const data = JSON.parse(savedData);
            answers = data.answers || {};
            correctAnswers = data.correct || 0;
            totalQuestions = data.total || totalQuestions;
            
            // Restore radio button selections
            Object.keys(answers).forEach(questionName => {
              const radio = document.querySelector(`input[name="${questionName}"][value="${answers[questionName].selected}"]`);
              if (radio) {
                radio.checked = true;
              }
            });
          } catch (e) {
            console.error('Error loading saved answers:', e);
          }
        }
      });
    })();
  </script>
