  <script>

        text: `Neuroscience is the scientific study of the nervous system, particularly the brain and its role in behavior and cognitive functions. The human brain contains approximately 86 billion neurons that communicate through complex networks, forming the biological basis for thought, emotion, memory, and consciousness.

The brain can be divided into several major regions with specialized functions. The cerebral cortex, divided into four lobes (frontal, parietal, temporal, occipital), handles higher cognitive functions, sensory processing, and voluntary movement. Subcortical structures like the hippocampus are crucial for memory formation, while the amygdala processes emotions, and the basal ganglia coordinate movement.

Neuroplasticity refers to the brain's ability to reorganize itself by forming new neural connections throughout life. This capacity enables learning, memory formation, and recovery from brain injury. Experience-dependent plasticity allows the brain to adapt based on environmental inputs and learning experiences.

Advancements in neuroimaging techniques such as fMRI and PET scans have revolutionized neuroscience by enabling non-invasive observation of brain structure and function. These technologies have improved understanding of neurological disorders, leading to better treatments for conditions like Alzheimer's disease, Parkinson's disease, and epilepsy.`,

      {
        id: 2,
        title: "Sustainable Agriculture and Food Systems",
        text: `Sustainable agriculture aims to meet society's food and textile needs in the present without compromising the ability of future generations to meet their own needs. This approach integrates three main goals: environmental health, economic profitability, and social and economic equity.

Practices associated with sustainable agriculture include crop rotation and diversification, which improve soil health and reduce pest problems; conservation tillage that minimizes soil erosion; integrated pest management that reduces chemical pesticide use; and efficient water management through drip irrigation and rainwater harvesting.

Agroecology applies ecological principles to agricultural systems, emphasizing biodiversity, nutrient cycling, and natural pest regulation. Organic farming avoids synthetic fertilizers and pesticides, relying instead on compost, green manure, and biological pest control. These approaches can enhance farm resilience to climate change and market fluctuations.

Local food systems and reduced food waste are also important components of sustainable food systems. Consumers can support sustainability through choices like purchasing seasonal produce, reducing meat consumption, and minimizing food waste. Policy measures including subsidies for sustainable practices and research into agroecological methods further support the transition toward sustainable agriculture.`,
        questions: [

          {

            options: [

            ],
            correct: 0

          {

      },
      {
        id: 3,
        title: "Literary Movements and Cultural Expression",
        text: `Literary movements represent collective shifts in literary style, subject matter, and philosophical approach during specific historical periods. Romanticism, emerging in the late 18th century, emphasized emotion, imagination, and nature as alternatives to Enlightenment rationalism. Writers like Wordsworth and Coleridge celebrated individual experience and the sublime in nature.

Realism developed in the mid-19th century as a reaction against Romantic idealism, focusing on detailed depictions of everyday life and ordinary people. Authors such as Balzac and Flaubert sought to represent society objectively, often addressing social issues and the influence of environment on character.

Modernism, arising in the late 19th and early 20th centuries, responded to industrialization, urbanization, and the disillusionment following World War I. This movement experimented with narrative structure, perspective, and language, as seen in works by Joyce, Woolf, and Eliot that explored subjective consciousness and fragmented experience.

Postmodernism, emerging after World War II, questioned grand narratives and absolute truths, embracing irony, parody, and self-reference. Postcolonial literature addressed the legacy of colonialism, while magical realism blended realistic narrative with fantastic elements. Understanding these movements provides insight into how literature reflects and responds to cultural and historical contexts.`,
        questions: [
          {

      },
      {
        id: 4,
        title: "Quantum Mechanics and Modern Physics",
        text: `Quantum mechanics is the fundamental theory in physics that describes nature at the smallest scales of energy levels of atoms and subatomic particles. It represents a radical departure from classical physics, introducing concepts like wave-particle duality, quantization of energy, and the uncertainty principle.

Key principles include superposition, where quantum systems can exist in multiple states simultaneously until measured, and entanglement, where particles remain connected so that actions performed on one affect the other, even when separated by large distances. These phenomena have no classical analogues and challenge intuitive understanding.

Quantum mechanics has enabled numerous technological applications, including transistors that form the basis of modern electronics, lasers used in communications and medicine, and magnetic resonance imaging (MRI) for medical diagnosis. Quantum computing, which leverages quantum principles to perform certain calculations exponentially faster than classical computers, represents an emerging frontier.

Interpretations of quantum mechanics, such as the Copenhagen interpretation and many-worlds interpretation, attempt to explain the theory's philosophical implications. Despite its counterintuitive nature, quantum mechanics has withstood extensive experimental verification and remains one of the most successful theories in physics.`,
        questions: [
          {
            id: 16,
            text: "What does quantum mechanics describe?",

          {

          {

            ],
            correct: 0
          },
          {
            id: 19,
            text: "What does quantum computing leverage?",
            options: [
              "Quantum principles for faster calculations",
              "Classical physics only",
              "Biological processes",
              "Chemical reactions exclusively"
            ],
            correct: 0
          },
          {
            id: 20,
            text: "How has quantum mechanics withstood scientific scrutiny?",
            options: [
              "Through extensive experimental verification",
              "Through philosophical agreement only",
              "Without any experimental evidence",
              "Through political support"
            ],
            correct: 0
          }
        ]
      }
    ];

    // Same JavaScript functions as previous pages
    document.addEventListener('DOMContentLoaded', () => {
      initializeTest();
      setTimeout(initValidation, 100);
      initializeCountdown();
      initializeTabSwitchDetection();
      initializeProtection();
    });

    function initializeTest() {
      const storedReading = localStorage.getItem('toefl_reading_5_selected');
      
      let selectedReading;
      if (storedReading) {
        selectedReading = readingData.find(reading => reading.id === parseInt(storedReading));
      } else {
        const randomReadingIndex = Math.floor(Math.random() * readingData.length);
        selectedReading = readingData[randomReadingIndex];
        localStorage.setItem('toefl_reading_5_selected', selectedReading.id.toString());
      }
      
      displayReading(selectedReading);
      const selectedQuestions = selectRandomQuestions(selectedReading.questions, 5);
      displayQuestions(selectedQuestions);
      localStorage.setItem('toefl_reading_5_questions', JSON.stringify(selectedQuestions.map(q => q.id)));
    }

    function displayReading(reading) {
      const mainCard = document.getElementById('mainCard');
      mainCard.innerHTML = '';
      
      const readingElement = document.createElement('div');
      readingElement.className = 'reading-selection';
      readingElement.innerHTML = `
        <div class="inner-card">
          <p class="font-bold text-center mb-1">
            TOEFL Reading - Academic Topics
          </p>
          <p class="text-center mb-3">
            Read the text and answer questions 1-5.
          </p>
          <p class="reading-title">${reading.title}</p>
          
          <div class="reading-text">
            ${reading.text}
          </div>
        </div>
      `;
      
      mainCard.appendChild(readingElement);
    }

    function selectRandomQuestions(questions, count) {
      if (questions.length <= count) {
        return [...questions];
      }
      
      const shuffled = [...questions];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      return shuffled.slice(0, count);
    }

    function displayQuestions(questions) {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';
      
      questions.forEach((question, index) => {
        const questionElement = document.createElement('section');
        questionElement.className = 'card rounded-xl mt-6 question-card';
        questionElement.setAttribute('aria-label', `Question ${index + 1}`);
        
        let optionsHTML = '';
        question.options.forEach((option, optionIndex) => {
          optionsHTML += `
            <label>
              <input class="mr-1" name="q${question.id}" type="radio" value="${option}" ${optionIndex === question.correct ? 'data-correct="true"' : ''} />
              ${option}
            </label>
          `;
        });
        
        questionElement.innerHTML = `
          <p class="mb-2 text-[10px] font-semibold">
            ${index + 1}. ${question.text}
          </p>
          <form>
            ${optionsHTML}
          </form>
        `;
        
        container.appendChild(questionElement);
      });
    }

    let questionCount = 0;
    let answeredCount = 0;

    function initValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) names.add(radio.name);
        }
      });

      questionCount = names.size;
      if (questionCount === 0) return;

      radios.forEach(radio => {
        radio.addEventListener('change', updateValidation);
      });

      addProgressIndicator();
      updateValidation();
    }

    function updateValidation() {
      const radios = document.querySelectorAll('input[type="radio"]');
      const names = new Set();
      const answered = new Set();

      radios.forEach(radio => {
        const section = radio.closest('section');
        if (section && getComputedStyle(section).display !== 'none') {
          if (radio.name) {
            names.add(radio.name);
            if (radio.checked) answered.add(radio.name);
          }
        }
      });

      answeredCount = answered.size;
      updateProgressIndicator();

      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) {
        if (answeredCount === questionCount) {
          nextBtn.style.opacity = '1';
          nextBtn.style.pointerEvents = 'auto';
          nextBtn.removeAttribute('data-disabled');
        } else {
          nextBtn.style.opacity = '0.6';
          nextBtn.style.pointerEvents = 'none';
          nextBtn.setAttribute('data-disabled', 'true');
        }
      }
    }

    function addProgressIndicator() {
      if (document.querySelector('.progress-indicator')) return;

      const progress = document.createElement('div');
      progress.className = 'progress-indicator';
      progress.innerHTML = `<span id="progress-text">Progress: 0/${questionCount}</span>`;
      document.body.appendChild(progress);
    }

    function updateProgressIndicator() {
      const text = document.getElementById('progress-text');
      if (text) {
        text.textContent = `Progress: ${answeredCount}/${questionCount}`;
        const indicator = document.querySelector('.progress-indicator');
        if (answeredCount === questionCount) {
          indicator.style.borderLeftColor = '#10b981';
          text.textContent += ' ✓';
        }
      }
    }

    document.addEventListener('click', (e) => {
      const target = e.target.closest('#nextBtn[data-disabled="true"]');
      if (target) {
        e.preventDefault();
        alert(`Please answer all questions before proceeding!\nRemaining: ${questionCount - answeredCount} questions.`);
      }
    });

    function initializeCountdown() {
      const totalSeconds = 60 * 60;
      const progressBar = document.getElementById("progressBar");
      const timeDisplay = document.getElementById("timeDisplay");

      let remainingSeconds = totalSeconds;

      function updateCountdown() {
        if (remainingSeconds < 0) {
          remainingSeconds = 0;
          alert('Time is up! Test will end.');
          return;
        }

        if (progressBar) {
          progressBar.value = remainingSeconds;
        }

        if (timeDisplay) {
          const hours = Math.floor(remainingSeconds / 3600);
          const minutes = Math.floor((remainingSeconds % 3600) / 60);
          const seconds = remainingSeconds % 60;
          timeDisplay.textContent = `${hours}Jam ${minutes}Menit ${seconds}Detik`;
        }

        remainingSeconds--;
      }

      if (progressBar && timeDisplay) {
        updateCountdown();
        setInterval(updateCountdown, 1000);
      }
    }

    function initializeTabSwitchDetection() {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          setTimeout(() => {
            if (document.hidden) {
              alert('Warning: Please focus on the test page.');
            }
          }, 1000);
        }
      });
    }

    function initializeProtection() {
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) {
          e.preventDefault();
        }
      });
    }
  
    document.getElementById('nextBtn').addEventListener('click', function(e) {
      if (answeredCount === questionCount) {
        const radios = document.querySelectorAll('input[type="radio"]:checked');
        let correct = 0;
        let total = 0;
        
        radios.forEach(radio => {
          total++;
          if (radio.hasAttribute('data-correct')) {
            correct++;
          }
        });
        
        const storageKey = 'toefl_reading_5_score';
        localStorage.setItem(storageKey, JSON.stringify({ correct, total }));
        
        console.log(`Saved ${storageKey}:`, { correct, total });
        
        // Calculate total score across all pages
        calculateTotalScore();
      }
    });

    function calculateTotalScore() {
      let totalCorrect = 0;
      let totalQuestions = 0;
      
      for (let i = 1; i <= 5; i++) {
        const scoreData = localStorage.getItem(`toefl_reading_${i}_score`);
        if (scoreData) {
          const { correct, total } = JSON.parse(scoreData);
          totalCorrect += correct;
          totalQuestions += total;
        }
      }
      
      localStorage.setItem('toefl_reading_total_score', JSON.stringify({
        totalCorrect,
        totalQuestions,
        percentage: ((totalCorrect / totalQuestions) * 100).toFixed(1)
      }));
    }
  </script>
</body>
</html>
