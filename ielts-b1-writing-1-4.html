  <script>
    // Writing prompts database - 20 prompts for B1 Writing
    const writingPrompts = [
      {
        type: "Task 1",
        prompt: "The maps below show the development of an island before and after the construction of tourist facilities. Summarize the information by selecting and reporting the main features, and make comparisons where relevant.",
        keywords: ["maps", "development", "island", "before", "after", "construction", "tourist facilities", "summarize", "main features", "comparisons"]
      },
      {
        type: "Task 1",
        prompt: "The diagrams illustrate changes that took place in a coastal area between 1995 and 2015. Write a report for a university lecturer describing the information shown.",
        keywords: ["diagrams", "illustrate", "changes", "coastal area", "1995", "2015", "report", "university lecturer", "describing"]
      },
      {
        type: "Task 1",
        prompt: "The two maps below show an island, before and after the construction of some tourist facilities. Summarize the information by selecting and reporting the main features, and make comparisons where relevant.",
        keywords: ["maps", "island", "before", "after", "construction", "tourist facilities", "summarize", "main features", "comparisons"]
      },
      {
        type: "Task 1",
        prompt: "The maps show the changes that have taken place in a town center between 1990 and 2010. Summarize the information by selecting and reporting the main features, and make comparisons where relevant.",
        keywords: ["maps", "changes", "town center", "1990", "2010", "summarize", "main features", "comparisons"]
      },
      {
        type: "Task 1",
        prompt: "The diagrams below show the development of a small fishing village and its surrounding area into a large tourist center. Summarize the information by selecting and reporting the main features.",
        keywords: ["diagrams", "development", "fishing village", "surrounding area", "tourist center", "summarize", "main features"]
      },
      {
        type: "Task 2",
        prompt: "In many countries, the level of crime is increasing and crimes are becoming more violent. Why do you think this is happening? What can be done to solve this problem?",
        keywords: ["countries", "level of crime", "increasing", "violent", "why", "happening", "solve", "problem"]
      },
      {
        type: "Task 2",
        prompt: "Some people believe that the best way to reduce crime is to give longer prison sentences. Others, however, think there are better alternative ways to reduce crime. Discuss both views and give your opinion.",
        keywords: ["reduce crime", "longer prison sentences", "alternative ways", "discuss both views", "opinion"]
      },
      {
        type: "Task 2",
        prompt: "Crime rates tend to be higher in cities than in smaller towns or rural areas. What are the reasons for this problem, and what can be done to solve it?",
        keywords: ["crime rates", "higher", "cities", "smaller towns", "rural areas", "reasons", "problem", "solve"]
      },
      {
        type: "Task 2",
        prompt: "Many people are afraid to leave their homes because of the fear of crime. Some believe that more actions should be taken to prevent crime, while others feel that little can be done. Discuss both views and give your own opinion.",
        keywords: ["afraid", "leave homes", "fear of crime", "prevent crime", "discuss both views", "opinion"]
      },
      {
        type: "Task 2",
        prompt: "Some people think that poverty is the main cause of crime. To what extent do you agree or disagree? What other factors might contribute to crime?",
        keywords: ["poverty", "main cause", "crime", "agree", "disagree", "factors", "contribute"]
      },
      {
        type: "Task 1",
        prompt: "The maps below show the changes that have occurred in a coastal town called Seaville between 1980 and 2010. Summarize the information by selecting and reporting the main features.",
        keywords: ["maps", "changes", "coastal town", "Seaville", "1980", "2010", "summarize", "main features"]
      },
      {
        type: "Task 1",
        prompt: "The diagrams illustrate the development of a village called Ryemouth between 1995 and present. Write a report for a university lecturer describing the information shown.",
        keywords: ["diagrams", "illustrate", "development", "village", "Ryemouth", "1995", "present", "report", "describing"]
      },
      {
        type: "Task 1",
        prompt: "The two maps below show the changes that have taken place in a park from 1980 to the present day. Summarize the information by selecting and reporting the main features.",
        keywords: ["maps", "changes", "park", "1980", "present day", "summarize", "main features"]
      },
      {
        type: "Task 1",
        prompt: "The diagrams show the transformation of a rural area into an urban area between 2000 and 2020. Summarize the information by selecting and reporting the main features.",
        keywords: ["diagrams", "transformation", "rural area", "urban area", "2000", "2020", "summarize", "main features"]
      },
      {
        type: "Task 1",
        prompt: "The maps illustrate the development of a seaside resort from 1970 to 2010. Write a report for a university lecturer describing the information shown.",
        keywords: ["maps", "illustrate", "development", "seaside resort", "1970", "2010", "report", "describing"]
      },
      {
        type: "Task 2",
        prompt: "Some people believe that the death penalty is an effective way to reduce crime, while others think there are better alternatives. Discuss both views and give your opinion.",
        keywords: ["death penalty", "effective", "reduce crime", "alternatives", "discuss both views", "opinion"]
      },
      {
        type: "Task 2",
        prompt: "Many criminals reoffend after they have been punished. Why do you think this happens? How can this problem be tackled?",
        keywords: ["criminals", "reoffend", "punished", "why", "happens", "problem", "tackled"]
      },
      {
        type: "Task 2",
        prompt: "Some people think that the best way to reduce crime is to educate people in prison so they can get a job when they leave. To what extent do you agree or disagree?",
        keywords: ["reduce crime", "educate", "prison", "job", "agree", "disagree"]
      },
      {
        type: "Task 2",
        prompt: "Crime is a big problem in the world; many believe that nothing can be done to prevent it. To what extent do you agree or disagree? Give your own opinion.",
        keywords: ["crime", "big problem", "prevent", "agree", "disagree", "opinion"]
      },
      {
        type: "Task 2",
        prompt: "Some people think that the government should be responsible for crime prevention, while others believe that it is the responsibility of the individual. Discuss both views and give your opinion.",
        keywords: ["government", "responsible", "crime prevention", "individual", "discuss both views", "opinion"]
      }
    ];

    // Current selected prompts
    let selectedPrompts = [];
    let userResponses = {};
    let wordCounts = {};
    let relevanceScores = {};

    document.addEventListener('DOMContentLoaded', () => {
      initializeTest();
      initializeCountdown();
      initializeTabSwitchDetection();
      initializeProtection();
    });

    function initializeTest() {
      // Get or generate random prompts for this page
      const storedPrompts = localStorage.getItem('ielts_b1_writing_prompts_page4');
      if (storedPrompts) {
        selectedPrompts = JSON.parse(storedPrompts);
      } else {
        // Ensure we get different prompts than previous pages
        selectedPrompts = selectDifferentPrompts(5);
        localStorage.setItem('ielts_b1_writing_prompts_page4', JSON.stringify(selectedPrompts));
      }
      
      // Load stored data
      loadStoredData();
      
      displayWritingInstructions();
      displayPrompts();
      updateValidation();
    }

    function loadStoredData() {
      // Get stored responses
      const storedResponses = localStorage.getItem('ielts_b1_writing_responses_page4');
      if (storedResponses) {
        userResponses = JSON.parse(storedResponses);
      }
      
      // Get stored word counts
      const storedWordCounts = localStorage.getItem('ielts_b1_writing_wordcounts_page4');
      if (storedWordCounts) {
        wordCounts = JSON.parse(storedWordCounts);
      }
      
      // Get stored relevance scores
      const storedRelevance = localStorage.getItem('ielts_b1_writing_relevance_page4');
      if (storedRelevance) {
        relevanceScores = JSON.parse(storedRelevance);
      }
    }

    function savePageProgress() {
      // Save current page data
      localStorage.setItem('ielts_b1_writing_responses_page4', JSON.stringify(userResponses));
      localStorage.setItem('ielts_b1_writing_wordcounts_page4', JSON.stringify(wordCounts));
      localStorage.setItem('ielts_b1_writing_relevance_page4', JSON.stringify(relevanceScores));
    }

    function selectDifferentPrompts(count) {
      // Get used prompts from previous pages
      const usedPrompts = new Set();
      
      // Add prompts from page 1
      const page1Prompts = JSON.parse(localStorage.getItem('ielts_b1_writing_prompts') || '[]');
      page1Prompts.forEach(prompt => usedPrompts.add(prompt.prompt));
      
      // Add prompts from page 2
      const page2Prompts = JSON.parse(localStorage.getItem('ielts_b1_writing_prompts_page2') || '[]');
      page2Prompts.forEach(prompt => usedPrompts.add(prompt.prompt));
      
      // Add prompts from page 3
      const page3Prompts = JSON.parse(localStorage.getItem('ielts_b1_writing_prompts_page3') || '[]');
      page3Prompts.forEach(prompt => usedPrompts.add(prompt.prompt));
      
      // Filter out used prompts
      const availablePrompts = writingPrompts.filter(prompt => !usedPrompts.has(prompt.prompt));
      
      // If we don't have enough unique prompts, shuffle and take what we have
      if (availablePrompts.length < count) {
        const shuffled = [...writingPrompts];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled.slice(0, count);
      }
      
      // Shuffle available prompts
      for (let i = availablePrompts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [availablePrompts[i], availablePrompts[j]] = [availablePrompts[j], availablePrompts[i]];
      }
      
      return availablePrompts.slice(0, count);
    }

    function refreshPrompts() {
      if (confirm("Are you sure you want to refresh the prompts? Your current progress will be lost.")) {
        // Clear stored data
        localStorage.removeItem('ielts_b1_writing_prompts_page4');
        localStorage.removeItem('ielts_b1_writing_responses_page4');
        localStorage.removeItem('ielts_b1_writing_wordcounts_page4');
        localStorage.removeItem('ielts_b1_writing_relevance_page4');
        
        // Reset variables
        userResponses = {};
        wordCounts = {};
        relevanceScores = {};
        
        // Generate new different prompts
        selectedPrompts = selectDifferentPrompts(5);
        localStorage.setItem('ielts_b1_writing_prompts_page4', JSON.stringify(selectedPrompts));
        
        // Refresh display
        displayPrompts();
        updateValidation();
      }
    }

    function displayWritingInstructions() {
      const mainCard = document.getElementById('mainCard');
      mainCard.innerHTML = '';
      
      const writingElement = document.createElement('div');
      writingElement.className = 'writing-prompt';
      writingElement.innerHTML = `
        <div class="inner-card">
          <div class="flex justify-between items-center mb-3">
            <p class="font-bold text-center mb-1 text-lg">
              IELTS B1 Writing - Maps Development & Crime Essay (Page 4/5)
            </p>
            <button class="refresh-btn" onclick="refreshPrompts()">
              <i class="fas fa-sync-alt mr-1"></i>Refresh Prompts
            </button>
          </div>
          <div class="test-info">
            <p class="text-center mb-3">
              <strong>Write responses for each of the 5 prompts below.</strong><br>
              Task 1: Write at least 150 words<br>
              Task 2: Write at least 250 words<br>
              <span class="text-red-600 font-semibold">Final stretch! Only one page left after this.</span>
            </p>
            <p class="prompt-counter">
              Showing 5 different prompts from previous pages
            </p>
          </div>
          <div class="mt-3 text-xs">
            <p><strong>Task Types:</strong></p>
            <div class="flex items-center mt-1 flex-wrap gap-1">
              <div class="task-indicator task-1">Task 1</div>
              <span>Maps: Development on an island</span>
              <div class="task-indicator task-2 ml-4">Task 2</div>
              <span>Problems and solutions essay: Crime</span>
            </div>
          </div>
          <p class="text-xs text-gray-600 mt-2">
            <strong>Final Tips:</strong> 
            <ul class="mt-1 ml-4 list-disc">
              <li>Focus on completing all responses - you can refine them later</li>
              <li>Make sure each essay has a clear introduction, body, and conclusion</li>
              <li>Use a variety of sentence structures and vocabulary</li>
              <li>Leave 2-3 minutes to check each essay for errors</li>
            </ul>
          </p>
          <div class="mt-3 text-xs">
            <p><strong>Relevance Indicator:</strong></p>
            <div class="flex items-center mt-1 flex-wrap gap-1">
              <div class="relevance-indicator relevance-high">High Relevance</div>
              <div class="relevance-indicator relevance-medium">Medium Relevance</div>
              <div class="relevance-indicator relevance-low">Low Relevance</div>
            </div>
          </div>
        </div>
      `;
      
      mainCard.appendChild(writingElement);
    }

    function displayPrompts() {
      const container = document.getElementById('prompts-container');
      container.innerHTML = '';
      
      selectedPrompts.forEach((prompt, index) => {
        const promptElement = document.createElement('section');
        promptElement.className = 'card rounded-xl mt-6 question-card';
        promptElement.setAttribute('aria-label', `Writing Prompt ${index + 1}`);
        
        const promptId = `prompt_${index}`;
        const storedResponse = userResponses[promptId] || '';
        const wordCount = wordCounts[promptId] || 0;
        const relevanceScore = relevanceScores[promptId] || 0;
        
        // Get relevance display
        const relevanceDisplay = getRelevanceDisplay(relevanceScore, promptId);
        
        // Determine minimum word count based on task type
        const minWords = prompt.type === "Task 1" ? 150 : 250;
        const taskClass = prompt.type === "Task 1" ? "task-1" : "task-2";
        
        promptElement.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <p class="text-[10px] font-semibold">
              ${index + 1}. ${prompt.prompt}
            </p>
            <div class="flex items-center">
              <span class="text-[8px] bg-blue-100 text-blue-800 px-2 py-1 rounded">Prompt ${index + 1}/5</span>
              <span class="task-indicator ${taskClass} ml-2">${prompt.type}</span>
            </div>
          </div>
          <div class="mt-3">
            <textarea 
              id="${promptId}" 
              placeholder="Write your response here (minimum ${minWords} words)..." 
              rows="8"
              oninput="updateWordCountAndRelevance('${promptId}', '${prompt.prompt}')"
            >${storedResponse}</textarea>
            <div class="word-count" id="wordCount_${promptId}">Words: ${wordCount}</div>
          </div>
          ${wordCount >= minWords ? 
            `<div class="score-display">
              <p class="text-sm">Response length: <span class="score-value">Good</span> (${wordCount} words)</p>
              ${relevanceDisplay}
            </div>` : 
            `<div class="score-display" style="background-color: #fef2f2; border-color: #fecaca;">
              <p class="text-sm">Response length: <span class="score-value" style="color: #dc2626;">Too Short</span> (${wordCount} words)</p>
              <p class="text-xs mt-1">Your response needs to be at least ${minWords} words.</p>
            </div>`
          }
        `;
        
        container.appendChild(promptElement);
      });
    }

    function updateWordCountAndRelevance(promptId, promptText) {
      const textarea = document.getElementById(promptId);
      const wordCountElement = document.getElementById(`wordCount_${promptId}`);
      
      if (textarea && wordCountElement) {
        const text = textarea.value.trim();
        const words = text === '' ? 0 : text.split(/\s+/).length;
        
        wordCountElement.textContent = `Words: ${words}`;
        wordCounts[promptId] = words;
        userResponses[promptId] = textarea.value;
        
        // Calculate relevance score
        const relevance = calculateRelevance(text, promptText);
        relevanceScores[promptId] = relevance;
        
        // Save to localStorage
        savePageProgress();
        
        // Update the score display dynamically
        updateScoreDisplay(promptId, words, relevance);
        
        // Update relevance display
        updateRelevanceDisplay(promptId, relevance, promptText, text);
        
        updateValidation();
      }
    }

    function calculateRelevance(text, prompt) {
      if (!text || text.trim().length === 0) return 0;
      
      // Convert to lowercase for case-insensitive matching
      const lowerText = text.toLowerCase();
      const lowerPrompt = prompt.toLowerCase();
      
      // Find the prompt object to get keywords
      const promptObj = writingPrompts.find(p => p.prompt === prompt);
      const keywords = promptObj ? promptObj.keywords : extractKeywordsFromPrompt(prompt);
      
      // Calculate keyword matches
      let matches = 0;
      let matchedKeywords = [];
      
      keywords.forEach(keyword => {
        const regex = new RegExp(`\\b${keyword.toLowerCase()}\\b`, 'gi');
        const keywordMatches = (lowerText.match(regex) || []).length;
        if (keywordMatches > 0) {
          matches += keywordMatches;
          matchedKeywords.push(keyword);
        }
      });
      
      // Calculate relevance score (0-100)
      // Base score on keyword matches and text length
      const baseScore = Math.min((matches / Math.max(keywords.length, 1)) * 70, 70);
      
      // Bonus for text length (encourage longer, more detailed responses)
      const wordCount = text.split(/\s+/).length;
      const lengthBonus = Math.min((wordCount / 300) * 30, 30);
      
      const totalScore = Math.min(baseScore + lengthBonus, 100);
      
      // Store matched keywords for display
      relevanceScores[`${prompt}_keywords`] = matchedKeywords;
      
      return Math.round(totalScore);
    }

    function extractKeywordsFromPrompt(prompt) {
      // Simple keyword extraction for prompts without predefined keywords
      const stopWords = ['the', 'a', 'an', 'and', 'or', 'but', 'in', 'on', 'at', 'to', 'for', 'of', 'with', 'by', 'your', 'you', 'should', 'why', 'what', 'how', 'describe', 'write', 'about', 'think', 'opinion', 'view'];
      
      return prompt
        .toLowerCase()
        .replace(/[^\w\s]/g, '')
        .split(/\s+/)
        .filter(word => word.length > 2 && !stopWords.includes(word));
    }

    function getRelevanceDisplay(score, promptId) {
      let relevanceClass = 'relevance-low';
      let relevanceText = 'Low Relevance';
      
      if (score >= 70) {
        relevanceClass = 'relevance-high';
        relevanceText = 'High Relevance';
      } else if (score >= 40) {
        relevanceClass = 'relevance-medium';
        relevanceText = 'Medium Relevance';
      }
      
      return `
        <div class="mt-2">
          <p class="text-sm">Relevance to prompt: <span class="score-value">${score}% - ${relevanceText}</span></p>
          <div class="relevance-indicator ${relevanceClass} mt-1" id="relevance_${promptId}">
            ${relevanceText} (${score}%)
          </div>
        </div>
      `;
    }

    function updateScoreDisplay(promptId, wordCount, relevanceScore) {
      // Find the prompt element
      const promptElement = document.getElementById(promptId);
      if (!promptElement) return;
      
      const parentCard = promptElement.closest('.card');
      if (!parentCard) return;
      
      // Find or create score display
      let scoreDisplay = parentCard.querySelector('.score-display');
      
      if (!scoreDisplay) {
        scoreDisplay = document.createElement('div');
        scoreDisplay.className = 'score-display';
        const textareaContainer = parentCard.querySelector('textarea').parentElement;
        textareaContainer.parentElement.appendChild(scoreDisplay);
      }
      
      // Get relevance display HTML
      const relevanceDisplay = getRelevanceDisplay(relevanceScore, promptId);
      
      // Determine minimum word count based on task type
      const promptIndex = parseInt(promptId.split('_')[1]);
      const promptObj = selectedPrompts[promptIndex];
      const minWords = promptObj.type === "Task 1" ? 150 : 250;
      
      // Update score display content
      if (wordCount >= minWords) {
        scoreDisplay.style.backgroundColor = '#f0f9ff';
        scoreDisplay.style.borderColor = '#bae6fd';
        scoreDisplay.innerHTML = `
          <p class="text-sm">Response length: <span class="score-value">Good</span> (${wordCount} words)</p>
          ${relevanceDisplay}
        `;
      } else {
        scoreDisplay.style.backgroundColor = '#fef2f2';
        scoreDisplay.style.borderColor = '#fecaca';
        scoreDisplay.innerHTML = `
          <p class="text-sm">Response length: <span class="score-value" style="color: #dc2626;">Too Short</span> (${wordCount} words)</p>
          <p class="text-xs mt-1">Your response needs to be at least ${minWords} words.</p>
        `;
      }
    }

    function updateRelevanceDisplay(promptId, score, promptText, text) {
      const relevanceElement = document.getElementById(`relevance_${promptId}`);
      if (!relevanceElement) return;
      
      let relevanceClass = 'relevance-low';
      let relevanceText = 'Low Relevance';
      
      if (score >= 70) {
        relevanceClass = 'relevance-high';
        relevanceText = 'High Relevance';
      } else if (score >= 40) {
        relevanceClass = 'relevance-medium';
        relevanceText = 'Medium Relevance';
      }
      
      relevanceElement.className = `relevance-indicator ${relevanceClass} mt-1`;
      
      // Show matched keywords if available
      const matchedKeywords = relevanceScores[`${promptText}_keywords`] || [];
      let keywordsHTML = '';
      
      if (matchedKeywords.length > 0) {
        const keywordsDisplay = matchedKeywords.map(kw => 
          `<span class="keyword-match">${kw}</span>`
        ).join('');
        
        keywordsHTML = `
          <div class="mt-1 text-xs">
            Matched keywords: ${keywordsDisplay}
          </div>
        `;
      }
      
      relevanceElement.innerHTML = `
        ${relevanceText} (${score}%)
        ${score < 70 ? `<div class="mt-1 text-xs">Tip: Try to use more keywords related to the prompt.</div>` : ''}
        ${keywordsHTML}
      `;
    }

    function updateValidation() {
      // No validation - allow users to skip writing test
      let completedCount = 0;
      
      selectedPrompts.forEach((prompt, index) => {
        const promptId = `prompt_${index}`;
        const wordCount = wordCounts[promptId] || 0;
        const relevanceScore = relevanceScores[promptId] || 0;
        
        // Determine minimum word count based on task type
        const minWords = prompt.type === "Task 1" ? 150 : 250;
        
        // Count completed for progress indicator only
        if (wordCount >= minWords && relevanceScore >= 40) {
          completedCount++;
        }
      });
      
      // Next button always enabled - no restrictions
      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) {
        nextBtn.removeAttribute('data-disabled');
        nextBtn.style.opacity = '1';
        nextBtn.style.pointerEvents = 'auto';
      }
      
      updateProgressIndicator(completedCount);
    }

    function updateProgressIndicator(completedCount) {
      let progressIndicator = document.querySelector('.progress-indicator');
      
      if (!progressIndicator) {
        progressIndicator = document.createElement('div');
        progressIndicator.className = 'progress-indicator';
        document.body.appendChild(progressIndicator);
      }
      
      progressIndicator.innerHTML = `<span id="progress-text">Progress: ${completedCount}/5</span>`;
      
      if (completedCount === 5) {
        progressIndicator.classList.add('complete');
        progressIndicator.innerHTML += ' ✓';
      } else {
        progressIndicator.classList.remove('complete');
      }
    }

    function initializeCountdown() {
      const progressBar = document.getElementById('progressBar');
      const timeDisplay = document.getElementById('timeDisplay');
      
      if (!progressBar || !timeDisplay) return;
      
      // Set initial time (90 minutes in seconds)
      let timeLeft = 90 * 60;
      
      // Update every second
      const countdown = setInterval(() => {
        timeLeft--;
        
        // Update progress bar
        progressBar.value = timeLeft;
        
        // Calculate hours, minutes, seconds
        const hours = Math.floor(timeLeft / 3600);
        const minutes = Math.floor((timeLeft % 3600) / 60);
        const seconds = timeLeft % 60;
        
        // Update time display
        timeDisplay.textContent = `${hours}Jam ${minutes}Menit ${seconds}Detik`;
        
        // When time is up
        if (timeLeft <= 0) {
          clearInterval(countdown);
          timeDisplay.textContent = "Time's up!";
          timeDisplay.style.color = "red";
          
          // Auto-submit when time is up
          alert("Time's up! Your responses have been saved.");
          savePageProgress();
        }
      }, 1000);
    }

    function initializeTabSwitchDetection() {
      // Track visibility changes
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          // Tab switched - show warning
          console.log('Tab switched detected - IELTS test in progress');
        }
      });
    }

    function initializeProtection() {
      // Disable right-click context menu
      document.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        return false;
      });
      
      // Disable text selection
      document.addEventListener('selectstart', (e) => {
        e.preventDefault();
        return false;
      });
      
      // Disable copy
      document.addEventListener('copy', (e) => {
        e.preventDefault();
        return false;
      });
      
      // Disable cut
      document.addEventListener('cut', (e) => {
        e.preventDefault();
        return false;
      });
      
      // Disable paste
      document.addEventListener('paste', (e) => {
        e.preventDefault();
        return false;
      });
      
      // Disable drag and drop
      document.addEventListener('dragstart', (e) => {
        e.preventDefault();
        return false;
      });
      
      document.addEventListener('drop', (e) => {
        e.preventDefault();
        return false;
      });
      
      // Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
      document.addEventListener('keydown', (e) => {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && e.key === 'I') ||
          (e.ctrlKey && e.shiftKey && e.key === 'J') ||
          (e.ctrlKey && e.key === 'u')
        ) {
          e.preventDefault();
          return false;
        }
      });
    }

    // Save responses when moving to next page
    document.getElementById('nextBtn').addEventListener('click', function(e) {
      if (!this.hasAttribute('data-disabled')) {
        savePageProgress();
        
        // Calculate scores for this page
        let pageScore = 0;
        let maxScore = 5;
        
        selectedPrompts.forEach((prompt, index) => {
          const promptId = `prompt_${index}`;
          const wordCount = wordCounts[promptId] || 0;
          const relevanceScore = relevanceScores[promptId] || 0;
          
          // Determine minimum word count based on task type
          const minWords = prompt.type === "Task 1" ? 150 : 250;
          
          if (wordCount >= minWords && relevanceScore >= 40) {
            pageScore++;
          }
        });
        
        // Save page score
        localStorage.setItem('ielts_b1_writing_score_page4', JSON.stringify({
          score: pageScore,
          maxScore: maxScore,
          percentage: Math.round((pageScore / maxScore) * 100),
          relevanceScores: relevanceScores
        }));
      }
    });
  </script>
