    // Random selection
    function selectRandomTasks(tasks, count) {
      const shuffled = [...tasks].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, count);
    }

    let selectedTasks;

    if (stored) {
      try {
        const storedIds = JSON.parse(stored);
        selectedTasks = allTasks.filter(t => storedIds.includes(t.id));
        if (selectedTasks.length !== 5) {
          selectedTasks = selectRandomTasks(allTasks, 5);
          localStorage.setItem(storageKey, JSON.stringify(selectedTasks.map(t => t.id)));
        }
      } catch (e) {
        selectedTasks = selectRandomTasks(allTasks, 5);
        localStorage.setItem(storageKey, JSON.stringify(selectedTasks.map(t => t.id)));
      }
    } else {
      selectedTasks = selectRandomTasks(allTasks, 5);
      localStorage.setItem(storageKey, JSON.stringify(selectedTasks.map(t => t.id)));
    }

    // Completion tracking
    let completed = {};
    const totalTasks = 5;
    
    function saveCompletion() {
      const completionData = {
        completed: Object.keys(completed).length,
        total: totalTasks,
        tasks: completed,
        selectedIds: selectedTasks.map(t => t.id),
        timestamp: new Date().toISOString()
      };
      localStorage.setItem('business_negotiating_page5_answers', JSON.stringify(completionData));
      console.log('Saved completion:', completionData);
    }
    
    // Speech recognition
    let recognition = null;
    let isRecording = {};
    let waitingForFinalResult = {}; // Track if waiting for final transcript
    let finalResultTimeout = {}; // Timeout for final result
    let transcripts = {};
    
    function initSpeechRecognition() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        console.warn('Speech recognition not supported');
        return false;
      }
      
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';
      
      recognition.onresult = (event) => {
        let finalTranscript = '';
        let interimTranscript = '';
        
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += transcript;
          } else {
            interimTranscript += transcript;
          }
        }
        
        const currentTask = getCurrentRecordingTask();
        if (currentTask !== null) {
          // Accumulate final transcripts
          if (finalTranscript) {
            if (!transcripts[currentTask]) {
              transcripts[currentTask] = '';
            }
            transcripts[currentTask] += ' ' + finalTranscript;
          }
          
          const transcriptDiv = document.getElementById(`transcript${currentTask}`);
          if (transcriptDiv) {
            const displayText = (transcripts[currentTask] || '') + ' ' + interimTranscript;
            transcriptDiv.textContent = displayText.trim();
          }
          
          // If waiting for final result and got one, proceed with feedback
          if (waitingForFinalResult[currentTask] && finalTranscript) {
            console.log('Final result received for task', currentTask);
            if (finalResultTimeout[currentTask]) {
              clearTimeout(finalResultTimeout[currentTask]);
              delete finalResultTimeout[currentTask];
            }
            waitingForFinalResult[currentTask] = false;
            processFeedback(currentTask);
          }
        }
      };
      
      recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        const currentTask = getCurrentRecordingTask();
        if (currentTask !== null) {
          stopRecording(currentTask);
        }
      };
      
      return true;
    }
    
    function getCurrentRecordingTask() {
      for (let i = 0; i < 5; i++) {
        if (isRecording[i]) return i;
      }
      return null;
    }
    
    window.toggleRecording = function(taskIndex) {
      if (!recognition && !initSpeechRecognition()) {
        alert('Speech recognition not supported in this browser. Please use Chrome, Edge, or Safari.');
        // Still mark as complete for testing
        markComplete(taskIndex);
        return;
      }
      
      if (isRecording[taskIndex]) {
        stopRecording(taskIndex);
      } else {
        startRecording(taskIndex);
      }
    };
    
    function startRecording(taskIndex) {
      // Stop other recordings
      for (let i = 0; i < 5; i++) {
        if (isRecording[i]) stopRecording(i);
      }
      
      try {
        recognition.start();
        isRecording[taskIndex] = true;
        
        const button = document.getElementById(`micButton${taskIndex}`);
        const status = document.getElementById(`recordingStatus${taskIndex}`);
        
        if (button) button.classList.add('recording');
        if (status) status.textContent = '🔴 Recording... Click to stop';
        
        // Auto-stop after 2 minutes
        setTimeout(() => {
          if (isRecording[taskIndex]) stopRecording(taskIndex);
        }, 120000);
      } catch (e) {
        console.error('Error starting recording:', e);
        isRecording[taskIndex] = false;
      }
    }
    
    function stopRecording(taskIndex) {
      if (recognition) {
        try { 
          recognition.stop(); 
        } catch (e) {
          console.log('Recognition already stopped:', e);
        }
      }
      
      isRecording[taskIndex] = false;
      
      const button = document.getElementById(`micButton${taskIndex}`);
      const status = document.getElementById(`recordingStatus${taskIndex}`);
      
      if (button) {
        button.classList.remove('recording');
        button.classList.add('processing');
      }
      if (status) status.textContent = '⏳ Processing...';
      
      // Periksa apakah ada transcript yang valid
      const currentTranscript = transcripts[taskIndex] || '';
      const wordCount = currentTranscript.trim().split(/\s+/).filter(w => w.length > 0).length;
      
      // Jika tidak ada speech yang berarti, langsung proses feedback
      if (wordCount === 0) {
        console.log('No substantial speech detected, proceeding directly to feedback');
        processFeedback(taskIndex);
        return;
      }
      
      // Tunggu hasil final dengan timeout yang lebih pendek
      waitingForFinalResult[taskIndex] = true;
      
      finalResultTimeout[taskIndex] = setTimeout(() => {
        console.log('Processing timeout reached for task', taskIndex);
        if (waitingForFinalResult[taskIndex]) {
          waitingForFinalResult[taskIndex] = false;
          processFeedback(taskIndex);
        }
      }, 1500);
    }
    
    function processFeedback(taskIndex) {
      // Add small delay to ensure UI updates
      setTimeout(() => {
        showFeedback(taskIndex);
        markComplete(taskIndex);
      }, 500);
    }
    
    function showFeedback(taskIndex) {
      const button = document.getElementById(`micButton${taskIndex}`);
      const status = document.getElementById(`recordingStatus${taskIndex}`);
      const feedback = document.getElementById(`feedback${taskIndex}`);
      const transcript = (transcripts[taskIndex] || '').trim();

      if (button) {
        button.classList.remove('processing');
        button.classList.add('completed');
      }
      if (status) status.textContent = '✅ Recording complete!';
      if (feedback) feedback.style.display = 'block';

      // Analisis transcript yang lebih akurat
      const wordCount = transcript.split(/\s+/).filter(w => w.length > 0).length;
      const sentenceCount = transcript.split(/[.!?]+/).filter(s => s.trim().length > 0).length;
      const avgWordLength = wordCount > 0 ? 
        transcript.replace(/\s+/g, '').length / wordCount : 0;

      console.log(`Task ${taskIndex} - Words: ${wordCount}, Sentences: ${sentenceCount}, AvgWordLen: ${avgWordLength.toFixed(1)}`);

      // Scoring yang lebih realistis berdasarkan konten
      let grammarScore, pronunciationScore, fluencyScore, coherenceScore;

      if (wordCount === 0) {
        // Tidak ada speech yang terdeteksi
        grammarScore = 0;
        pronunciationScore = 0;
        fluencyScore = 0;
        coherenceScore = 0;
      } else if (wordCount < 5) {
        // Speech sangat minimal
        grammarScore = Math.min(3, Math.floor(wordCount * 0.6));
        pronunciationScore = Math.min(3, Math.floor(wordCount * 0.5));
        fluencyScore = Math.min(2, Math.floor(wordCount * 0.4));
        coherenceScore = Math.min(2, Math.floor(wordCount * 0.3));
      } else {
        // Scoring normal berdasarkan kualitas dan kuantitas speech
        const baseScore = Math.min(9, Math.max(4, Math.floor(wordCount / 8)));
        
        // Grammar: berdasarkan variasi struktur kalimat
        grammarScore = Math.min(9, baseScore + Math.min(2, sentenceCount));
        
        // Pronunciation: estimasi berdasarkan panjang kata rata-rata dan variasi
        const pronunciationBase = Math.min(8, baseScore + 1);
        pronunciationScore = avgWordLength > 4 ? 
          Math.min(9, pronunciationBase + 1) : pronunciationBase;
        
        // Fluency: berdasarkan rasio kata per kalimat
        const wordsPerSentence = sentenceCount > 0 ? wordCount / sentenceCount : 0;
        fluencyScore = wordsPerSentence > 5 ? 
          Math.min(9, baseScore + 2) : baseScore;
        
        // Coherence: berdasarkan kompleksitas respons
        coherenceScore = wordCount > 20 ? 
          Math.min(9, baseScore + 1) : baseScore;
      }

      // Terapkan scores
      document.getElementById(`grammarScore${taskIndex}`).textContent = grammarScore;
      document.getElementById(`pronunciationScore${taskIndex}`).textContent = pronunciationScore;
      document.getElementById(`fluencyScore${taskIndex}`).textContent = fluencyScore;
      document.getElementById(`coherenceScore${taskIndex}`).textContent = coherenceScore;

      // Feedback detail yang lebih spesifik
      const detailedFeedback = document.getElementById(`detailedFeedback${taskIndex}`);
      if (detailedFeedback) {
        let feedbackText = '';

        if (wordCount === 0) {
          feedbackText = `
            <strong>⚠️ No Speech Detected</strong><br>
            • Microphone may not be working properly<br>
            • Please check browser permissions<br>
            • Try speaking louder and clearer<br>
            • Ensure microphone is not muted
          `;
        } else if (wordCount < 5) {
          feedbackText = `
            <strong>📝 Very Short Response</strong><br>
            • Only ${wordCount} word(s) recorded<br>
            • Try to speak for 15-30 seconds<br>
            • Provide complete sentences<br>
            • Expand on your thoughts more
          `;
        } else if (wordCount < 15) {
          feedbackText = `
            <strong>📊 Basic Response</strong><br>
            • ${wordCount} words recorded<br>
            • Good start, but could be more detailed<br>
            • Try to use more complex sentences<br>
            • Practice speaking for longer periods
          `;
        } else if (wordCount < 30) {
          feedbackText = `
            <strong>📈 Good Effort</strong><br>
            • ${wordCount} words recorded<br>
            • You're expressing ideas clearly<br>
            • Good sentence structure<br>
            • Continue practicing for fluency
          `;
        } else {
          feedbackText = `
            <strong>🎯 Excellent Response</strong><br>
            • ${wordCount} words recorded<br>
            • Strong vocabulary and structure<br>
            • Good pacing and pronunciation<br>
            • Well-developed thoughts
          `;
        }

        // Tambahkan feedback spesifik untuk negotiation
        feedbackText += `<br><br><strong>🎯 Negotiation Focus:</strong><br>`;
        
        // Analisis kata kunci negotiation
        const negotiationKeywords = ['discuss', 'options', 'reasonable', 'partnership', 'adjust', 'terms', 'budget', 'proposal', 'concern', 'quality', 'service'];
        const foundKeywords = negotiationKeywords.filter(keyword => 
          transcript.toLowerCase().includes(keyword.toLowerCase())
        );
        
        if (foundKeywords.length >= 3) {
          feedbackText += `• Good use of negotiation vocabulary (${foundKeywords.length} keywords)<br>`;
        } else {
          feedbackText += `• Try to use more negotiation terms like "discuss options", "reasonable", "partnership"<br>`;
        }
        
        // Check for polite language
        const politeWords = ['thank', 'please', 'could', 'would', 'appreciate'];
        const hasPoliteLanguage = politeWords.some(word => 
          transcript.toLowerCase().includes(word)
        );
        
        if (hasPoliteLanguage) {
          feedbackText += `• Appropriate polite business language<br>`;
        } else {
          feedbackText += `• Add polite phrases like "Thank you", "Could we", "I appreciate"<br>`;
        }
        
        // Check for problem-solving approach
        const solutionWords = ['solution', 'option', 'alternative', 'adjust', 'flexible'];
        const hasSolutions = solutionWords.some(word => 
          transcript.toLowerCase().includes(word)
        );
        
        if (hasSolutions) {
          feedbackText += `• Good focus on finding solutions<br>`;
        } else {
          feedbackText += `• Emphasize finding mutually beneficial solutions<br>`;
        }

        detailedFeedback.innerHTML = feedbackText;
      }
    }
    
    function markComplete(taskIndex) {
      completed[taskIndex] = true;
      saveCompletion();
      
      // Update next button jika semua task selesai
      if (Object.keys(completed).length === totalTasks) {
        const nextBtn = document.getElementById('nextBtn');
        if (nextBtn) {
          nextBtn.style.opacity = '1';
          nextBtn.style.pointerEvents = 'auto';
        }
      }
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      initSpeechRecognition();
      saveCompletion(); // Initialize storage
    });
  </script>
</body>
</html>
