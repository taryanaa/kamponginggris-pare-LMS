  <main class="max-w-4xl mx-auto px-6 py-8 flex-grow">
    <section class="mb-6">
      <div class="bg-[#2563eb] text-white text-[10px] text-center py-1 rounded-md select-none font-semibold" aria-label="IELTS test title">

      </div>
      <progress id="progressBar" max="3600" value="3600" aria-label="IELTS test progress bar" role="progressbar" aria-valuemin="0" aria-valuemax="3600" aria-valuenow="3600"></progress>

        Durasi 60 menit<br />

    <section class="card rounded-xl" aria-label="Writing Instructions section" id="mainCard">

  <div class="next-button-container">

      Next Page
    </a>
  </div>

  <script>
    // Writing prompts database - 20 prompts for Personal Experience
    const writingPrompts = [
      "Describe your favorite childhood memory.",
      "Write about a time you helped someone.",
      "Describe a difficult decision you had to make.",
      "Write about a time you felt very proud.",
      "Describe a trip you took with your family.",
      "Write about your first day at school.",
      "Describe a time you learned something new.",
      "Write about a special birthday celebration.",
      "Describe a time you overcame a fear.",
      "Write about a time you made a new friend.",
      "Describe your favorite holiday memory.",
      "Write about a time you received good news.",
      "Describe a time you had to work hard for something.",
      "Write about a time you felt scared.",
      "Describe a time you were surprised.",
      "Write about your first pet.",
      "Describe a time you cooked a meal.",
      "Write about a time you visited a new place.",
      "Describe a time you played a sport.",
      "Write about a time you read an interesting book."
    ];

    // Complete keyword database for relevance detection
    const promptKeywords = {
      "Describe your favorite childhood memory.": ["childhood", "memory", "remember", "young", "kid", "growing up", "past", "nostalgia", "play", "family", "friends"],
      "Write about a time you helped someone.": ["help", "assist", "support", "aid", "someone", "person", "friend", "family", "need", "problem", "solution"],
      "Describe a difficult decision you had to make.": ["decision", "choose", "option", "difficult", "hard", "choice", "select", "consider", "think", "weigh"],
      "Write about a time you felt very proud.": ["proud", "pride", "accomplishment", "achievement", "success", "happy", "satisfied", "reward", "effort"],
      "Describe a trip you took with your family.": ["trip", "travel", "journey", "family", "vacation", "holiday", "visit", "destination", "experience", "memory"],
      "Write about your first day at school.": ["first day", "school", "nervous", "excited", "teacher", "classroom", "friends", "new", "experience", "learn"],
      "Describe a time you learned something new.": ["learn", "new", "skill", "knowledge", "understand", "discover", "experience", "practice", "improve"],
      "Write about a special birthday celebration.": ["birthday", "celebrate", "special", "party", "gifts", "cake", "friends", "family", "memory", "fun"],
      "Describe a time you overcame a fear.": ["fear", "overcome", "brave", "courage", "face", "challenge", "anxiety", "nervous", "confident"],
      "Write about a time you made a new friend.": ["friend", "new", "meet", "relationship", "connect", "share", "interest", "hobby", "trust"],
      "Describe your favorite holiday memory.": ["holiday", "memory", "celebrate", "tradition", "family", "friends", "special", "occasion", "enjoy"],
      "Write about a time you received good news.": ["good news", "receive", "happy", "excited", "share", "celebrate", "relieved", "positive"],
      "Describe a time you had to work hard for something.": ["work hard", "effort", "perseverance", "determination", "challenge", "achievement", "success", "goal"],
      "Write about a time you felt scared.": ["scared", "fear", "nervous", "anxious", "worried", "situation", "overcome", "brave"],
      "Describe a time you were surprised.": ["surprised", "unexpected", "shock", "amazed", "astonished", "reaction", "moment"],
      "Write about your first pet.": ["pet", "first", "animal", "care", "love", "companion", "memory", "childhood"],
      "Describe a time you cooked a meal.": ["cook", "meal", "food", "recipe", "ingredients", "kitchen", "prepare", "delicious"],
      "Write about a time you visited a new place.": ["visit", "new place", "travel", "explore", "discover", "experience", "adventure"],
      "Describe a time you played a sport.": ["sport", "play", "game", "team", "exercise", "competition", "practice", "enjoy"],
      "Write about a time you read an interesting book.": ["read", "book", "interesting", "story", "character", "plot", "learn", "enjoy"]
    };

    // Current selected prompts
    let selectedPrompts = [];
    let userResponses = {};
    let wordCounts = {};
    let relevanceScores = {};

    document.addEventListener('DOMContentLoaded', () => {
      initializeTest();
      initializeCountdown();
      initializeTabSwitchDetection();
      initializeProtection();
    });

    function initializeTest() {
      // Get or generate random prompts for this page
      const storedPrompts = localStorage.getItem('ielts_writing_personal_prompts');
      if (storedPrompts) {
        selectedPrompts = JSON.parse(storedPrompts);
      } else {
        selectedPrompts = selectRandomPrompts(5);
        localStorage.setItem('ielts_writing_personal_prompts', JSON.stringify(selectedPrompts));
      }
      
      // Load stored data
      loadStoredData();
      
      displayWritingInstructions();
      displayPrompts();
      updateValidation();
    }

    function loadStoredData() {
      // Get stored responses
      const storedResponses = localStorage.getItem('ielts_writing_personal_responses');
      if (storedResponses) {
        userResponses = JSON.parse(storedResponses);
      }
      
      // Get stored word counts
      const storedWordCounts = localStorage.getItem('ielts_writing_personal_wordcounts');
      if (storedWordCounts) {
        wordCounts = JSON.parse(storedWordCounts);
      }
      
      // Get stored relevance scores
      const storedRelevance = localStorage.getItem('ielts_writing_personal_relevance');
      if (storedRelevance) {
        relevanceScores = JSON.parse(storedRelevance);
      }
    }

    function savePageProgress() {
      // Save current page data
      localStorage.setItem('ielts_writing_personal_responses', JSON.stringify(userResponses));
      localStorage.setItem('ielts_writing_personal_wordcounts', JSON.stringify(wordCounts));
      localStorage.setItem('ielts_writing_personal_relevance', JSON.stringify(relevanceScores));
    }

    function selectRandomPrompts(count) {
      const prompts = [...writingPrompts];
      
      // Shuffle array
      for (let i = prompts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [prompts[i], prompts[j]] = [prompts[j], prompts[i]];
      }
      
      return prompts.slice(0, count);
    }

    function refreshPrompts() {
      if (confirm("Are you sure you want to refresh the prompts? Your current progress will be lost.")) {
        // Clear stored data
        localStorage.removeItem('ielts_writing_personal_prompts');
        localStorage.removeItem('ielts_writing_personal_responses');
        localStorage.removeItem('ielts_writing_personal_wordcounts');
        localStorage.removeItem('ielts_writing_personal_relevance');
        
        // Reset variables
        userResponses = {};
        wordCounts = {};
        relevanceScores = {};
        
        // Generate new prompts
        selectedPrompts = selectRandomPrompts(5);
        localStorage.setItem('ielts_writing_personal_prompts', JSON.stringify(selectedPrompts));
        
        // Refresh display
        displayPrompts();
        updateValidation();
      }
    }

    function displayWritingInstructions() {
      const mainCard = document.getElementById('mainCard');
      mainCard.innerHTML = '';
      
      const writingElement = document.createElement('div');
      writingElement.className = 'writing-prompt';
      writingElement.innerHTML = `
        <div class="inner-card">
          <div class="flex justify-between items-center mb-3">
            <p class="font-bold text-center mb-1 text-lg">
              IELTS A2 Writing - Personal Experience
            </p>
            <button class="refresh-btn" onclick="refreshPrompts()">
              <i class="fas fa-sync-alt mr-1"></i>Refresh Prompts
            </button>
          </div>
          <div class="test-info">
            <p class="text-center mb-3">
              <strong>Write an essay for each of the 5 prompts below.</strong><br>
              Each essay should be at least 150 words. You have 60 minutes to complete all 5 essays.
            </p>
            <p class="prompt-counter">
              Showing 5 random prompts from ${writingPrompts.length} available prompts
            </p>
          </div>
          <p class="text-xs text-gray-600 mt-2">
            <strong>Instructions:</strong> Read each prompt carefully and write your response in the text area provided. Your writing will be evaluated based on relevance to the prompt, vocabulary, grammar, and organization.
          </p>
          <div class="mt-3 text-xs">
            <p><strong>Relevance Indicator:</strong></p>
            <div class="flex items-center mt-1 flex-wrap gap-1">
              <div class="relevance-indicator relevance-high">High Relevance</div>
              <div class="relevance-indicator relevance-medium">Medium Relevance</div>
              <div class="relevance-indicator relevance-low">Low Relevance</div>
            </div>
          </div>
        </div>
      `;
      
      mainCard.appendChild(writingElement);
    }

    function displayPrompts() {
      const container = document.getElementById('prompts-container');
      container.innerHTML = '';
      
      selectedPrompts.forEach((prompt, index) => {
        const promptElement = document.createElement('section');
        promptElement.className = 'card rounded-xl mt-6 question-card';
        promptElement.setAttribute('aria-label', `Writing Prompt ${index + 1}`);
        
        const promptId = `prompt_${index}`;
        const storedResponse = userResponses[promptId] || '';
        const wordCount = wordCounts[promptId] || 0;
        const relevanceScore = relevanceScores[promptId] || 0;
        
        // Get relevance display
        const relevanceDisplay = getRelevanceDisplay(relevanceScore, promptId);
        
        promptElement.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <p class="text-[10px] font-semibold">
              ${index + 1}. ${prompt}
            </p>
            <span class="text-[8px] bg-blue-100 text-blue-800 px-2 py-1 rounded">Prompt ${index + 1}/5</span>
          </div>
          <div class="mt-3">
            <textarea 
              id="${promptId}" 
              placeholder="Write your essay here (minimum 150 words)..." 
              rows="8"
              oninput="updateWordCountAndRelevance('${promptId}', '${prompt}')"
            >${storedResponse}</textarea>
            <div class="word-count" id="wordCount_${promptId}">Words: ${wordCount}</div>
          </div>
          ${wordCount >= 150 ? 
            `<div class="score-display">
              <p class="text-sm">Essay length: <span class="score-value">Good</span> (${wordCount} words)</p>
              ${relevanceDisplay}
            </div>` : 
            `<div class="score-display" style="background-color: #fef2f2; border-color: #fecaca;">
              <p class="text-sm">Essay length: <span class="score-value" style="color: #dc2626;">Too Short</span> (${wordCount} words)</p>
              <p class="text-xs mt-1">Your essay needs to be at least 150 words.</p>
            </div>`
          }
        `;
        
        container.appendChild(promptElement);
      });
    }

    function updateWordCountAndRelevance(promptId, promptText) {
      const textarea = document.getElementById(promptId);
      const wordCountElement = document.getElementById(`wordCount_${promptId}`);
      
      if (textarea && wordCountElement) {
        const text = textarea.value.trim();
        const words = text === '' ? 0 : text.split(/\s+/).length;
        
        wordCountElement.textContent = `Words: ${words}`;
        wordCounts[promptId] = words;
        userResponses[promptId] = textarea.value;
        
        // Calculate relevance score
        const relevance = calculateRelevance(text, promptText);
        relevanceScores[promptId] = relevance;
        
        // Save to localStorage
        savePageProgress();
        
        // Update the score display dynamically
        updateScoreDisplay(promptId, words, relevance);
        
        // Update relevance display
        updateRelevanceDisplay(promptId, relevance, promptText, text);
        
        updateValidation();
      }
    }

    function calculateRelevance(text, prompt) {
      if (!text || text.trim().length === 0) return 0;
      
      // Convert to lowercase for case-insensitive matching
      const lowerText = text.toLowerCase();
      const lowerPrompt = prompt.toLowerCase();
      
      // Get keywords for this prompt
      const keywords = promptKeywords[prompt] || extractKeywordsFromPrompt(prompt);
      
      // Calculate keyword matches
      let matches = 0;
      let matchedKeywords = [];
      
      keywords.forEach(keyword => {
        const regex = new RegExp(`\\b${keyword.toLowerCase()}\\b`, 'gi');
        const keywordMatches = (lowerText.match(regex) || []).length;
        if (keywordMatches > 0) {
          matches += keywordMatches;
          matchedKeywords.push(keyword);
        }
      });
      
      // Calculate relevance score (0-100)
      // Base score on keyword matches and text length
      const baseScore = Math.min((matches / Math.max(keywords.length, 1)) * 70, 70);
      
      // Bonus for text length (encourage longer, more detailed responses)
      const wordCount = text.split(/\s+/).length;
      const lengthBonus = Math.min((wordCount / 200) * 30, 30);
      
      const totalScore = Math.min(baseScore + lengthBonus, 100);
      
      // Store matched keywords for display
      relevanceScores[`${prompt}_keywords`] = matchedKeywords;
      
      return Math.round(totalScore);
    }

    function extractKeywordsFromPrompt(prompt) {
      // Simple keyword extraction for prompts without predefined keywords
      const stopWords = ['the', 'a', 'an', 'and', 'or', 'but', 'in', 'on', 'at', 'to', 'for', 'of', 'with', 'by', 'your', 'you', 'should', 'why', 'what', 'how', 'describe', 'write', 'about', 'think', 'opinion', 'view'];
      
      return prompt
        .toLowerCase()
        .replace(/[^\w\s]/g, '')
        .split(/\s+/)
        .filter(word => word.length > 2 && !stopWords.includes(word));
    }

    function getRelevanceDisplay(score, promptId) {
      let relevanceClass = 'relevance-low';
      let relevanceText = 'Low Relevance';
      
      if (score >= 70) {
        relevanceClass = 'relevance-high';
        relevanceText = 'High Relevance';
      } else if (score >= 40) {
        relevanceClass = 'relevance-medium';
        relevanceText = 'Medium Relevance';
      }
      
      return `
        <div class="mt-2">
          <p class="text-sm">Relevance to prompt: <span class="score-value">${score}% - ${relevanceText}</span></p>
          <div class="relevance-indicator ${relevanceClass} mt-1" id="relevance_${promptId}">
            ${relevanceText} (${score}%)
          </div>
        </div>
      `;
    }

    function updateScoreDisplay(promptId, wordCount, relevanceScore) {
      // Find the prompt element
      const promptElement = document.getElementById(promptId);
      if (!promptElement) return;
      
      const parentCard = promptElement.closest('.card');
      if (!parentCard) return;
      
      // Find or create score display
      let scoreDisplay = parentCard.querySelector('.score-display');
      
      if (!scoreDisplay) {
        scoreDisplay = document.createElement('div');
        scoreDisplay.className = 'score-display';
        const textareaContainer = parentCard.querySelector('textarea').parentElement;
        textareaContainer.parentElement.appendChild(scoreDisplay);
      }
      
      // Get relevance display HTML
      const relevanceDisplay = getRelevanceDisplay(relevanceScore, promptId);
      
      // Update score display content
      if (wordCount >= 150) {
        scoreDisplay.style.backgroundColor = '#f0f9ff';
        scoreDisplay.style.borderColor = '#bae6fd';
        scoreDisplay.innerHTML = `
          <p class="text-sm">Essay length: <span class="score-value">Good</span> (${wordCount} words)</p>
          ${relevanceDisplay}
        `;
      } else {
        scoreDisplay.style.backgroundColor = '#fef2f2';
        scoreDisplay.style.borderColor = '#fecaca';
        scoreDisplay.innerHTML = `
          <p class="text-sm">Essay length: <span class="score-value" style="color: #dc2626;">Too Short</span> (${wordCount} words)</p>
          <p class="text-xs mt-1">Your essay needs to be at least 150 words.</p>
        `;
      }
    }

    function updateRelevanceDisplay(promptId, score, promptText, text) {
      const relevanceElement = document.getElementById(`relevance_${promptId}`);
      if (!relevanceElement) return;
      
      let relevanceClass = 'relevance-low';
      let relevanceText = 'Low Relevance';
      
      if (score >= 70) {
        relevanceClass = 'relevance-high';
        relevanceText = 'High Relevance';
      } else if (score >= 40) {
        relevanceClass = 'relevance-medium';
        relevanceText = 'Medium Relevance';
      }
      
      relevanceElement.className = `relevance-indicator ${relevanceClass} mt-1`;
      
      // Show matched keywords if available
      const matchedKeywords = relevanceScores[`${promptText}_keywords`] || [];
      let keywordsHTML = '';
      
      if (matchedKeywords.length > 0) {
        const keywordsDisplay = matchedKeywords.map(kw => 
          `<span class="keyword-match">${kw}</span>`
        ).join('');
        
        keywordsHTML = `
          <div class="mt-1 text-xs">
            Matched keywords: ${keywordsDisplay}
          </div>
        `;
      }
      
      relevanceElement.innerHTML = `
        ${relevanceText} (${score}%)
        ${score < 70 ? `<div class="mt-1 text-xs">Tip: Try to use more keywords related to the prompt.</div>` : ''}
        ${keywordsHTML}
      `;
    }

    function updateValidation() {
      // No validation - allow users to skip writing test
      let completedCount = 0;
      
      selectedPrompts.forEach((prompt, index) => {
        const promptId = `prompt_${index}`;
        const wordCount = wordCounts[promptId] || 0;
        const relevanceScore = relevanceScores[promptId] || 0;
        
        // Count completed for progress indicator only
        if (wordCount >= 150 && relevanceScore >= 40) {
          completedCount++;
        }
      });
      
      // Next button always enabled - no restrictions
      const nextBtn = document.getElementById('nextBtn');
      if (nextBtn) {
        nextBtn.removeAttribute('data-disabled');
        nextBtn.style.opacity = '1';
        nextBtn.style.pointerEvents = 'auto';
      }
      
      updateProgressIndicator(completedCount);
    }

    function updateProgressIndicator(completedCount) {
      let progressIndicator = document.querySelector('.progress-indicator');
      
      if (!progressIndicator) {
        progressIndicator = document.createElement('div');
        progressIndicator.className = 'progress-indicator';
        document.body.appendChild(progressIndicator);
      }
      
      progressIndicator.innerHTML = `<span id="progress-text">Progress: ${completedCount}/5</span>`;
      
      if (completedCount === 5) {
        progressIndicator.classList.add('complete');
        progressIndicator.innerHTML += ' ✓';
      } else {
        progressIndicator.classList.remove('complete');
      }
    }

    // Validation removed - users can skip writing test
    // document.addEventListener('click', ...) - REMOVED

    function initializeCountdown() {
      const totalSeconds = 60 * 60; // 60 minutes
      const progressBar = document.getElementById("progressBar");
      const timeDisplay = document.getElementById("timeDisplay");

      let remainingSeconds = totalSeconds;

      function updateCountdown() {
        if (remainingSeconds < 0) {
          remainingSeconds = 0;
          alert('Time is up! Test will end.');
          return;
        }

        if (progressBar) {
          progressBar.value = remainingSeconds;
        }

        if (timeDisplay) {
          const hours = Math.floor(remainingSeconds / 3600);
          const minutes = Math.floor((remainingSeconds % 3600) / 60);
          const seconds = remainingSeconds % 60;
          timeDisplay.textContent = `${hours}Jam ${minutes}Menit ${seconds}Detik`;
        }

        remainingSeconds--;
      }

      if (progressBar && timeDisplay) {
        updateCountdown();
        setInterval(updateCountdown, 1000);
      }
    }

    function initializeTabSwitchDetection() {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          setTimeout(() => {
            if (document.hidden) {
              alert('Warning: Please focus on the test page.');
            }
          }, 1000);
        }
      });
    }

    function initializeProtection() {
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) {
          e.preventDefault();
        }
      });
    }

    // Save responses when moving to next page
    document.getElementById('nextBtn').addEventListener('click', function(e) {
      if (!this.hasAttribute('data-disabled')) {
        savePageProgress();
        
        // Calculate scores for this page
        let pageScore = 0;
        let maxScore = 5;
        
        selectedPrompts.forEach((prompt, index) => {
          const promptId = `prompt_${index}`;
          const wordCount = wordCounts[promptId] || 0;
          const relevanceScore = relevanceScores[promptId] || 0;
          
          if (wordCount >= 150 && relevanceScore >= 40) {
            pageScore++;
          }
        });
        
        // Save page score
        localStorage.setItem('ielts_writing_personal_score', JSON.stringify({
          score: pageScore,
          maxScore: maxScore,
          percentage: Math.round((pageScore / maxScore) * 100),
          relevanceScores: relevanceScores
        }));
      }
    });
  </script>
