  <script>
   // 3D card tilt effect
    const cards = document.querySelectorAll('.card');
    cards.forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left; // x position within the element.
        const y = e.clientY - rect.top;  // y position within the element.
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * 10; // max 10deg rotation
        const rotateY = ((x - centerX) / centerX) * 10;
        card.style.transform = `rotateX(${-rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
      });
      card.addEventListener('mouseleave', () => {
        card.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
      });
    });

// Navigation based on program selection from page2
    function openTest() {
      const selectedProgram = localStorage.getItem('selectedProgram');

if (selectedProgram === 'business-speaking') {
        // Business Speaking path: go to negotiating speaking
        window.location.href = 'speaking-negotiating-1.html';
      } else if (selectedProgram === 'kickoff-toeic') {
        // TOEIC Kickoff path: go to TOEIC listening with new theme
        window.location.href = 'listening_part1_1.html';
      } else if (selectedProgram === 'academic-english') {
        // Academic English path: go to academic listening
        window.location.href = 'listening_academic_1.html';
      } else if (selectedProgram === 'ielts-a2') {
        // IELTS A2 path: go to IELTS A2 listening test
        window.location.href = 'ielts-a2-listening-1.html';
      } else if (selectedProgram === 'ielts-b1') {
        // IELTS B1 path: go to IELTS B1 reading test first
        window.location.href = 'ielts-b1-reading-1-1.html';
      } else if (selectedProgram === 'basic-english') {
        // Basic English path: go to basic vocabulary test
        window.location.href = 'basic_vocab1.html';
      } else if (selectedProgram === 'toefl-preparation') {
        // TOEFL Preparation path: go to TOEFL listening test
        window.location.href = 'toefl_listening_1.html';
      } else if (selectedProgram === 'practical-english') {
        // Practical English path: generate random questions and go to reading
        const generateRandomQuestions = () => {
          const allIndices = Array.from({length: 15}, (_, i) => i);
          const shuffled = [...allIndices].sort(() => Math.random() - 0.5);
          return shuffled.slice(0, 5).sort((a, b) => a - b);
        };

        // Reading pages
        localStorage.setItem('practical_reading_page4', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_reading_page5', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_reading_page6', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_reading_page7', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_reading_page8', JSON.stringify(generateRandomQuestions()));

        // Listening pages
        localStorage.setItem('practical_listening_page4', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_listening_page5', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_listening_page6', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_listening_page7', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_listening_page8', JSON.stringify(generateRandomQuestions()));

        // Grammar office B1 pages
        localStorage.setItem('practical_grammar_office_page1', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_grammar_office_page2', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_grammar_office_page3', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_grammar_office_page4', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_grammar_office_page5', JSON.stringify(generateRandomQuestions()));

        // Listening doctor pages
        localStorage.setItem('practical_listening_doctor_page1', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_listening_doctor_page2', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_listening_doctor_page3', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_listening_doctor_page4', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_listening_doctor_page5', JSON.stringify(generateRandomQuestions()));

        // Speaking pages
        localStorage.setItem('practical_speaking_page1', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_speaking_page2', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_speaking_page3', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_speaking_page4', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_speaking_page5', JSON.stringify(generateRandomQuestions()));

        // Grammar newyork A1 pages
        localStorage.setItem('practical_grammar_newyork_page1', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_grammar_newyork_page2', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_grammar_newyork_page3', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_grammar_newyork_page4', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_grammar_newyork_page5', JSON.stringify(generateRandomQuestions()));

        // Reading city A1 pages
        localStorage.setItem('practical_reading_city_page1', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_reading_city_page2', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_reading_city_page3', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_reading_city_page4', JSON.stringify(generateRandomQuestions()));
        localStorage.setItem('practical_reading_city_page5', JSON.stringify(generateRandomQuestions()));

        window.location.href = 'page4-reading.html';
      } else {
        // Default: go to page4 (grammar)
        window.location.href = 'page4.html';
      }
    }

// Check if user came from page2 with selection
window.addEventListener('load', function() {
  const selectedProgram = localStorage.getItem('selectedProgram');

if (selectedProgram === 'business-speaking') {

// Update button text

// Update button text

// Update button text

});
