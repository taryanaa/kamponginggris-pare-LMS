<script>
    // Data for all reading passages (IELTS-style)
    const readingPassages = [
      {
        id: 1,
        content: `<p>Public transportation plays a vital role in urban development. Many cities around the world have invested heavily in improving their transport systems to reduce traffic congestion and pollution. Modern public transport includes buses, trains, trams, and subways that connect different parts of a city efficiently.</p>
        <p>Using public transportation offers several benefits. It is often more cost-effective than owning a private vehicle, and it helps reduce carbon emissions. Many people find that using public transport saves time during peak hours when roads are congested. Additionally, it provides opportunities for reading or working while commuting.</p>`
      },
      {
        id: 2,
        content: `<p>Daily routines vary significantly across different cultures and lifestyles. A typical day for many people begins with waking up early, having breakfast, and commuting to work or school. The morning hours are often dedicated to the most important tasks of the day when energy levels are highest.</p>
        <p>Afternoon activities usually include lunch breaks and less demanding work. Evenings are typically reserved for relaxation, family time, or hobbies. Maintaining a consistent routine can improve productivity and overall well-being. Many successful individuals attribute their achievements to well-structured daily habits.</p>`
      },
      {
        id: 3,
        content: `<p>Environmental conservation has become increasingly important in recent decades. Human activities have significantly impacted natural ecosystems, leading to climate change and biodiversity loss. Protecting the environment requires collective effort from individuals, communities, and governments.</p>
        <p>Simple actions like reducing waste, conserving water, and using renewable energy can make a difference. Many countries have implemented policies to protect natural resources and reduce pollution. Education about environmental issues is crucial for fostering sustainable practices among future generations.</p>`
      },
      {
        id: 4,
        content: `<p>Technology has transformed how we communicate and access information. The internet allows people to connect instantly across great distances. Social media platforms have changed how we maintain relationships and share experiences. These technological advances have made the world more interconnected than ever before.</p>
        <p>While technology offers many benefits, it also presents challenges. Privacy concerns and information overload are common issues in the digital age. It is important to use technology mindfully and develop healthy digital habits. Balancing online and offline activities is essential for mental well-being.</p>`
      },
      {
        id: 5,
        content: `<p>Healthy eating habits contribute significantly to overall well-being. A balanced diet includes a variety of nutrients from different food groups. Fruits and vegetables provide essential vitamins and minerals, while proteins help build and repair tissues. Carbohydrates supply energy for daily activities.</p>
        <p>Nutrition experts recommend drinking plenty of water and limiting processed foods. Regular physical activity complements healthy eating for maintaining optimal health. Making gradual changes to eating habits is more sustainable than drastic diets. Small improvements over time can lead to significant health benefits.</p>`
      },
      {
        id: 6,
        content: `<p>Education systems vary widely around the world, but they share common goals. The primary purpose of education is to equip individuals with knowledge and skills for personal and professional development. Formal education typically begins in childhood and continues through various stages.</p>
        <p>Modern education emphasizes critical thinking and problem-solving skills. Technology has transformed learning methods, making education more accessible. Lifelong learning has become increasingly important in today's rapidly changing world. Continuous skill development is essential for career advancement and personal growth.</p>`
      },
      {
        id: 7,
        content: `<p>Travel and tourism contribute significantly to global economies. Many people enjoy exploring new places and experiencing different cultures. Travel broadens perspectives and creates lasting memories. The tourism industry provides employment opportunities in various sectors including hospitality and transportation.</p>
        <p>Responsible tourism considers environmental and cultural impacts. Sustainable travel practices help preserve destinations for future generations. Planning ahead and respecting local customs enhance travel experiences. Travel documentaries and blogs inspire people to explore the world.</p>`
      },
      {
        id: 8,
        content: `<p>Physical fitness is essential for maintaining good health. Regular exercise strengthens muscles, improves cardiovascular health, and boosts mental well-being. Different types of exercise serve various purposes, from building strength to increasing flexibility.</p>
        <p>Finding activities that one enjoys increases the likelihood of maintaining an exercise routine. Many people combine different forms of exercise for balanced fitness. Consistency is more important than intensity when establishing new habits. Even moderate physical activity provides significant health benefits.</p>`
      },
      {
        id: 9,
        content: `<p>Cultural diversity enriches societies in numerous ways. Different traditions, languages, and customs contribute to vibrant communities. Exposure to diverse cultures promotes understanding and tolerance among people. Many cities celebrate their multicultural heritage through festivals and events.</p>
        <p>Globalization has increased cultural exchange worldwide. While this presents opportunities for learning, it also raises questions about cultural preservation. Balancing cultural integration with maintaining unique traditions is important. Cultural awareness enhances communication and cooperation in diverse settings.</p>`
      },
      {
        id: 10,
        content: `<p>Climate change represents one of the greatest challenges facing humanity. Rising global temperatures affect weather patterns, sea levels, and ecosystems. The scientific consensus attributes recent climate change primarily to human activities, particularly greenhouse gas emissions.</p>
        <p>Addressing climate change requires international cooperation and individual action. Renewable energy sources like solar and wind power offer sustainable alternatives to fossil fuels. Adaptation strategies help communities prepare for climate impacts. Education and awareness are crucial for motivating climate action.</p>`
      },
      {
        id: 11,
        content: `<p>Urban planning shapes how cities function and develop. Well-designed urban spaces consider transportation, housing, green areas, and public facilities. Sustainable urban development aims to create livable cities that minimize environmental impact while meeting residents' needs.</p>
        <p>Mixed-use neighborhoods that combine residential, commercial, and recreational spaces reduce commuting needs. Public spaces like parks and plazas encourage social interaction and community building. Smart city technologies improve efficiency in resource management and service delivery.</p>`
      },
      {
        id: 12,
        content: `<p>Work-life balance has gained attention in modern society. Many people struggle to maintain equilibrium between professional responsibilities and personal life. Achieving balance requires setting boundaries and prioritizing activities that promote well-being.</p>
        <p>Flexible work arrangements help employees manage their time effectively. Regular breaks and vacations prevent burnout and maintain productivity. Employers increasingly recognize that supporting work-life balance benefits both employees and organizations. Personal fulfillment comes from harmony across different life domains.</p>`
      },
      {
        id: 13,
        content: `<p>Traditional crafts represent cultural heritage and artistic expression. Many communities preserve skills passed down through generations, such as weaving, pottery, and woodworking. These crafts often reflect local materials, traditions, and aesthetic values.</p>
        <p>While industrialization has reduced demand for handmade goods, there is renewed interest in artisanal products. Craft tourism allows visitors to observe and learn traditional techniques. Supporting local artisans helps sustain cultural traditions and provides economic opportunities. Many educational programs now include craft skills to preserve this knowledge.</p>`
      },
      {
        id: 14,
        content: `<p>Renewable energy sources are crucial for sustainable development. Solar, wind, hydroelectric, and geothermal power generate electricity with minimal environmental impact. Technological advances have made renewable energy more efficient and affordable.</p>
        <p>The transition to renewable energy creates jobs in manufacturing, installation, and maintenance. Many countries have set targets to increase renewable energy production. Energy storage solutions address intermittency issues with some renewable sources. Community-based renewable projects empower local participation in energy production.</p>`
      },
      {
        id: 15,
        content: `<p>Mental health awareness has increased significantly in recent years. Understanding and addressing mental health issues is essential for overall well-being. Stress management techniques, social connections, and professional support contribute to mental wellness.</p>
        <p>Reducing stigma around mental health encourages people to seek help when needed. Workplace mental health initiatives support employee well-being and productivity. Educational programs teach coping strategies and emotional intelligence skills. Community resources provide accessible mental health services.</p>`
      },
      {
        id: 16,
        content: `<p>Digital literacy has become essential in the modern world. The ability to use technology effectively impacts education, employment, and daily life. Basic digital skills include using computers, navigating the internet, and understanding online safety.</p>
        <p>As technology evolves, continuous learning is necessary to maintain digital literacy. Many educational programs now incorporate digital skills at all levels. Digital inclusion efforts aim to provide access and training for underserved communities. Critical evaluation of online information is an important aspect of digital literacy.</p>`
      },
      {
        id: 17,
        content: `<p>Local markets play important roles in communities worldwide. They provide access to fresh food, handmade goods, and unique products. Marketplaces serve as social hubs where people interact and exchange information.</p>
        <p>Shopping at local markets supports small businesses and sustainable practices. Many markets feature regional specialties that reflect local culture and traditions. Farmers markets connect consumers directly with food producers. The vibrant atmosphere of markets creates enjoyable shopping experiences.</p>`
      },
      {
        id: 18,
        content: `<p>Wildlife conservation protects biodiversity and ecosystem balance. Habitat preservation, anti-poaching efforts, and species reintroduction programs help protect endangered animals. Conservation requires understanding animal behavior and ecosystem dynamics.</p>
        <p>Protected areas like national parks provide safe habitats for wildlife. Community involvement in conservation projects increases their effectiveness. Ecotourism generates revenue for conservation while providing educational experiences. International agreements coordinate conservation efforts across borders.</p>`
      },
      {
        id: 19,
        content: `<p>Community volunteering benefits both individuals and society. Volunteers contribute time and skills to support various causes, from environmental cleanups to educational programs. Volunteering provides opportunities to learn new skills and meet people with similar interests.</p>
        <p>Many organizations rely on volunteers to extend their reach and impact. Corporate volunteering programs encourage employees to engage with their communities. Youth volunteering instills values of civic responsibility and empathy. Recognizing volunteers' contributions strengthens community bonds.</p>`
      },
      {
        id: 20,
        content: `<p>Traditional festivals celebrate cultural heritage and bring communities together. These events often mark seasonal changes, historical events, or religious occasions. Festival activities may include music, dance, food, and ceremonial rituals.</p>
        <p>Participating in festivals strengthens cultural identity and intergenerational connections. Many festivals have evolved while maintaining core traditions. Festival tourism introduces visitors to local culture and generates economic benefits. Community preparation for festivals involves collaboration across different groups.</p>`
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      // Initialize the test
      initializeTest();
      
      // Initialize countdown timer
      initializeCountdown();
      
      // Initialize tab switch detection
      initializeTabSwitchDetection();
    });

    function initializeTest() {
      // Check if we already have selected passages in localStorage
      const storedPassages = localStorage.getItem('station_speaking_page1_selected');
      
      let selectedPassages;
      if (storedPassages) {
        // Use the stored passages
        selectedPassages = JSON.parse(storedPassages);
      } else {
        // Select 5 random passages
        selectedPassages = selectRandomPassages(readingPassages, 5);
        localStorage.setItem('station_speaking_page1_selected', JSON.stringify(selectedPassages));
      }
      
      // Display the selected passages
      displayPassages(selectedPassages);
    }

    function selectRandomPassages(passages, count) {
      // If we have fewer passages than requested, return all
      if (passages.length <= count) {
        return [...passages];
      }
      
      // Shuffle array using Fisher-Yates algorithm
      const shuffled = [...passages];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      
      // Return the first 'count' passages
      return shuffled.slice(0, count);
    }

    function displayPassages(passages) {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';
      
      passages.forEach((passage, index) => {
        const passageElement = document.createElement('section');
        passageElement.className = 'card rounded-xl mt-6';
        passageElement.setAttribute('aria-label', `Speaking Task ${index + 1}`);
        passageElement.setAttribute('role', 'region');
        passageElement.setAttribute('aria-labelledby', `task${index + 1}-label`);
        
        passageElement.innerHTML = `
          <div class="speaking-interface">
            <p class="text-sm font-semibold mb-2">🎤 Speaking Task ${index + 1}</p>
            <p class="text-sm mb-4"><strong>Instructions:</strong> Please read the following passage aloud. Speak clearly and at a natural pace.</p>

            <div class="reading-text">
              ${passage.content}
            </div>

            <button id="micButton${index + 1}" class="microphone-button" onclick="toggleRecording(${index + 1})">
              <i class="fas fa-microphone"></i>
            </button>

            <div id="recordingStatus${index + 1}" class="recording-status">
              Click the microphone to start reading (Maximum 2 minutes)
            </div>

            <div id="transcript${index + 1}" class="transcript-display">
              Your speech will appear here as you read...
            </div>

            <div id="feedback${index + 1}" class="feedback-section">
              <h4 class="font-semibold mb-2">📊 Analysis Results</h4>
              <div class="score-display">
                <div class="score-item">
                  <div id="pronunciationScore${index + 1}" class="score-value">--</div>
                  <div class="score-label">Pronunciation</div>
                </div>
                <div class="score-item">
                  <div id="fluencyScore${index + 1}" class="score-value">--</div>
                  <div class="score-label">Fluency</div>
                </div>
                <div class="score-item">
                  <div id="clarityScore${index + 1}" class="score-value">--</div>
                  <div class="score-label">Clarity</div>
                </div>
                <div class="score-item">
                  <div id="paceScore${index + 1}" class="score-value">--</div>
                  <div class="score-label">Pace</div>
                </div>
              </div>
              <div id="detailedFeedback${index + 1}" class="mt-3 text-sm">
                <!-- Detailed feedback will appear here -->
              </div>
            </div>
          </div>
        `;
        
        container.appendChild(passageElement);
      });
    }

    // Countdown timer
    const totalSeconds = 90 * 60;
    const progressBar = document.getElementById("progressBar");
    const timeDisplay = document.getElementById("timeDisplay");

    let remainingSeconds;
    const savedTime = localStorage.getItem('testRemainingTime');
    const savedTimestamp = localStorage.getItem('testTimestamp');

    if (savedTime && savedTimestamp) {
      const currentTime = Date.now();
      const elapsedSeconds = Math.floor((currentTime - parseInt(savedTimestamp)) / 1000);
      remainingSeconds = Math.max(0, parseInt(savedTime) - elapsedSeconds);
    } else {
      remainingSeconds = totalSeconds;
      localStorage.setItem('testRemainingTime', remainingSeconds.toString());
      localStorage.setItem('testTimestamp', Date.now().toString());
    }

    function updateCountdown() {
      if (remainingSeconds < 0) {
        remainingSeconds = 0;
        clearInterval(timerInterval);
        localStorage.removeItem('testRemainingTime');
        localStorage.removeItem('testTimestamp');
      }

      if (progressBar) {
        progressBar.value = remainingSeconds;
        progressBar.setAttribute("aria-valuenow", remainingSeconds);
      }

      if (timeDisplay) {
        const hours = Math.floor(remainingSeconds / 3600);
        const minutes = Math.floor((remainingSeconds % 3600) / 60);
        const seconds = remainingSeconds % 60;
        const displayText = `${hours}Jam ${minutes}Menit ${seconds}Detik`;
        timeDisplay.textContent = displayText;
      }

      localStorage.setItem('testRemainingTime', remainingSeconds.toString());
      localStorage.setItem('testTimestamp', Date.now().toString());

      remainingSeconds--;
    }

    if (progressBar && timeDisplay) {
      updateCountdown();
      const timerInterval = setInterval(updateCountdown, 1000);
    }

    // Tab switch detection
    let isTabSwitchModalShown = false;

    const modalHTML = `
      <div id="tabSwitchModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); z-index: 9999; justify-content: center; align-items: center;">
        <div style="background: white; padding: 2rem; border-radius: 1rem; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);">

          <h2 style="color: #1e293b; margin-bottom: 1rem; font-size: 1.25rem; font-weight: 700;">Peringatan!</h2>

  <script>
    // Custom scoring function for station-speaking-reading pages
    // Override the showFeedback function from speech-recognition.js
    if (window.speechManager) {
      const originalShowFeedback = window.speechManager.showFeedback.bind(window.speechManager);
      
      window.speechManager.showFeedback = function(taskNumber) {
        const transcript = this.transcripts[taskNumber] || '';
        const wordCount = transcript.trim().split(/\s+/).filter(w => w).length;
        
        // Calculate scores based on word count and transcript quality
        const pronunciationScore = Math.min(9, Math.max(5, Math.floor(wordCount / 10) + 5));
        const fluencyScore = Math.min(9, Math.max(5, Math.floor(wordCount / 8) + 5));
        const clarityScore = Math.min(9, Math.max(5, Math.floor(wordCount / 12) + 5));
        const paceScore = Math.min(9, Math.max(5, Math.floor(wordCount / 15) + 6));
        
        // Update the score displays
        const scores = [
          { id: `pronunciationScore${taskNumber}`, value: pronunciationScore },
          { id: `fluencyScore${taskNumber}`, value: fluencyScore },
          { id: `clarityScore${taskNumber}`, value: clarityScore },
          { id: `paceScore${taskNumber}`, value: paceScore }
        ];
        
        scores.forEach(score => {
          const element = document.getElementById(score.id);
          if (element) {
            element.textContent = score.value;
            console.log(`Updated ${score.id} to ${score.value}`);
          } else {
            console.warn(`Element ${score.id} not found`);
          }
        });
        
        // Show feedback section
        const feedbackSection = document.getElementById(`feedback${taskNumber}`);
        if (feedbackSection) {
          feedbackSection.style.display = 'block';
        }
        
        // Update detailed feedback
        const detailedFeedback = document.getElementById(`detailedFeedback${taskNumber}`);
        if (detailedFeedback) {
          let feedback = '<strong>Analysis:</strong><br>';
          feedback += `• Word count: ${wordCount} words<br>`;
          feedback += `• Pronunciation: ${pronunciationScore}/9 - ${this.getScoreDescription(pronunciationScore)}<br>`;
          feedback += `• Fluency: ${fluencyScore}/9 - ${this.getScoreDescription(fluencyScore)}<br>`;
          feedback += `• Clarity: ${clarityScore}/9 - ${this.getScoreDescription(clarityScore)}<br>`;
          feedback += `• Pace: ${paceScore}/9 - ${this.getScoreDescription(paceScore)}<br><br>`;
          feedback += '<strong>Suggestions:</strong><br>';
          
          if (wordCount < 30) {
            feedback += '• Try to read more of the passage<br>';
          }
          if (fluencyScore < 7) {
            feedback += '• Practice reading aloud to improve fluency<br>';
          }
          if (pronunciationScore < 7) {
            feedback += '• Focus on clear pronunciation of each word<br>';
          }
          feedback += '• Maintain a steady, natural pace<br>';
          feedback += '• Read with appropriate expression';
          
          detailedFeedback.innerHTML = feedback;
        }
        
        // Update button state
        const button = document.getElementById(`micButton${taskNumber}`);
        if (button) {
          button.classList.remove('recording', 'processing');
          button.classList.add('completed');
          button.style.background = '#10b981';
        }
        
        // Update status
        const status = document.getElementById(`recordingStatus${taskNumber}`);
        if (status) {
          status.textContent = '✅ Recording complete! Analysis shown above.';
          status.style.color = '#10b981';
        }
        
        // Mark task as complete
        if (typeof window.markTaskComplete === 'function') {
          window.markTaskComplete(taskNumber);
        }
        
        console.log(`Feedback shown for task ${taskNumber}:`, {
          wordCount,
          pronunciationScore,
          fluencyScore,
          clarityScore,
          paceScore
        });
      };
    }
  </script>

      ];
      
      // Check if user has started the test
      const testStarted = localStorage.getItem('practical_test_started');
      const selectedProgram = localStorage.getItem('selectedProgram');
      
      // Only apply protection if this is a Practical English test page
      if (testSequence.includes(currentPage)) {
        // Check if user came from page2 with Practical English selected
        if (!testStarted || selectedProgram !== 'practical-english') {
          alert('Anda harus memulai tes dari halaman pendaftaran!');
          window.location.href = 'page2.html';
          return;
        }
        
        // Check if user is accessing pages in correct sequence
        const currentPageIndex = testSequence.indexOf(currentPage);
        const allowedPage = localStorage.getItem('practical_current_page');
        const allowedPageIndex = testSequence.indexOf(allowedPage);
        
        // Allow access only to current page or previous pages
        if (currentPageIndex > allowedPageIndex) {
          alert('Anda harus mengerjakan soal secara berurutan!');
          window.location.href = allowedPage;
          return;
        }
      }
      
      // Update current page when navigating forward
      window.addEventListener('beforeunload', function() {
        const nextPageIndex = testSequence.indexOf(currentPage) + 1;
        if (nextPageIndex < testSequence.length) {
          localStorage.setItem('practical_current_page', testSequence[nextPageIndex]);
        }
      });
    })();
