<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Kampong Inggris Pare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAVhfQN6Iidxv3MB5_xDK0IMxW5BgIbAgY",
      authDomain: "elearning-d8f98.firebaseapp.com",
      projectId: "elearning-d8f98",
      storageBucket: "elearning-d8f98.appspot.com",
      messagingSenderId: "89538042771",
      appId: "1:89538042771:web:your-app-id" // Replace with actual appId from Firebase Console
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.auth = auth; // Make auth global for form scripts
  </script>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #f0f7ff 0%, #e0f2fe 100%);
      min-height: 100vh;
      margin: 0 !important;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.3) 0%, transparent 50%);
      animation: float 20s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      33% { transform: translateY(-20px) rotate(120deg); }
      66% { transform: translateY(10px) rotate(240deg); }
    }

    .signin-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .signin-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 3rem;
      box-shadow:
        0 25px 50px rgba(59, 130, 246, 0.15),
        0 0 0 1px rgba(255, 255, 255, 0.05);
      max-width: 420px;
      width: 100%;
      position: relative;
      overflow: hidden;
      animation: slideIn 0.8s ease-out;
      transform-style: preserve-3d;
    }

    .signin-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(59, 130, 246, 0.1), transparent);
      animation: shimmer 3s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(50px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
      100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    }

    .logo-section {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeInDown 0.6s ease-out;
    }

    .logo-section img {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      object-fit: contain;
      margin-bottom: 1rem;
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.2);
      transition: all 0.3s ease;
    }

    .logo-section img:hover {
      transform: scale(1.05) rotate(5deg);
      box-shadow: 0 12px 35px rgba(59, 130, 246, 0.3);
    }

    .logo-section h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-section p {
      color: #64748b;
      font-size: 0.875rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .form-group input {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .form-group input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      transform: translateY(-2px);
    }

    .form-group i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 1.1rem;
      transition: color 0.3s ease;
    }

    .form-group input:focus + i,
    .form-group input:focus ~ i {
      color: #3b82f6;
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      padding: 1rem;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .btn-primary:hover::before {
      left: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4);
    }

    .btn-primary:active {
      transform: translateY(-1px);
    }

    .divider {
      text-align: center;
      margin: 2rem 0;
      position: relative;
      color: #64748b;
      font-size: 0.875rem;
    }

    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
    }

    .divider span {
      background: rgba(255, 255, 255, 0.95);
      padding: 0 1rem;
      position: relative;
      z-index: 1;
    }

    .social-btn {
      width: 100%;
      padding: 0.875rem;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.8);
      color: #64748b;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .social-btn:hover {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.05);
      color: #3b82f6;
      transform: translateY(-2px);
    }

    .signup-link {
      text-align: center;
      margin-top: 2rem;
      color: #64748b;
      font-size: 0.875rem;
    }

    .signup-link a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .signup-link a:hover {
      color: #1d4ed8;
      text-decoration: underline;
    }

    .error-message {
      background: linear-gradient(135deg, #fee2e2, #fecaca);
      color: #dc2626;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      border-left: 4px solid #dc2626;
      animation: shake 0.5s ease-in-out;
    }

    .success-message {
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      color: #059669;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      border-left: 4px solid #059669;
      animation: bounceIn 0.5s ease-out;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    @keyframes bounceIn {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.05); }
      70% { transform: scale(0.9); }
      100% { transform: scale(1); opacity: 1; }
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 0.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 640px) {
      .signin-card {
        padding: 2rem;
        margin: 1rem;
      }

      .logo-section img {
        width: 60px;
        height: 60px;
      }

      .logo-section h1 {
        font-size: 1.5rem;
      }
    }

    /* Floating particles animation */
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(59, 130, 246, 0.3);
      border-radius: 50%;
      animation: particleFloat 15s linear infinite;
    }

    .particle:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
    .particle:nth-child(2) { top: 20%; left: 80%; animation-delay: 2s; }
    .particle:nth-child(3) { top: 70%; left: 20%; animation-delay: 4s; }
    .particle:nth-child(4) { top: 60%; left: 90%; animation-delay: 6s; }
    .particle:nth-child(5) { top: 30%; left: 50%; animation-delay: 8s; }

    @keyframes particleFloat {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }
  </style>
  <script src="anti-screenshot-ultimate-v2.js"></script>
</head>
<body>
  <!-- Floating particles -->
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <div class="signin-container">
    <div class="signin-card">
      <div class="logo-section">
        <img src="./img1.png" alt="Kampong Inggris Pare Logo">
        <h1>Welcome Back</h1>
        <p>Sign in to continue your learning journey</p>
      </div>

      <form id="signinForm">
        <div id="messageContainer"></div>

        <div class="form-group">
          <input type="email" id="email" placeholder="Email address" required>
          <i class="fas fa-envelope"></i>
        </div>

        <div class="form-group">
          <input type="password" id="password" placeholder="Password" required>
          <i class="fas fa-lock"></i>
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: #64748b; cursor: pointer;">
            <input type="checkbox" id="remember" style="width: auto; margin: 0;">
            Remember me
          </label>
        </div>

        <button type="submit" class="btn-primary" id="signinBtn">
          <span id="btnText">Sign In</span>
        </button>

        <div class="signup-link">
          <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    // Form submission handling
    document.getElementById('signinForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      if (!email || !password) {
        showMessage('error', 'Email and password are required');
        return;
      }

      const btn = document.getElementById('signinBtn');
      const btnText = document.getElementById('btnText');
      const originalText = btnText.textContent;

      // Show loading state
      btn.disabled = true;
      btnText.innerHTML = '<div class="loading"></div>Signing In...';

      try {
        const userCredential = await signInWithEmailAndPassword(window.auth, email, password);
        const user = userCredential.user;

        // Set persistence if remember me is checked (Firebase default is local for web)
        if (remember) {
          // Persistence is handled by Firebase; local by default
        }

        showMessage('success', 'Login successful! Redirecting...');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);

      } catch (error) {
        let message = 'An error occurred. Please try again.';
        switch (error.code) {
          case 'auth/user-not-found':
            message = 'No account found with this email.';
            break;
          case 'auth/wrong-password':
            message = 'Incorrect password.';
            break;
          case 'auth/invalid-email':
            message = 'Invalid email address.';
            break;
          case 'auth/too-many-requests':
            message = 'Too many failed attempts. Please try again later.';
            break;
          default:
            message = error.message;
        }
        showMessage('error', message);
      } finally {
        // Reset button state
        btn.disabled = false;
        btnText.textContent = originalText;
      }
    });

    function showMessage(type, message) {
      const container = document.getElementById('messageContainer');
      container.innerHTML = `<div class="${type}-message">${message}</div>`;

      // Auto-hide success messages
      if (type === 'success') {
        setTimeout(() => {
          container.innerHTML = '';
        }, 3000);
      }
    }

    // Auth state listener for redirects
    onAuthStateChanged(window.auth, (user) => {
      if (user) {
        // User is signed in, redirect if on signin page
        if (window.location.pathname.includes('signin.html')) {
          window.location.href = 'dashboard.html';
        }
      }
    });

    // Add floating animation to particles
    document.addEventListener('DOMContentLoaded', function() {
      const particles = document.querySelectorAll('.particle');
      particles.forEach((particle, index) => {
        particle.style.animationDelay = `${index * 2}s`;
      });
    });

    // Add subtle hover effect to card
    document.querySelector('.signin-card').addEventListener('mouseenter', function() {
      this.style.transform = 'translateY(-5px) rotateX(2deg)';
    });

    document.querySelector('.signin-card').addEventListener('mouseleave', function() {
      this.style.transform = 'translateY(0) rotateX(0deg)';
    });
  </script>
</body>
</html>
