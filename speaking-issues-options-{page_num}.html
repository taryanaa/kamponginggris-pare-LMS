    // Random selection logic
    function selectRandomTasks(allTasks, count) {
      const shuffled = [...allTasks].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, count);
    }
    
    // Check if we already have selected tasks
    const storageKey = 'business_issues_page5_selected';
    let selectedTasks;
    
    const stored = localStorage.getItem(storageKey);
    if (stored) {
      const storedIds = JSON.parse(stored);
      selectedTasks = allTasks.filter(t => storedIds.includes(t.id));
    } else {
      selectedTasks = selectRandomTasks(allTasks, 5);
      localStorage.setItem(storageKey, JSON.stringify(selectedTasks.map(t => t.id)));
    }
    
    // Render tasks
    function renderTasks() {
      const container = document.getElementById('tasksContainer');
      container.innerHTML = '';
      
      selectedTasks.forEach((task, index) => {
        const taskHtml = `
          <section class="card rounded-xl mb-6" id="task${index + 1}Card">
            <div class="inner-card">
              <div class="speaking-interface">
                <p class="text-sm font-semibold mb-2">ðŸŽ¤ Speaking Task ${index + 1} - Read Aloud</p>
                <p class="text-sm mb-4"><strong>Instructions:</strong> ${task.instructions}</p>
                <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-4 text-left">
                  <p class="text-sm font-semibold mb-2">${task.title}</p>
                  <div class="text-sm leading-relaxed">${task.dialogue}</div>
                </div>
                <p class="text-xs text-blue-600 mb-4"><em>${task.emphasis}</em></p>
                
                <button id="micButton${index + 1}" class="microphone-button" onclick="toggleRecording(${index + 1})">
                  <i class="fas fa-microphone"></i>
                </button>
                
                <div id="recordingStatus${index + 1}" class="recording-status">
                  Click the microphone to start recording
                </div>
                
                <div id="transcript${index + 1}" class="transcript-display">
                  Your speech will appear here as you speak...
                </div>
              </div>
            </div>
          </section>
        `;
        container.innerHTML += taskHtml;
      });
    }
    
    renderTasks();
    
    // Completion tracking
    let completedTasks = {};
    const totalTasks = 5;
    
    function saveCompletion() {
      const completionData = {
        completed: Object.keys(completedTasks).length,
        total: totalTasks,
        tasks: completedTasks,
        selectedIds: selectedTasks.map(t => t.id),
        timestamp: new Date().toISOString()
      };
      localStorage.setItem('business_issues_page5_answers', JSON.stringify(completionData));
      console.log('Saved completion for business_issues_page5:', completionData);
    }
    
    window.markTaskComplete = function(taskNumber) {
      completedTasks[`task${taskNumber}`] = {
        completed: true,
        taskId: selectedTasks[taskNumber - 1].id,
        timestamp: new Date().toISOString()
      };
      saveCompletion();
    };
    
    window.toggleRecording = function(taskNumber) {
      setTimeout(() => {
        markTaskComplete(taskNumber);
      }, 1000);
    };
    
    // Load saved completion
    document.addEventListener('DOMContentLoaded', function() {
      const savedData = localStorage.getItem('business_issues_page5_answers');
      if (savedData) {
        try {
          const data = JSON.parse(savedData);
          completedTasks = data.tasks || {};
        } catch (e) {
          console.error('Error loading saved completion:', e);
        }
      }
    });
    
    // Page protection
    (function() {
      const testSequence = [
        'page3.html',
        'speaking-negotiating-1.html', 'speaking-negotiating-2.html', 'speaking-negotiating-3.html',
        'speaking-negotiating-4.html', 'speaking-negotiating-5.html',

        'speaking-meeting-summary-4.html', 'speaking-meeting-summary-5.html',
        'speaking-business-results.html'
      ];
      
      const currentPage = window.location.pathname.split('/').pop();
      const testStarted = localStorage.getItem('business_test_started');
      const selectedProgram = localStorage.getItem('selectedProgram');
      
      if (testSequence.includes(currentPage)) {
        if (!testStarted || selectedProgram !== 'business-speaking') {
          alert('Anda harus memulai tes dari halaman pendaftaran!');
          window.location.href = 'page2.html';
          return;
        }
        
        const currentPageIndex = testSequence.indexOf(currentPage);
        const allowedPage = localStorage.getItem('business_current_page');
        const allowedPageIndex = testSequence.indexOf(allowedPage);
        
        if (currentPageIndex > allowedPageIndex) {
          alert('Anda harus mengerjakan soal secara berurutan!');
          window.location.href = allowedPage;
          return;
        }
      }
      
      window.addEventListener('beforeunload', function() {
        const nextPageIndex = testSequence.indexOf(currentPage) + 1;
        if (nextPageIndex < testSequence.length) {
          localStorage.setItem('business_current_page', testSequence[nextPageIndex]);
        }
      });
    })();
